.dash-card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.dash-card-h h3{margin:0;font:700 17px 'Cormorant Garamond',serif;color:var(--green-900)}
.dash-card-h h3 b{color:var(--green-700)}
.dash-legend-note{font:700 10px 'Inter';letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2)}
.dash-map-card{margin-bottom:16px}
.dash-map{position:relative;width:100%;aspect-ratio:2.1/1;border-radius:14px;
  background:radial-gradient(120% 120% at 50% 0,#eef3ee,#e3ebe4);overflow:hidden;
  background-image:radial-gradient(circle at 22% 36%,#cfe0d2 0 19%,transparent 20%),radial-gradient(circle at 50% 34%,#cfe0d2 0 9%,transparent 10%),radial-gradient(circle at 52% 58%,#cfe0d2 0 17%,transparent 18%),radial-gradient(circle at 72% 48%,#cfe0d2 0 11%,transparent 12%),radial-gradient(circle at 30% 66%,#cfe0d2 0 13%,transparent 14%)}
.dash-bubble{position:absolute;transform:translate(-50%,-50%);text-align:center;width:120px}
.db-label{font:700 12px 'Inter';color:var(--green-900);margin-bottom:4px;text-shadow:0 1px 2px rgba(255,255,255,.8)}
.db-pills{display:flex;gap:6px;justify-content:center}
.db-pill{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font:800 13px 'Inter';color:#fff;box-shadow:var(--shadow-sm)}
.db-pill.t{background:linear-gradient(135deg,#d9a441,#b9802a)}
.db-pill.d{background:linear-gradient(135deg,#2E7D32,#103d17)}
.db-prog{font:600 10.5px 'Inter';color:var(--muted);margin-top:3px;text-shadow:0 1px 2px rgba(255,255,255,.8)}
.dash-donuts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.dash-donuts{grid-template-columns:1fr}}
.donut-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.donut{width:100%;max-width:210px;height:auto}
.donut-legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;width:100%}
.donut-legend .dl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2);padding:3px 7px;border-radius:8px;transition:background 200ms var(--ease-soft,ease)}
.donut-legend .dl i{width:11px;height:11px;border-radius:3px;display:inline-block}
.donut-legend .dl small{color:var(--muted-2);font-variant-numeric:tabular-nums}
.donut-legend .dl-click{cursor:pointer}
.donut-legend .dl-click:hover{background:var(--green-50)}
.donut-seg{transition:opacity 200ms ease, stroke-width 200ms ease}
.donut:hover .donut-seg{opacity:.55}
.donut .donut-seg:hover{opacity:1;stroke-width:34}
.dash-kpi--click{cursor:pointer;transition:transform 260ms cubic-bezier(.32,.72,0,1), box-shadow 260ms cubic-bezier(.32,.72,0,1), border-color 260ms cubic-bezier(.32,.72,0,1)}
.dash-kpi--click:hover{transform:translateY(-2px);border-color:var(--green-300);box-shadow:0 12px 28px -10px rgba(16,94,32,.25)}
.dash-kpi--click:active{transform:translateY(0) scale(.99)}
.dash-bubble--click{cursor:pointer;transition:transform 280ms cubic-bezier(.32,.72,0,1)}
.dash-bubble--click:hover{transform:translate(-50%,-52%) scale(1.06)}
.dash-bubble--click:hover .db-pill{box-shadow:0 8px 18px -4px rgba(16,94,32,.35)}
.dash-drill-hint{display:inline-block;font:600 11px 'Inter';color:var(--green-700);background:var(--green-50);border:1px solid var(--green-100);border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:middle}
/* KPIs statiques (info pure, sans drill-down) — pas de hover-lift trompeur */
.kpi--static{cursor:default !important}
.kpi--static:hover{transform:none !important;box-shadow:0 1px 2px rgba(16,94,32,.08) !important;border-color:var(--line) !important}

/* ===== Active filters bar (chips de drill-down visibles) ===== */
.af-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#f8fbf8);border:1px solid var(--green-100);border-radius:14px;padding:10px 14px;margin:6px 0 14px;box-shadow:0 1px 2px rgba(16,94,32,.06)}
.af-lead{font-size:12.5px;color:var(--muted)}
.af-lead b{color:var(--green-800);font-variant-numeric:tabular-nums;margin:0 2px}
.af-chip{display:inline-flex;align-items:center;gap:7px;background:var(--green-50);border:1px solid var(--green-100);color:var(--green-900);border-radius:999px;padding:5px 9px 5px 11px;font:500 12px 'Inter';cursor:pointer;transition:background 200ms cubic-bezier(.32,.72,0,1), transform 200ms cubic-bezier(.32,.72,0,1), box-shadow 200ms cubic-bezier(.32,.72,0,1)}
.af-chip:hover{background:#fff;border-color:var(--green-300);box-shadow:0 4px 10px -4px rgba(16,94,32,.2)}
.af-chip:active{transform:scale(.97)}
.af-chip .af-ico{font-size:13px}
.af-chip .af-lbl{color:var(--muted);font-size:11px;letter-spacing:.02em}
.af-chip .af-val{color:var(--green-900);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-chip .af-x{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(16,94,32,.12);font-size:9px;line-height:1;color:var(--green-800);margin-left:2px}
.af-chip:hover .af-x{background:var(--bad-bg);color:var(--bad)}
.af-reset{margin-left:auto;background:transparent;border:0;color:var(--muted);font:600 11.5px 'Inter';cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.af-reset:hover{color:var(--bad)}

/* ===== Fiche projet (vue dédiée post-création) ===== */
.proj-detail{animation:pd-in 480ms var(--ease-soft) both}
@keyframes pd-in{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.proj-detail-h{padding:6px;border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.35));box-shadow:0 24px 60px -22px rgba(16,94,32,.22), inset 0 1px 0 rgba(255,255,255,.6);margin-bottom:18px}
.proj-detail-h > .ui-eye{margin:18px 0 6px 22px;display:inline-block}
.proj-detail-title{font:700 36px/1.05 'Cormorant Garamond',serif;color:var(--green-900);margin:6px 22px 4px;letter-spacing:-.015em;text-wrap:balance}
.proj-detail-sub{margin:0 22px 20px;color:var(--muted);font-size:14px;max-width:65ch}
.proj-detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
@media(max-width:760px){.proj-detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.proj-detail-grid{grid-template-columns:1fr}}
.pd-cell{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(16,94,32,.08);transition:transform 320ms cubic-bezier(.32,.72,0,1), box-shadow 320ms cubic-bezier(.32,.72,0,1)}
.pd-cell:hover{transform:translateY(-2px);box-shadow:0 6px 18px -8px rgba(16,94,32,.22)}
.pd-k{font:700 10px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
.pd-v{font:700 20px 'Cormorant Garamond',serif;color:var(--green-900);margin-top:4px;font-variant-numeric:tabular-nums}
.proj-detail-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}

/* ===== Empty-state hero (portefeuille filtré par projet vide) ===== */
.pf-empty-hero{background:linear-gradient(180deg,#fff,#f6fbf6);border:1px solid var(--green-100);border-radius:24px;padding:54px 28px;text-align:center;box-shadow:0 24px 60px -22px rgba(16,94,32,.18), inset 0 1px 0 rgba(255,255,255,.8);animation:pd-in 520ms cubic-bezier(.32,.72,0,1) both;margin-top:14px}
.pf-empty-illus{display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;filter:drop-shadow(0 8px 24px rgba(16,94,32,.18))}
.pf-empty-eye{display:inline-block;font:700 10px 'Inter',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--green-700);background:var(--green-50);border:1px solid var(--green-100);border-radius:999px;padding:5px 12px;margin-bottom:10px}
.pf-empty-title{font:700 30px/1.1 'Cormorant Garamond',serif;color:var(--green-900);margin:0 auto 10px;max-width:560px;text-wrap:balance;letter-spacing:-.01em}
.pf-empty-body{margin:0 auto 26px;color:var(--muted);font-size:14px;max-width:50ch;line-height:1.6}
.pf-empty-actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.pf-empty-actions .btn.primary{display:inline-flex;align-items:center;gap:10px;padding:11px 14px 11px 22px}

/* ===== POLISH GLOBAL — easings, motion, micro-interactions (v0.10) ===== */
:root{
  --ease-soft:cubic-bezier(.32,.72,0,1);
  --ease-out-quart:cubic-bezier(.25,1,.5,1);
  --ease-spring:cubic-bezier(.5,1.55,.4,.98);
  --shadow-green-sm:0 1px 2px rgba(16,94,32,.08), 0 0 0 1px rgba(16,94,32,.04);
  --shadow-green-md:0 6px 18px -8px rgba(16,94,32,.22), 0 1px 3px rgba(16,94,32,.06);
  --shadow-green-lg:0 24px 60px -22px rgba(16,94,32,.32), 0 4px 12px -6px rgba(16,94,32,.1);
}
/* Tabular nums sur tous les chiffres KPI/dashboards/portefeuille */
.kpi .v, .dash-kpi .v, .v, td.t-num, .kpi-b b, .ref-count{font-variant-numeric:tabular-nums}
/* Cards : inner highlight (Double-Bezel light) — physical feel */
.card{position:relative;transition:box-shadow 380ms var(--ease-soft), transform 380ms var(--ease-soft)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);opacity:.9}
/* KPI hover physics (Q3 — déjà filtrants, on rend le ressenti physique) */
.kpi{transition:transform 320ms var(--ease-soft), box-shadow 320ms var(--ease-soft), border-color 320ms var(--ease-soft);cursor:pointer}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-green-md);border-color:var(--green-300)}
.kpi:active{transform:translateY(0) scale(.99);transition-duration:120ms}
/* Boutons : spring + pressed feedback */
.btn{transition:transform 240ms var(--ease-soft), background 240ms var(--ease-soft), box-shadow 240ms var(--ease-soft), border-color 240ms var(--ease-soft);will-change:transform}
.btn:active{transform:scale(.97)}
.btn.primary{box-shadow:0 4px 14px -4px rgba(46,125,50,.45), inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{box-shadow:0 10px 24px -8px rgba(46,125,50,.55), inset 0 1px 0 rgba(255,255,255,.22);transform:translateY(-1px)}
.btn.ghost:hover{background:var(--green-50);border-color:var(--green-300)}
/* Projets cards — déjà animées, on tinte l'ombre en vert */
.proj-card:hover{box-shadow:var(--shadow-green-md)}
/* Pills : hover lift */
.pill{transition:transform 220ms var(--ease-soft)}
/* Sidebar items */
.sb-item{transition:background 200ms var(--ease-soft), color 200ms var(--ease-soft), transform 200ms var(--ease-soft)}
.sb-item:not(.on):hover{transform:translateX(2px)}
/* Toast : ressenti spring + colored shadow + variantes */
.toast{transition:transform 380ms var(--ease-spring), opacity 380ms var(--ease-soft) !important;box-shadow:var(--shadow-green-lg) !important}
.toast.show{transform:translate(-50%, 0) scale(1) !important}
.toast.toast-err{background:#fff;color:var(--bad);border:1px solid #f4c8c8;box-shadow:0 24px 60px -22px rgba(185,28,28,.35) !important}
.toast.toast-ok{background:linear-gradient(180deg,#fff,#f6fbf6);color:var(--green-800);border:1px solid var(--green-100)}

/* ===== MODALE PREMIUM (UI.prompt/confirm/alert) ===== */
.ui-wrap{position:fixed;inset:0;z-index:9990;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity 240ms var(--ease-soft)}
.ui-wrap.ui-in{opacity:1}
.ui-wrap.ui-out{opacity:0}
.ui-back{position:absolute;inset:0;background:rgba(10,30,16,.42);backdrop-filter:blur(8px) saturate(120%);-webkit-backdrop-filter:blur(8px) saturate(120%)}
.ui-shell{position:relative;width:min(520px, calc(100% - 8px));padding:6px;border-radius:24px;
  background:linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.35));
  box-shadow:0 30px 80px -20px rgba(16,35,26,.45), 0 0 0 1px rgba(255,255,255,.4);
  transform:translateY(14px) scale(.98);opacity:0;transition:transform 380ms var(--ease-spring), opacity 280ms var(--ease-soft)}
.ui-wrap.ui-in .ui-shell{transform:translateY(0) scale(1);opacity:1}
.ui-wrap.ui-out .ui-shell{transform:translateY(8px) scale(.985);opacity:0}
.ui-modal{background:#ffffff;border-radius:calc(24px - 6px);padding:26px 28px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.ui-modal--danger{box-shadow:inset 0 0 0 1px rgba(185,28,28,.08)}
.ui-eye{display:inline-block;font:700 10px 'Inter',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--green-700);background:var(--green-50);border:1px solid var(--green-100);border-radius:999px;padding:4px 10px;margin-bottom:10px}
.ui-modal--danger .ui-eye{color:var(--bad);background:var(--bad-bg);border-color:#f4c8c8}
.ui-title{margin:0 0 6px;font:700 22px 'Cormorant Garamond',serif;color:var(--ink);letter-spacing:-.01em}
.ui-body{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.55}
.ui-form{display:flex;flex-direction:column;gap:14px;margin:14px 0 6px}
.ui-fld{display:flex;flex-direction:column;gap:6px}
.ui-lbl{font:700 11px 'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.ui-lbl em{color:var(--bad);font-style:normal;margin-left:3px}
.ui-fld input, .ui-fld select, .ui-fld textarea{font:500 14px 'Inter',sans-serif;color:var(--ink);background:#fafbf9;border:1px solid var(--line-2);border-radius:11px;padding:11px 14px;outline:none;transition:border-color 240ms var(--ease-soft), box-shadow 240ms var(--ease-soft), background 240ms var(--ease-soft)}
.ui-fld input:focus, .ui-fld select:focus, .ui-fld textarea:focus{background:#fff;border-color:var(--green-700);box-shadow:0 0 0 4px rgba(46,125,50,.13)}
.ui-fld textarea{resize:vertical;min-height:84px;line-height:1.55}
.ui-fld .ui-err{border-color:var(--bad);box-shadow:0 0 0 4px rgba(185,28,28,.12);animation:ui-shake .35s var(--ease-soft)}
.ui-hint{font-size:11.5px;color:var(--muted-2);line-height:1.4}
.ui-act{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:18px}
.ui-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;padding:10px 14px 10px 18px;font:700 13px 'Inter',sans-serif;cursor:pointer;transition:transform 240ms var(--ease-soft), background 240ms var(--ease-soft), color 240ms var(--ease-soft), box-shadow 240ms var(--ease-soft);will-change:transform}
.ui-btn:active{transform:scale(.96)}
.ui-btn--ghost{background:transparent;color:var(--ink-2);padding:10px 18px}
.ui-btn--ghost:hover{background:var(--green-50);color:var(--green-800)}
.ui-btn--primary{background:var(--green-700);color:#fff;box-shadow:0 6px 18px -6px rgba(46,125,50,.55), inset 0 1px 0 rgba(255,255,255,.22)}
.ui-btn--primary:hover{background:var(--green-800);transform:translateY(-1px);box-shadow:0 10px 22px -6px rgba(27,94,32,.55)}
.ui-modal--danger .ui-btn--primary{background:var(--bad);box-shadow:0 6px 18px -6px rgba(185,28,28,.55)}
.ui-modal--danger .ui-btn--primary:hover{background:#9b1818}
.ui-btn-arrow{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);font-size:13px;line-height:1;transition:transform 280ms var(--ease-spring)}
.ui-btn--primary:hover .ui-btn-arrow{transform:translateX(2px)}
@keyframes ui-shake{
  0%{transform:translateX(0)} 25%{transform:translateX(-4px)} 50%{transform:translateX(4px)} 75%{transform:translateX(-2px)} 100%{transform:translateX(0)}
}
@media(max-width:520px){
  .ui-shell{width:100%;border-radius:20px}
  .ui-modal{padding:22px 20px 18px}
  .ui-title{font-size:20px}
}

/* v0.12 — touch ≥44px et kanban responsive (1 col swipe sous 560px) */
@media (pointer:coarse){
  .kpi, .chip, .btn, .sb-item, .tb-btn, .pill{min-height:44px}
  .tb-lang button{min-height:44px;padding:11px 14px}
  .ref-chip{min-height:44px}
  .kn-card{min-height:48px;padding:14px}
}
@media (max-width:560px){
  .kn-col{flex:0 0 calc(100vw - 60px);max-height:none}
  .kanban{padding-bottom:24px}
}

/* v0.11 — prefers-reduced-motion : couper toutes les animations/transitions */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .sb-foot .dot, .tb-btn.ai .dot{animation:none;box-shadow:none}
}

/* ==========================================================================
 * v0.17 — ADMIN ACCESS PRO MAX (Users & Roles refonte)
 * Cible : refonte ciblée de l'onglet Admin > Accès, sans toucher aux 11
 * autres écrans. Tous les sélecteurs préfixés .ax-* pour isolation totale.
 * ========================================================================== */
@keyframes ax-drawLine{to{stroke-dasharray:none;stroke-dashoffset:0}}
@keyframes ax-fadeIn{to{opacity:.18}}
@keyframes ax-pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.6);opacity:0}}
@keyframes ax-slideIn{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes ax-toastIn{to{transform:translateY(0);opacity:1}}
@keyframes ax-rowIn{to{opacity:1;transform:translateY(0)}}

/* Hero éditorial */
.ax-eyebrow{display:inline-flex;align-items:center;gap:9px;font:700 11px 'Inter';letter-spacing:.12em;text-transform:uppercase;color:var(--green-700);margin-bottom:12px}
.ax-eyebrow::before{content:'';width:24px;height:1px;background:var(--green-500)}
.ax-h{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:46px;line-height:1;margin:0 0 14px;color:var(--green-900);letter-spacing:-.025em}
.ax-h em{font-style:italic;color:var(--green-700);font-weight:500;display:block}
.ax-lead{max-width:54ch;color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 18px}
.ax-sig{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin-top:14px}
.ax-sig::before{content:'';width:24px;height:1px;background:var(--muted)}

/* KPI strip avec sparklines */
.ax-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 22px;background:linear-gradient(180deg,transparent,var(--soft))}
.ax-kpi{padding:18px 22px 18px 0;border-right:1px solid var(--line);position:relative}
.ax-kpi:first-child{padding-left:0}
.ax-kpi:last-child{padding-right:0;border-right:0}
.ax-kpi-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ax-kpi-lbl{font:700 10.5px 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ax-kpi-trend{margin-left:auto;font:600 11px 'Inter';padding:1px 7px;border-radius:999px}
.ax-kpi-trend.up{background:var(--green-50);color:var(--green-700)}
.ax-kpi-trend.down{background:var(--warn-bg);color:var(--warn)}
.ax-kpi-trend.flat{background:#eef0ef;color:var(--muted)}
.ax-kpi-val{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:.95;color:var(--green-900);font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.ax-kpi-val .u{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.ax-kpi-sub{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}
.ax-kpi-sub strong{font-weight:600;color:var(--ink-2)}
.ax-kpi-sub a{color:var(--warn);font-weight:600;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.ax-kpi.warn .ax-kpi-val{color:var(--warn)}
.ax-spark{display:block;width:100%;height:32px;margin-top:10px}
.ax-spark path.line{fill:none;stroke:var(--green-700);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.ax-spark path.area{fill:url(#ax-spark-grad);opacity:0}
.ax-spark.warn path.line{stroke:var(--warn)}
.ax-spark.warn path.area{fill:url(#ax-spark-grad-warn)}
.ax-spark.revealed path.line{animation:ax-drawLine 1.3s var(--ease-out-quart) forwards}
.ax-spark.revealed path.area{animation:ax-fadeIn .8s .4s var(--ease-out-quart) forwards}

/* Filters & search */
.ax-filters{display:flex;align-items:center;gap:14px;margin:0 0 12px;flex-wrap:wrap}
.ax-search{position:relative;flex:0 0 320px}
.ax-search input{width:100%;padding:9px 14px 9px 36px;border-radius:10px;border:1px solid var(--line-2);background:#fff;font:500 13.5px 'Inter';color:var(--ink);min-height:38px;transition:border-color .18s,box-shadow .18s}
.ax-search input::placeholder{color:var(--muted)}
.ax-search input:focus-visible{border-color:var(--green-500);box-shadow:var(--ring-focus);outline:none}
.ax-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.ax-chips{display:flex;gap:4px;flex-wrap:wrap}
.ax-chip{padding:6px 12px;border-radius:999px;font:500 12.5px 'Inter';color:var(--ink-2);background:transparent;border:1px solid transparent;cursor:pointer;min-height:32px;transition:background .18s,color .18s}
.ax-chip:hover{background:var(--green-50);color:var(--green-900)}
.ax-chip.on{background:var(--green-900);color:#fff}
.ax-chip .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:5px}
.ax-count{font-size:12.5px;color:var(--muted);margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.ax-count strong{color:var(--ink-2);font-weight:600}

/* Batch bar */
.ax-batch{position:sticky;top:60px;z-index:6;background:var(--green-900);color:#fff;border-radius:12px;padding:10px 18px;margin-bottom:8px;display:none;align-items:center;gap:14px;box-shadow:var(--shadow-green-md);animation:ax-slideIn 240ms var(--ease-spring)}
.ax-batch.on{display:flex}
.ax-batch .n{font:600 13px 'Inter';display:inline-flex;align-items:center;gap:8px}
.ax-batch .sp{flex:1}
.ax-batch .b{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font:600 12.5px 'Inter';cursor:pointer;transition:background .18s,border-color .18s}
.ax-batch .b:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.4)}
.ax-batch .x{background:transparent;border:0;color:#fff;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;cursor:pointer;transition:background .18s}
.ax-batch .x:hover{background:rgba(255,255,255,.1)}

/* Table users */
.ax-users{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:32px}
.ax-users table{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.ax-users thead{background:#fbfdfb;position:sticky;top:60px;z-index:3}
.ax-users th{text-align:left;padding:12px 18px;font:700 10.5px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.ax-users th.s{cursor:pointer;transition:color .18s}
.ax-users th.s:hover{color:var(--ink)}
.ax-users th .sx{display:inline-flex;align-items:center;gap:5px}
.ax-users th .sx svg{width:11px;height:11px;color:var(--muted);transition:opacity .18s;opacity:.4}
.ax-users th[aria-sort]:not([aria-sort="none"]){color:var(--ink)}
.ax-users th[aria-sort]:not([aria-sort="none"]) .sx svg{opacity:1;color:var(--green-700)}
.ax-users th[aria-sort="descending"] .sx svg{transform:rotate(180deg)}
.ax-users th.cb{width:40px;padding-left:18px;padding-right:0}
.ax-users td{padding:14px 18px;vertical-align:middle;border-bottom:1px solid var(--line);position:relative}
.ax-users tbody tr{opacity:0;transform:translateY(6px);animation:ax-rowIn 420ms var(--ease-out-quart) forwards;transition:background 120ms var(--ease-out-quart)}
.ax-users tbody tr:nth-child(1){animation-delay:.04s}.ax-users tbody tr:nth-child(2){animation-delay:.08s}
.ax-users tbody tr:nth-child(3){animation-delay:.12s}.ax-users tbody tr:nth-child(4){animation-delay:.16s}
.ax-users tbody tr:nth-child(5){animation-delay:.20s}.ax-users tbody tr:nth-child(6){animation-delay:.24s}
.ax-users tbody tr:nth-child(7){animation-delay:.28s}.ax-users tbody tr:nth-child(8){animation-delay:.32s}
.ax-users tbody tr:nth-child(9){animation-delay:.36s}
.ax-users tbody tr:hover{background:linear-gradient(90deg,var(--green-50),var(--soft))}
.ax-users tbody tr:hover td:first-child::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green-500);border-radius:0 2px 2px 0}
.ax-users tbody tr.sel{background:var(--green-50)}
.ax-users tbody tr:last-child td{border-bottom:0}

.ax-cb{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1.5px solid var(--line-2);border-radius:5px;background:#fff;cursor:pointer;display:grid;place-items:center;transition:background .18s,border-color .18s;vertical-align:middle}
.ax-cb:hover{border-color:var(--green-500)}
.ax-cb:checked{background:var(--green-700);border-color:var(--green-700)}
.ax-cb:checked::after{content:'';width:11px;height:11px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");background-size:contain;background-repeat:no-repeat}
.ax-cb:focus-visible{outline:none;box-shadow:var(--ring-focus)}
.ax-cb:indeterminate{background:var(--green-700);border-color:var(--green-700)}
.ax-cb:indeterminate::after{content:'';width:10px;height:2px;background:#fff;border-radius:1px;background-image:none}

.ax-user{display:flex;align-items:center;gap:11px;min-width:0}
.ax-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 11.5px 'Inter';flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4);background:linear-gradient(135deg,var(--green-100),var(--green-200));color:var(--green-900)}
.ax-av.a1{background:linear-gradient(135deg,#ece4d0,#d8c896);color:#6a5520}
.ax-av.a2{background:linear-gradient(135deg,#d6e3da,#98c1ad);color:#1f5439}
.ax-av.a3{background:linear-gradient(135deg,#e2dde8,#b9a8d0);color:#46365e}
.ax-av.a4{background:linear-gradient(135deg,#d8e8f0,#a3c7d9);color:#1f4e62}
.ax-uname{font:600 13.5px 'Inter';line-height:1.2;color:var(--ink)}
.ax-uupn{font:500 11.5px 'Inter';color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}

.ax-roles{display:flex;flex-wrap:wrap;gap:4px}
.ax-role{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font:600 11px 'Inter';line-height:1.3;background:var(--green-50);color:var(--green-900);border:1px solid var(--green-100);white-space:nowrap}
.ax-role.adm{background:var(--green-900);color:#fff;border-color:var(--green-900)}
.ax-role.com{background:var(--warn-bg);color:var(--warn);border-color:#f0d68a}
.ax-role.read{background:#eef0ef;color:var(--muted);border-color:var(--line)}

.ax-scope{font:500 12.5px 'Inter';color:var(--ink-2);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

.ax-mfa{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font:600 11px 'Inter'}
.ax-mfa.on{background:var(--green-50);color:var(--green-700);border:1px solid rgba(46,125,50,.25)}
.ax-mfa.off{background:var(--warn-bg);color:var(--warn);border:1px solid #f0d68a;position:relative}
.ax-mfa.off::after{content:'';position:absolute;inset:-3px;border-radius:999px;background:#f0d68a;z-index:-1;animation:ax-pulse 2.4s var(--ease-out-quart) infinite;opacity:.4}
.ax-mfa svg{width:12px;height:12px}

.ax-last{font:500 12.5px 'Inter';color:var(--ink-2)}
.ax-last small{display:block;color:var(--muted);font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums}

.ax-rowact{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .18s var(--ease-out-quart)}
.ax-users tbody tr:hover .ax-rowact,
.ax-users tbody tr:focus-within .ax-rowact{opacity:1}
.ax-icob{background:transparent;border:0;cursor:pointer;width:32px;height:32px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .18s,color .18s,transform .12s;font-family:inherit}
.ax-icob:hover{background:var(--green-50);color:var(--green-900)}
.ax-icob:active{transform:scale(.92)}
.ax-icob svg{width:16px;height:16px}

/* RBAC mini-matrix */
.ax-rbac-head{display:flex;align-items:end;justify-content:space-between;margin:32px 0 14px;gap:14px}
.ax-rbac-head .ax-eyebrow{margin-bottom:6px}
.ax-rbac-head h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:26px;margin:0;color:var(--green-900);letter-spacing:-.015em}
.ax-rbac-head h3 em{font-style:italic;color:var(--muted);font-weight:500}
.ax-rbac{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;font-size:12.5px;box-shadow:var(--shadow-sm);margin-bottom:24px}
.ax-rbac table{width:100%;border-collapse:separate;border-spacing:0}
.ax-rbac th,.ax-rbac td{padding:12px 18px;text-align:center;border-bottom:1px solid var(--line)}
.ax-rbac th{background:#fbfdfb;font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.ax-rbac th.rc,.ax-rbac td.rc{text-align:left;width:220px}
.ax-rbac td.rc{font-weight:600;color:var(--green-900)}
.ax-rbac td.rc span{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px}
.ax-rbac tbody tr:hover{background:var(--soft)}
.ax-rbac tbody tr:last-child td{border-bottom:0}
.ax-perm{display:inline-flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:5px;font:700 11px 'Inter';transition:transform .14s var(--ease-spring)}
.ax-perm:hover{transform:scale(1.15)}
.ax-perm.y{background:var(--green-100);color:var(--green-900)}
.ax-perm.r{background:var(--warn-bg);color:var(--warn)}
.ax-perm.n{background:#eef0ef;color:var(--muted)}
.ax-rbac-foot{padding:11px 18px;font:500 11.5px 'Inter';color:var(--muted);border-top:1px solid var(--line);background:var(--soft);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ax-rbac-foot .lk{display:inline-flex;align-items:center;gap:6px}
.ax-rbac-foot .lk .ax-perm{width:22px;height:18px;font-size:10px}

/* Modal édition */
.ax-scrim{position:fixed;inset:0;background:rgba(13,37,16,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:120;opacity:0;pointer-events:none;transition:opacity .22s var(--ease-out-quart)}
.ax-scrim.on{opacity:1;pointer-events:auto}
.ax-scrim .ax-mw{position:fixed;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none}
.ax-scrim.on .ax-mw{pointer-events:auto}
.ax-modal{background:#fff;border-radius:20px;width:780px;max-width:100%;max-height:92dvh;overflow:hidden;box-shadow:var(--shadow-lg);display:grid;grid-template-rows:auto 1fr auto;transform:scale(.94) translateY(12px);opacity:0;transition:transform .34s var(--ease-spring),opacity .22s var(--ease-out-quart);border:1px solid var(--line)}
.ax-scrim.on .ax-modal{transform:scale(1) translateY(0);opacity:1}
.ax-mh{padding:22px 30px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:18px}
.ax-mh .av-lg{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font:700 19px 'Inter';background:linear-gradient(135deg,var(--green-200),var(--green-100));color:var(--green-900);flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.ax-mh h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;margin:0 0 2px;color:var(--green-900);letter-spacing:-.015em;line-height:1.1}
.ax-mh .upn{font:500 13px 'Inter';color:var(--muted);margin-top:4px}
.ax-mh .x{margin-left:auto;background:transparent;border:0;cursor:pointer;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .18s,color .18s}
.ax-mh .x:hover{background:var(--green-50);color:var(--green-900)}
.ax-mh .x svg{width:18px;height:18px}
.ax-mb{padding:22px 30px;overflow:auto}
.ax-mf{padding:14px 30px;border-top:1px solid var(--line);background:var(--soft);display:flex;gap:10px;justify-content:space-between;align-items:center}
.ax-fs{margin-bottom:22px}
.ax-fs h4{font:700 10.5px 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.ax-info{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px}
.ax-info .it{font:500 13.5px 'Inter'}
.ax-info .it span{display:block;color:var(--muted);font-size:11.5px;margin-bottom:2px}
.ax-info .it strong{font-weight:600;color:var(--ink)}
.ax-src{display:inline-flex;align-items:center;gap:5px;font:700 10px 'Inter';padding:2px 8px;border-radius:999px;background:var(--green-50);color:var(--green-900);border:1px solid var(--green-100);text-transform:uppercase;letter-spacing:.06em;margin-left:8px}
.ax-rp{display:grid;gap:8px}
.ax-rr{display:grid;grid-template-columns:22px 1fr auto;gap:14px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;align-items:start;cursor:pointer;transition:border-color .18s,background .18s}
.ax-rr:hover{border-color:var(--green-300)}
.ax-rr.on{border-color:var(--green-500);background:var(--green-50)}
.ax-rr input{margin-top:3px;accent-color:var(--green-700);width:16px;height:16px;cursor:pointer}
.ax-rri .nm{font:600 13.5px 'Inter';color:var(--green-900)}
.ax-rri .ds{font:500 12px 'Inter';color:var(--ink-2);margin-top:3px;line-height:1.45}
.ax-rst{font:700 10.5px 'Inter';color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.06em}
.ax-sp{display:flex;flex-direction:column;gap:8px}
.ax-sr{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:border-color .18s,background .18s}
.ax-sr:hover{border-color:var(--green-300)}
.ax-sr.on{border-color:var(--green-500);background:var(--green-50)}
.ax-sr input{accent-color:var(--green-700);width:16px;height:16px;cursor:pointer}
.ax-sr .lb{font:600 13.5px 'Inter'}
.ax-sr .sb{font:500 12px 'Inter';color:var(--muted);margin-left:6px}
.ax-sr select{margin-left:auto;padding:6px 11px;border:1px solid var(--line-2);border-radius:7px;font:inherit;font-size:12.5px;background:#fff;color:var(--ink);min-height:32px}
.ax-sn{font:500 12px 'Inter';color:var(--muted);line-height:1.55}
.ax-sn code{background:var(--green-50);padding:1.5px 7px;border-radius:4px;font-size:11.5px;color:var(--green-900);font-family:var(--mono)}
.ax-db{background:transparent;border:0;color:var(--bad);font:600 13px 'Inter';cursor:pointer;padding:7px 11px;border-radius:7px;transition:background .18s}
.ax-db:hover{background:var(--bad-bg)}

/* Toast */
.ax-tray{position:fixed;bottom:24px;right:24px;z-index:140;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.ax-toast{background:var(--bg-deep);color:#fff;padding:13px 18px;border-radius:12px;font:500 13px 'Inter';display:flex;align-items:center;gap:11px;box-shadow:var(--shadow-lg);transform:translateY(8px);opacity:0;animation:ax-toastIn .34s var(--ease-spring) forwards;max-width:380px;border:1px solid rgba(124,252,154,.3)}
.ax-toast svg{width:17px;height:17px;color:var(--green-300);flex-shrink:0}

/* Tooltip réutilisable */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(3px);background:var(--bg-deep);color:#fff;padding:5px 9px;border-radius:6px;font:500 11px 'Inter';white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .18s var(--ease-out-quart),transform .18s var(--ease-out-quart);z-index:50;letter-spacing:0;text-transform:none}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:980px){
  .ax-h{font-size:32px}
  .ax-kpis{grid-template-columns:repeat(2,1fr)}
  .ax-kpi{border-right:0;border-bottom:1px solid var(--line)}
  .ax-search{flex:1 1 100%}
}
@media (prefers-reduced-motion: reduce){
  .ax-spark path.line,.ax-spark path.area,
  .ax-users tbody tr,.ax-mfa.off::after,
  .ax-toast,.ax-batch,.ax-modal{animation:none!important;transition:none!important;opacity:1!important;transform:none!important}
}

/* ==========================================================================
 * v0.18 — POLISH GLOBAL : élévation systémique des composants existants
 * sur les 11 écrans (cockpit, dashboards, projects, portfolio, intake,
 * calendar, fasttrack, governance, kb, controls, admin). Pur CSS de
 * surcharge, zéro modification DOM/JS — donc zéro risque de régression
 * fonctionnelle. La cascade fait le travail : ces règles l'emportent
 * sur les définitions originales.
 * ========================================================================== */

/* Background ambient — radial subtle vert OCP + grain léger */
body{position:relative;background:var(--soft)}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 600px at 78% -10%, rgba(46,125,50,.06), transparent 60%),
    radial-gradient(600px 420px at 5% 110%, rgba(46,125,50,.04), transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.06  0 0 0 0 0.07  0 0 0 0 0.05  0 0 0 0.07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.app, .sidebar, .topbar, .main, .chat{position:relative;z-index:1}

/* Page heading plus monumental */
.h-pg{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:40px;letter-spacing:-.025em;line-height:1.02;
  color:var(--green-900);margin:0 0 10px;
  text-wrap:balance;
}
.h-pg em{font-style:italic;color:var(--green-700);font-weight:500}
.lead{font-size:15px;color:var(--muted);max-width:62ch;line-height:1.6;margin:0 0 24px}

/* KPI cards — Cormorant value + hover lift plus marqué + reveal anim */
@keyframes pgKpiIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.kpi-grid{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:linear-gradient(180deg,transparent,var(--soft))}
.kpi{
  background:transparent;border:0;border-right:1px solid var(--line);border-radius:0;
  padding:20px 22px 20px 22px;
  animation:pgKpiIn .42s var(--ease-out-quart) both;
}
.kpi:first-child{padding-left:0}
.kpi:last-child{border-right:0;padding-right:0}
.kpi:nth-child(1){animation-delay:.04s}.kpi:nth-child(2){animation-delay:.08s}
.kpi:nth-child(3){animation-delay:.12s}.kpi:nth-child(4){animation-delay:.16s}
.kpi:hover{transform:translateY(-1px);box-shadow:none;border-color:var(--line)}
.kpi:hover .v{color:var(--green-900)}
.kpi .v{font-size:42px;font-weight:600;letter-spacing:-.025em;transition:color .18s var(--ease-out-quart)}
.kpi .v small{font-size:14px;font-weight:500}
.kpi .k{font:700 10.5px 'Inter';letter-spacing:.1em}

/* Card polish — shadow + hover lift subtle */
.card{
  background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow-green-sm);
  transition:border-color .18s var(--ease-out-quart), box-shadow .24s var(--ease-out-quart), transform .24s var(--ease-out-quart);
}
.card:hover{border-color:color-mix(in oklab, var(--green-500) 35%, var(--line))}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;letter-spacing:-.015em;color:var(--green-900)}
.card h3 .sub{font:500 12px 'Inter';color:var(--muted);font-style:italic;text-transform:none;letter-spacing:0;margin-left:6px}

/* Ck-hero plus dramatique (Cockpit) */
.ck-hero{
  background:linear-gradient(135deg,#07140c 0%,#0d2e16 50%,#103d17 100%);
  border-radius:20px;padding:32px 36px;margin-bottom:28px;
  box-shadow:0 24px 60px -24px rgba(7,20,12,.4), inset 0 1px 0 rgba(124,252,154,.08);
  position:relative;overflow:hidden;
}
.ck-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(500px 280px at 90% 0%, rgba(124,252,154,.10), transparent 60%);
  pointer-events:none;
}
.ck-hero h1{
  font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:42px;letter-spacing:-.025em;line-height:1.03;
  text-wrap:balance;margin:8px 0 8px;
}
.ck-hero h1 em{font-style:italic;color:#7cfc9a;font-weight:500}
.ck-hero p{font-size:14.5px;color:#bcd4c2;max-width:65ch;line-height:1.55}
.ck-hero-stats{margin-top:24px;gap:32px}
.ck-hs .v{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:38px;line-height:.95;letter-spacing:-.02em}
.ck-hs .v small{font-family:'Inter',sans-serif;font-size:14px;font-weight:500}
.ck-hs .l{font:700 10.5px 'Inter';letter-spacing:.1em}

/* Tables — row stagger reveal + hover gradient propre */
@keyframes pgRowIn{to{opacity:1;transform:translateY(0)}}
.tbl tbody tr{opacity:0;transform:translateY(4px);animation:pgRowIn .42s var(--ease-out-quart) forwards}
.tbl tbody tr:nth-child(1){animation-delay:.02s}.tbl tbody tr:nth-child(2){animation-delay:.05s}
.tbl tbody tr:nth-child(3){animation-delay:.08s}.tbl tbody tr:nth-child(4){animation-delay:.11s}
.tbl tbody tr:nth-child(5){animation-delay:.14s}.tbl tbody tr:nth-child(6){animation-delay:.17s}
.tbl tbody tr:nth-child(7){animation-delay:.20s}.tbl tbody tr:nth-child(8){animation-delay:.23s}
.tbl tbody tr:nth-child(n+9){animation-delay:.26s}
.tbl tbody tr{position:relative;transition:background .14s var(--ease-out-quart)}
.tbl tbody tr:hover td{background:linear-gradient(90deg, var(--green-50), var(--soft))}
.tbl tbody tr:hover td:first-child::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--green-500);border-radius:0 2px 2px 0;
}

/* Pills + chips — micro polish (hover scale, shadow subtil) */
.pill{transition:transform .14s var(--ease-spring), box-shadow .18s var(--ease-out-quart)}
.pill:hover{transform:translateY(-0.5px);box-shadow:var(--shadow-sm)}
.chip{transition:border-color .18s var(--ease-out-quart), background .18s var(--ease-out-quart), color .18s var(--ease-out-quart)}
.chip:hover{border-color:var(--green-300);background:var(--green-50);color:var(--green-900)}

/* Buttons primaires : shimmer hover sur primary */
.btn.primary, .tb-btn.primary{position:relative;overflow:hidden}
.btn.primary::before, .tb-btn.primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
  transform:translateX(-100%);transition:transform .6s var(--ease-out-quart);pointer-events:none;
}
.btn.primary:hover::before, .tb-btn.primary:hover::before{transform:translateX(100%)}
.btn.primary > *, .tb-btn.primary > *{position:relative;z-index:1}

/* Sidebar : active-item glow accent */
.sb-item.on::before{
  content:'';position:absolute;left:-9px;top:50%;transform:translateY(-50%);
  width:3px;height:22px;background:#7cfc9a;border-radius:0 3px 3px 0;
  box-shadow:0 0 10px rgba(124,252,154,.5);
}
.sb-item{position:relative;transition:background .18s var(--ease-out-quart), color .18s var(--ease-out-quart), transform .14s var(--ease-out-quart)}
.sb-item:hover{transform:translateX(2px)}

/* Topbar plus polish + sticky shadow */
.topbar{
  background:color-mix(in oklab, #fff 92%, transparent);
  backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
}

/* subnav (admin onglets) plus moderne */
.subnav{
  padding:4px;background:#fff;border:1px solid var(--line);border-radius:11px;
  box-shadow:var(--shadow-sm);
}
.subnav button{
  padding:8px 14px;border-radius:8px;font:600 13px 'Inter';color:var(--muted);
  transition:background .18s var(--ease-out-quart), color .18s var(--ease-out-quart);
}
.subnav button:hover{color:var(--ink);background:var(--green-50)}
.subnav button.on{background:var(--green-900);color:#fff}
.subnav button.on:hover{background:var(--green-800);color:#fff}

/* Reduced motion : kill toutes les anim ajoutées */
@media (prefers-reduced-motion: reduce){
  .kpi, .tbl tbody tr{animation:none!important;opacity:1!important;transform:none!important}
  .btn.primary::before, .tb-btn.primary::before{display:none}
  body::before, body::after{display:none}
}

/* ==========================================================================
 * v0.20 — FAB + SHEET pour D²nAI bot (option B validée)
 * Remplace le panneau slide-in droit (.chat .app.chat-open) par un
 * bouton flottant rond + sheet flottant en bas-droite. Mobile : sheet
 * en bottom-sheet plein écran.
 * ========================================================================== */
.bot-fab{
  position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--green-700),var(--green-900));
  border:0;color:#fff;cursor:pointer;z-index:90;
  display:grid;place-items:center;
  box-shadow:0 14px 32px -8px rgba(20,77,31,.55), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform var(--dur-base,.18s) var(--ease-out-quart), box-shadow var(--dur-base,.18s) var(--ease-out-quart);
}
.bot-fab:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 18px 40px -8px rgba(20,77,31,.65), inset 0 1px 0 rgba(255,255,255,.2)}
.bot-fab:active{transform:scale(.96)}
.bot-fab:focus-visible{outline:none;box-shadow:0 0 0 4px rgba(124,252,154,.4), 0 14px 32px -8px rgba(20,77,31,.55)}
.bot-fab.on{background:var(--green-900);transform:rotate(45deg)}
.bot-fab.on .bot-fab-ico svg{transform:rotate(-45deg)}
.bot-fab-ico{display:grid;place-items:center;width:100%;height:100%;transition:transform var(--dur-base) var(--ease-out-quart)}
.bot-fab-ico svg{width:24px;height:24px;transition:transform var(--dur-base) var(--ease-out-quart)}
.bot-fab.on .bot-fab-ico svg{content:''}
.bot-fab-pulse{
  position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--green-300);
  opacity:0;animation:botFabPing 2.6s var(--ease-out-quart) infinite;pointer-events:none;
}
.bot-fab.on .bot-fab-pulse{display:none}
@keyframes botFabPing{0%{transform:scale(1);opacity:.55}80%,100%{transform:scale(1.45);opacity:0}}

/* Close icon when open : on remplace l'icône via CSS pseudo */
.bot-fab.on .bot-fab-ico svg{display:none}
.bot-fab.on .bot-fab-ico::before{
  content:'×';font:300 30px 'Inter';line-height:1;color:#fff;
}

/* Scrim léger pour focus + dismiss au clic */
.bot-scrim{
  position:fixed;inset:0;background:rgba(13,37,16,.18);backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);z-index:85;
  opacity:0;pointer-events:none;transition:opacity var(--dur-base,.22s) var(--ease-out-quart);
}
.bot-scrim.on{opacity:1;pointer-events:auto}

/* Sheet flottant en bas-droite */
.bot-sheet{
  position:fixed;right:22px;bottom:92px;
  width:400px;max-width:calc(100vw - 32px);height:min(620px, calc(100dvh - 130px));
  background:linear-gradient(180deg,#07140c 0%,#0c1f12 100%);color:#dff0e3;
  border:1px solid rgba(124,252,154,.18);border-radius:18px;
  box-shadow:0 32px 80px -20px rgba(7,20,12,.55), 0 0 0 1px rgba(0,0,0,.04);
  z-index:95;overflow:hidden;
  display:flex!important;flex-direction:column;
  transform:translateY(12px) scale(.96);opacity:0;pointer-events:none;
  transform-origin:bottom right;
  transition:transform var(--dur-slow,.34s) var(--ease-spring), opacity var(--dur-base,.22s) var(--ease-out-quart);
}
.bot-sheet.on{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
.bot-sheet[style*="display:none"]{display:none!important}

.bot-sheet-h{
  padding:14px 18px;border-bottom:1px solid rgba(124,252,154,.1);
  display:flex;align-items:center;gap:11px;flex-shrink:0;
  background:linear-gradient(180deg, rgba(124,252,154,.04), transparent);
}
.bot-av{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--green-500),var(--green-700));
  color:#fff;display:grid;place-items:center;
  font:700 13px 'Cormorant Garamond',serif;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
  flex-shrink:0;
}
.bot-sheet-h .nm-wrap{flex:1;min-width:0}
.bot-sheet-h .nm{font:600 14px 'Inter';color:#fff;line-height:1.15}
.bot-sheet-h .sub{font:500 11.5px 'Inter';color:#7fb98e;margin-top:1px}
.bot-sheet-x{
  background:transparent;border:0;cursor:pointer;
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  color:#7fb98e;transition:background var(--dur-base) var(--ease-out-quart),color var(--dur-base) var(--ease-out-quart);
}
.bot-sheet-x:hover{background:rgba(255,255,255,.06);color:#fff}
.bot-sheet-x svg{width:16px;height:16px}

/* Body + input héritent les classes .chat-body / .chat-input existantes
   (cohérence visuelle, on ne réinvente pas ce qui marche). */
.bot-sheet .chat-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.bot-sheet .chat-sugs{padding:0 14px 6px;display:flex;flex-wrap:wrap;gap:6px;flex-shrink:0}
.bot-sheet .chat-input-wrap{padding:10px 14px 12px;border-top:1px solid rgba(124,252,154,.1);background:#04100a;flex-shrink:0}

/* Cache l'ancien bouton "D²nAI bot" en topbar : remplacé par le FAB */
.tb-btn.ai{display:none!important}

/* Mobile portrait : sheet en bottom-sheet plein écran */
@media(max-width:760px){
  .bot-fab{right:14px;bottom:14px;width:52px;height:52px}
  .bot-sheet{
    right:0;left:0;bottom:0;top:auto;
    width:100%;max-width:100%;height:88dvh;
    border-radius:18px 18px 0 0;
    transform:translateY(100%);
    transform-origin:bottom center;
  }
  .bot-sheet.on{transform:translateY(0)}
  .bot-scrim{background:rgba(13,37,16,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  /* Pastille commentaire en bas-droite ne doit pas chevaucher le FAB */
  .fb-pellet, .feedback-pellet, [id*="ommentaire"]{bottom:88px!important}
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  .bot-fab-pulse{animation:none;display:none}
  .bot-sheet,.bot-scrim,.bot-fab{transition:none!important;animation:none!important}
}

/* ==========================================================================
 * v0.22.3 polish — global UX/UI improvements
 *
 * Pillars :
 *  1. Smooth page transitions (.screen.on enters with fade+slide-up)
 *  2. Card hover micro-interaction (lift + glow, not just shadow)
 *  3. Better focus rings (visible, branded, never removed)
 *  4. Loading skeletons (replace spinners mid-content)
 *  5. Empty states with personality (illustration + 1-line + CTA)
 *  6. Smoother transitions everywhere (220ms ease-out-quart by default)
 *  7. Subtle scroll-snap on key flows (cockpit, governance)
 *  8. KPI variation (asymmetric grid : 1 hero + 3 standard)
 * ========================================================================== */

/* --- Page transitions : chaque changement d'écran fait un fade+slide subtle --- */
@keyframes pageEnter{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.screen.on{animation:pageEnter var(--dur-page) var(--ease-out-quart) both}
@media (prefers-reduced-motion: reduce){
  .screen.on{animation:none}
}

/* --- Card hover : lift + glow vert subtil (au lieu de bg change) --- */
.card{transition:transform var(--dur-base) var(--ease-out-quart), box-shadow var(--dur-base) var(--ease-out-quart), border-color var(--dur-base) var(--ease-out-quart)}
.card:hover:not(.no-hover){border-color:var(--green-100)}
.card-hoverable{cursor:pointer}
.card-hoverable:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:var(--green-200)}
.card-hoverable:active{transform:translateY(-1px);transition-duration:var(--dur-fast)}

/* --- KPI : default = standard, .kpi--hero = large featured one --- */
.kpi-grid{gap:var(--space-3)}
.kpi{transition:transform var(--dur-base) var(--ease-out-quart), box-shadow var(--dur-base) var(--ease-out-quart), border-color var(--dur-base) var(--ease-out-quart)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:var(--green-200)}
.kpi:active{transform:translateY(-1px);transition-duration:var(--dur-fast)}
.kpi--hero{
  grid-column:span 2;background:linear-gradient(135deg,var(--green-700) 0%, var(--green-900) 100%);
  color:#fff;border:0;padding:var(--space-6) var(--space-7);
}
.kpi--hero .k{color:rgba(255,255,255,.7);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.kpi--hero .v{color:#fff;font-size:clamp(36px,5vw,52px);line-height:1;letter-spacing:-.025em}
.kpi--hero .s{color:rgba(255,255,255,.65);font-size:13px}
.kpi--hero .bar{background:rgba(255,255,255,.12)}
.kpi--hero .bar > i{background:linear-gradient(90deg,#fff,rgba(255,255,255,.7))}
.kpi--hero:hover{transform:translateY(-2px);box-shadow:0 12px 32px -8px rgba(16,35,26,.42)}

/* --- Buttons : add active state + subtle scale --- */
.btn,.tb-btn{transition:background var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), border-color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-out-quart), box-shadow var(--dur-fast) var(--ease-out-quart)}
.btn:active:not(:disabled),.tb-btn:active:not(:disabled){transform:scale(.97)}
.btn.primary:hover:not(:disabled),.tb-btn.primary:hover:not(:disabled){box-shadow:0 4px 14px -2px rgba(46,125,50,.4)}
.btn.primary:active:not(:disabled),.tb-btn.primary:active:not(:disabled){box-shadow:0 2px 8px -2px rgba(46,125,50,.3)}
.btn:disabled,.tb-btn:disabled{opacity:.5;cursor:not-allowed}

/* --- Focus rings : plus visibles, branded --- */
:focus-visible{outline:none;box-shadow:var(--ring-focus)!important;border-radius:8px}
.btn:focus-visible,.tb-btn:focus-visible{box-shadow:var(--ring-focus), 0 4px 14px -2px rgba(46,125,50,.3)!important}

/* --- Loading skeletons --- */
@keyframes skelShimmer{
  0%{background-position:-200px 0}
  100%{background-position:calc(200px + 100%) 0}
}
.skel{
  background:linear-gradient(90deg,var(--line-soft) 0%,#fff 50%,var(--line-soft) 100%);
  background-size:200px 100%;background-repeat:no-repeat;
  animation:skelShimmer 1.4s var(--ease-soft) infinite;
  border-radius:var(--rad-sm);color:transparent!important;
}
.skel-text{height:14px;margin-bottom:6px;display:block}
.skel-card{padding:var(--space-5);background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);margin-bottom:var(--space-3)}
.skel-line{height:12px;margin:6px 0;border-radius:4px}
@media (prefers-reduced-motion: reduce){
  .skel{animation:none;background:var(--line-soft)}
}

/* --- Empty states : warm, welcoming --- */
.empty-pro{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:var(--space-9) var(--space-5);
  background:linear-gradient(180deg,var(--green-25) 0%,#fff 60%);
  border:1px dashed var(--green-100);border-radius:var(--rad-lg);
}
.empty-pro-ico{font-size:48px;margin-bottom:var(--space-4);opacity:.6;filter:grayscale(.3)}
.empty-pro h3{font:700 18px/1.3 'Cormorant Garamond',serif;color:var(--ink);margin:0 0 var(--space-2);letter-spacing:-.01em}
.empty-pro p{font:500 13px/1.55 'Inter',sans-serif;color:var(--muted);margin:0 0 var(--space-5);max-width:380px;text-wrap:pretty}
.empty-pro .btn{align-self:center}

/* --- Hero cockpit : subtle vignette + softer gradient --- */
.ck-hero{
  position:relative;overflow:hidden;
  transition:transform var(--dur-slow) var(--ease-out-quart),box-shadow var(--dur-slow) var(--ease-out-quart);
}
.ck-hero::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at top right, rgba(124,252,154,.08), transparent 60%),
             radial-gradient(ellipse at bottom left, rgba(16,35,26,.18), transparent 50%);
}

/* --- Sidebar nav items : subtle hover lift --- */
.sb-item{transition:background var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-out-quart)}
.sb-item:hover:not(.on){background:rgba(255,255,255,.04);color:#fff}
.sb-item:active{transform:scale(.98)}
.sb-item.on{position:relative}
.sb-item.on::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  background:var(--green-300);border-radius:0 2px 2px 0;
}

/* --- Pills/badges : tighter, more consistent --- */
.pill{transition:background var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft)}

/* --- Chips/toggles : smooth state transitions --- */
.chip{transition:background var(--dur-fast) var(--ease-soft), border-color var(--dur-fast) var(--ease-soft), color var(--dur-fast) var(--ease-soft)}

/* --- Toast : entry/exit polish (already exists, just refine timing) --- */
.toast{transition:transform var(--dur-base) var(--ease-spring), opacity var(--dur-base) var(--ease-out-quart)}

/* --- Table rows : subtle hover for clickables --- */
.tbl tr.t-link,.tbl tbody tr[onclick]{cursor:pointer;transition:background var(--dur-fast) var(--ease-soft)}
.tbl tr.t-link:hover,.tbl tbody tr[onclick]:hover{background:var(--green-25)}

/* --- Smooth scroll for in-page anchors --- */
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

/* --- Touch targets : minimum 44x44 on mobile --- */
@media (hover:none) and (pointer:coarse){
  .btn,.tb-btn,.chip,.sb-item,.kn-card{min-height:44px}
}

/* --- Better text selection (branded) --- */
::selection{background:rgba(46,125,50,.18);color:var(--green-900)}

/* --- Progress bars : smooth fill animation --- */
.bar > i,.dash-bar > i,.coach-tour-prog-fill{transition:width var(--dur-slow) var(--ease-out-quart)}

/* --- Subtle stagger reveal on list items (cards, alerts) --- */
@keyframes itemFadeUp{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}
.screen.on .alert,
.screen.on .kn-card,
.screen.on .kb-card,
.screen.on .proj-acc-card,
.screen.on .prjh-card{
  animation:itemFadeUp var(--dur-base) var(--ease-out-quart) both;
}
.screen.on .alert:nth-child(1),.screen.on .kn-card:nth-child(1),.screen.on .kb-card:nth-child(1),.screen.on .prjh-card:nth-child(1){animation-delay:40ms}
.screen.on .alert:nth-child(2),.screen.on .kn-card:nth-child(2),.screen.on .kb-card:nth-child(2),.screen.on .prjh-card:nth-child(2){animation-delay:80ms}
.screen.on .alert:nth-child(3),.screen.on .kn-card:nth-child(3),.screen.on .kb-card:nth-child(3),.screen.on .prjh-card:nth-child(3){animation-delay:120ms}
.screen.on .alert:nth-child(4),.screen.on .kn-card:nth-child(4),.screen.on .kb-card:nth-child(4),.screen.on .prjh-card:nth-child(4){animation-delay:160ms}
.screen.on .alert:nth-child(5),.screen.on .kn-card:nth-child(5),.screen.on .kb-card:nth-child(5),.screen.on .prjh-card:nth-child(5){animation-delay:200ms}
@media (prefers-reduced-motion: reduce){
  .screen.on .alert,.screen.on .kn-card,.screen.on .kb-card,.screen.on .proj-acc-card,.screen.on .prjh-card{animation:none}
}

/* ==========================================================================
 * v0.22.2 — RBAC UI (gating visuel selon rôle effectif). Backend reste
 * autorité. Pattern : .rbac-X-only est visible UNIQUEMENT pour les rôles
 * qui ont la permission X.
 *
 * Par défaut tout est caché, et on whitelist explicitement les rôles
 * autorisés. C'est plus safe que blacklister (oubli = invisible vs
 * leak).
 * ========================================================================== */

/* Permission 'view-admin' : Admin uniquement */

body[data-effective-role="admin"] tr.rbac-admin-only{display:table-row}
body[data-effective-role="admin"] button.rbac-admin-only,

.rbac-crud-ref-only{display:none}
body[data-effective-role="admin"] .rbac-crud-ref-only{display:revert}

/* Permission 'do-manage-users' : Admin uniquement (Admin > Accès) */

body[data-effective-role="admin"] .rbac-manage-users-only{display:revert}

body[data-effective-role="admin"] .rbac-ceo-tab-only,

/* Permission 'do-steering-decide' : Admin + Steering Member */

body[data-effective-role="admin"] .rbac-steering-decide-only,
body[data-effective-role="steering_member"] .rbac-steering-decide-only{display:revert}

/* Permission 'do-monitoring-decide' : Admin + Monitoring Member */

body[data-effective-role="admin"] .rbac-monitoring-decide-only,

/* Permission 'do-ceo-decide' : Admin + CEO */
.rbac-ceo-decide-only{display:none}
body[data-effective-role="admin"] .rbac-ceo-decide-only,
body[data-effective-role="ceo_approver"] .rbac-ceo-decide-only{display:revert}

/* Permission 'do-edit-closure' : Admin + Steering + Entity Manager + Trial Owner */
.rbac-edit-closure-only{display:none}
body[data-effective-role="admin"] .rbac-edit-closure-only,
body[data-effective-role="steering_member"] .rbac-edit-closure-only,

/* ============================================================================

/* -----------------------------------------------------------------
 * 1. NAVIGATION CONFIG (i18n via tr())

 // Welcome tour — 8 étapes
 'tour.welcome.t1':'Bienvenue dans NutriPlan',
 'tour.welcome.b1':'Le cockpit qui couvre tout le cycle amont de gestion des trials : intake, gouvernance, monitoring, clôture. Laisse-toi guider en 8 étapes, ça prend 3 minutes. Tu peux skipper quand tu veux.',
 'tour.welcome.t2':'La navigation principale',
 'tour.welcome.b2':'6 entrées épurées : Cockpit, Portefeuille, Soumettre, Gouvernance, Knowledge Base, Admin. Les onglets contextuels (CXTAB) en haut de chaque écran te donnent les sous-vues (analytique, projets, calendrier, contrôles).',
 'tour.welcome.t3':'Vue d\'orientation au cockpit',
 'tour.welcome.b3':'KPIs portefeuille, alertes, activité récente, heatmap par BU et culture. C\'est ta vue de pilotage quotidienne.',
 'tour.welcome.t4':'Démo RBAC en attendant le SSO',
 'tour.welcome.b4':'Tu peux te faire passer pour un autre rôle (lecteur, contributeur, CEO…) pour voir ce qu\'il verrait. En lecture seule, ça ne touche pas les données. Sera remplacé par Entra ID Sept 2026.',
 'tour.welcome.t5':'Soumettre un nouveau trial',
 'tour.welcome.b5':'Le bouton principal pour démarrer une soumission. Formulaire en 5 étapes : objectifs → périmètre → MDS → budget → protocole. ID auto, budget en USD, seuils CEO et Fast Track paramétrables.',
 'tour.welcome.t6':'D²nAI bot, ton co-pilote',
 'tour.welcome.b6':'Chat avec tes données trials : portefeuille, MDS, gates, comités. Pose une question en langage naturel, il te répond en s\'appuyant sur la BDD réelle.',
 'tour.welcome.t7':'Relancer ce tour quand tu veux',
 'tour.welcome.b7':'Ce bouton 💡 lance le tour guidé. Clic-droit pour accéder à 3 tours spécialisés (Portefeuille, Soumission) ou désactiver le coach.',
 'tour.welcome.t8':'Prêt à explorer',
 'tour.welcome.b8':'Tu as les bases. La checklist en bas-gauche te suit dans tes premières actions. À chaque fois que tu changes de page, je te ferai un petit tour pour t\'orienter — tu peux toujours skipper avec Échap. Bonne navigation.',
 // Portfolio tour
 'tour.pf.t1':'Bascule projets ↔ trials','tour.pf.b1':'Le portefeuille a 2 niveaux : projets (Call for Proposal) et trials (les vrais essais). L\'onglet CXTAB en haut bascule entre les deux.',
 'tour.pf.t2':'Filtres rapides','tour.pf.b2':'Filtre par BU, statut, recherche libre. Tout est combinable. Click sur une ligne ouvre le détail trial avec MDS, KPIs, risques, gates.',
 'tour.pf.t3':'Le détail trial','tour.pf.b3':'Click sur n\'importe quelle ligne pour ouvrir la fiche complète : objectifs, KPIs, MDS, partenaire, gates de gouvernance, risques.',
 // Intake tour
 'tour.in.t1':'L\'identifiant auto-généré','tour.in.b1':'Format UC-AAAA-NNN attribué à la soumission. Visible ici à titre indicatif pour que tu ne sois pas surpris.',
 'tour.in.t1b':'Les 5 étapes du formulaire','tour.in.b1b':'1) Objectifs & rationale, 2) Périmètre & site, 3) KPIs & MDS, 4) Budget & partenaire, 5) Documents. Pas besoin de tout remplir en une fois : le brouillon te sauvegarde l\'état.',
 'tour.in.t2':'Projet de rattachement','tour.in.b2':'Un trial appartient à un projet (Call for Proposal). Sélectionner d\'abord le projet : entité, pays, culture, partenaire sont hérités automatiquement.',
 'tour.in.t3':'Budget en USD','tour.in.b3':'Tous les budgets sont consolidés en USD pour comparaison cross-BU. Au-delà du seuil paramétré (Admin > Gouvernance), décision CEO obligatoire.',
 'tour.in.t4':'Brouillon ou soumettre','tour.in.b4':'Brouillon : sauvegarde sans envoi en revue. Soumettre : envoie au Steering Committee. Le protocole Word est obligatoire pour la soumission.',
 // Mini-tours par vue (auto-déclenchés à la 1ère visite de chaque page)
 'tour.v.cockpit.t1':'Bienvenue sur le Cockpit','tour.v.cockpit.b1':'Ton tableau de bord quotidien. Vue agrégée de tout le portefeuille : nombre de trials actifs, en revue, clos. Ce que tu dois regarder en premier le matin.',
 'tour.v.cockpit.t2':'Les KPIs portefeuille','tour.v.cockpit.b2':'4 indicateurs clés : actifs, dans le pipeline (en revue Steering/CEO), taux de GO en clôture, total cumulé. Click sur un KPI pour filtrer le portefeuille sur ce statut.',
 'tour.v.cockpit.t3':'Alertes & activité récente','tour.v.cockpit.b3':'Brouillons stagnants, gates en retard, comités à venir. Si tu vois une alerte rouge, c\'est qu\'une action est attendue de toi ou de ta BU. Click pour aller direct sur le problème.',
 'tour.v.dash.t1':'Vue analytique','tour.v.dash.b1':'Pour aller plus loin que le cockpit : heatmap par BU × culture, répartition budget, taux de succès historiques. C\'est ici que tu prépares tes comités.',
 'tour.v.dash.t2':'KPIs détaillés','tour.v.dash.b2':'Drill-down par BU, région, produit, type de trial. Les chiffres remontent depuis ton portefeuille — pas de saisie manuelle, tout est consolidé.',
 'tour.v.dash.t3':'Bascule vue / cockpit','tour.v.dash.b3':'Onglet CXTAB en haut pour revenir au cockpit synthétique. Cockpit = orientation, Vue analytique = pilotage.',
 'tour.v.prj.t1':'Les Projets','tour.v.prj.b1':'Niveau parent : un Projet est un Call for Proposal qui regroupe N trials sur un même thème (ex: « Résilience climatique blé Maroc 2026 »). Un trial appartient toujours à un projet.',
 'tour.v.prj.t2':'KPIs Projets','tour.v.prj.b2':'Nombre de projets actifs, leur budget total cumulé, trials rattachés. Permet de voir l\'effort total par grande initiative.',
 'tour.v.prj.t3':'Créer un nouveau projet','tour.v.prj.b3':'Tu démarres un nouveau Call for Proposal ? Bouton « + Nouveau projet ». Ensuite les trials se rattacheront à ce projet via le sélecteur d\'intake.',
 'tour.v.cal.t1':'Calendrier annuel du cycle','tour.v.cal.b1':'Vue Gantt sur 16 mois (Sep N-1 → Dec N). Tu vois en un coup d\'œil les 4 macro-phases du cycle, les 4 gates de gouvernance et les 3 fenêtres QBR.',
 'tour.v.cal.t2':'Les barres','tour.v.cal.b2':'Code couleur par macro-phase : Launch (vert), Readiness, Execution, Decision. Les gates ponctuels sont en orange, le Fast Track lane en rouge (toujours ouvert).',
 'tour.v.cal.t3':'« Aujourd\'hui » + QBR','tour.v.cal.b3':'La colonne en surbrillance = mois courant. Les marqueurs QBR indiquent les 3 fenêtres d\'intake en cours de cycle (Mars, Juin, Septembre).',
 'tour.v.ft.t1':'Fast Track Lane','tour.v.ft.b1':'Voie d\'urgence hors cycle pour les Use Cases critiques (réponse client, fenêtre agronomique, opportunité commerciale). Workflow allégé 5 étapes au lieu de 11.',
 'tour.v.ft.t2':'KPIs Fast Track','tour.v.ft.b2':'Nombre de FT actifs, temps moyen de décision (cible : 12 jours vs 90 standard), budget total et taux de GO. Doit rester rare — sinon le cycle standard est cassé.',
 'tour.v.ft.t3':'Workflow Fast Track','tour.v.ft.b3':'1) Identification urgence → 2) Chief/EVP validation → 3) Monitoring Committee ack → 4) Protocol & readiness → 5) Execution → Decision. Limite éligibilité : budget et durée plafonnés (Admin > Gouvernance).',
 'tour.v.gov.t1':'SLA actifs en bandeau','tour.v.gov.b1':'Les délais cibles par étape (SAI Review, Steering, CEO, Fast Track, Monitoring). Tous paramétrables — click sur « Configurer » à droite pour les ajuster.',
 'tour.v.gov.t2':'Steering & CEO','tour.v.gov.b2':'Les 2 comités principaux : Steering valide la pertinence, CEO décide les ressources. Tu vois ici les UCs en attente de chacun avec date du prochain comité.',
 'tour.v.gov.t3':'Matrice RACI','tour.v.gov.b3':'Qui Réalise / Approuve / est Consulté / Informé pour chacune des 11 étapes du cycle. Éditable dans Admin > Gouvernance — utile en cas de changement d\'org.',
 'tour.v.gov.t4':'Configurer SLA & seuils','tour.v.gov.b4':'Click ici pour aller à Admin > Gouvernance et ajuster les SLAs par étape, les seuils CEO (budget > X, durée > N), et l\'éligibilité Fast Track. Persistance temps réel.',
 'tour.v.kb.t1':'Knowledge Base','tour.v.kb.b1':'Toutes les fiches de clôture du cycle précédent : apprentissages, méthodologies validées, lectures à reprendre. C\'est la mémoire institutionnelle — consulte avant de reproposer un trial similaire.',
 'tour.v.kb.t2':'Filtres par verdict','tour.v.kb.b2':'GO / HOLD / KILL. Un KILL n\'est pas un échec : c\'est de l\'info validée (hypothèse infirmée). Filtre pour identifier les protocoles à NE PAS répliquer en l\'état.',
 'tour.v.kb.t3':'Éditer ou exporter PDF','tour.v.kb.b3':'Sur chaque card : « ✏ Éditer » pour rédiger ta synthèse + recommandation, « 🖨 PDF » pour générer un brief imprimable que tu partages en comité.',
 'tour.v.ic.t1':'Contrôles internes','tour.v.ic.b1':'22 points de contrôle répartis sur 5 domaines (planning, governance, exécution, ressources, capitalisation). C\'est ton backbone audit/compliance — vérifie régulièrement.',
 'tour.v.ic.t2':'KPIs conformité','tour.v.ic.b2':'Score global de conformité, points en alerte, points résolus. Cible : 100% sur les points HIGH severity, ≥80% sur l\'ensemble.',
 'tour.v.ic.t3':'Détail par point','tour.v.ic.b3':'Click sur un point pour voir les UCs concernés. Si un point est rouge, traite-le avant le prochain Steering — sinon il remontera en alerte de gouvernance.',
 'tour.v.adm.t1':'Admin : 5 sous-onglets','tour.v.adm.b1':'📚 Référentiels (BUs, cultures, MDS…), 🧭 Cadre v1.0 (taxonomie), ⚖ Gouvernance (RACI, seuils, SLA), 👥 Accès & rôles, 🔗 Intégrations. Chacun éditable.',
 'tour.v.adm.t2':'Action du jour','tour.v.adm.b2':'Selon l\'onglet : éditer un référentiel (double-clic sur une chip pour renommer), ajuster un seuil CEO, assigner un rôle à un utilisateur. Tout persisté serveur en temps réel.',
 'tour.v.adm.t3':'Ajouter / configurer','tour.v.adm.b3':'Toolbar en bas : exporter le référentiel en JSON, réinitialiser aux valeurs par défaut, ou ajouter une nouvelle entrée via le formulaire inline.',

 'tour.welcome.t4':'Demo RBAC até o SSO',

 'tour.welcome.t6':'D²nAI bot, seu copiloto',
 'tour.welcome.b6':'Chat com seus dados de trials: portfólio, MDS, gates, comitês. Pergunte em linguagem natural, ele responde com base no BD real.',
 'tour.welcome.t7':'Reinicie este tour quando quiser',
 'tour.welcome.b7':'Este botão 💡 inicia o tour guiado. Clique direito para acessar 3 tours especializados (Portfólio, Submissão) ou desativar o coach.',
 'tour.welcome.t8':'Pronto para explorar',
 'tour.welcome.b8':'Você tem o básico. A checklist no canto inferior esquerdo segue suas primeiras ações. A cada mudança de página, vou rodar um tour rápido para orientá-lo — pode pular com Esc. Boa navegação.',
 'tour.pf.t1':'Alterne projetos ↔ trials','tour.pf.b1':'O portfólio tem 2 níveis: projetos (Call for Proposal) e trials (experimentos reais). O CXTAB no topo alterna entre eles.',
 'tour.pf.t2':'Filtros rápidos','tour.pf.b2':'Filtre por BU, status, busca livre. Tudo combinável. Clique em uma linha para abrir o detalhe do trial com MDS, KPIs, riscos, gates.',
 'tour.pf.t3':'Detalhe do trial','tour.pf.b3':'Clique em qualquer linha para abrir o registro completo: objetivos, KPIs, MDS, parceiro, gates de governança, riscos.',
 'tour.in.t1':'Identificador auto-gerado','tour.in.b1':'Formato UC-AAAA-NNN atribuído na submissão. Mostrado aqui para referência.',
 'tour.in.t1b':'As 5 etapas do formulário','tour.in.b1b':'1) Objetivos, 2) Escopo, 3) KPIs & MDS, 4) Orçamento, 5) Documentos. Sem necessidade de preencher tudo de uma vez: o rascunho salva o estado.',
 'tour.in.t2':'Projeto pai','tour.in.b2':'Um trial pertence a um projeto (Call for Proposal). Selecione o projeto primeiro: entidade, país, cultura, parceiro são herdados automaticamente.',
 'tour.in.t3':'Orçamento em USD','tour.in.b3':'Todos os orçamentos consolidados em USD para comparação cross-BU. Acima do limite configurado (Admin > Governança), decisão CEO obrigatória.',
 'tour.in.t4':'Rascunho ou submeter','tour.in.b4':'Rascunho: salva sem envio para revisão. Submeter: envia ao Steering Committee. O protocolo Word é obrigatório para submissão.',

 'tour.v.cockpit.t1':'Bem-vindo ao Cockpit','tour.v.cockpit.b1':'Seu painel diário. Visão agregada de todo o portfólio: trials ativos, em revisão, fechados. O que olhar primeiro de manhã.',
 'tour.v.cockpit.t2':'KPIs do portfólio','tour.v.cockpit.b2':'4 indicadores-chave: ativos, no pipeline (revisão Steering/CEO), taxa de GO no fechamento, total acumulado. Clique para filtrar o portfólio.',
 'tour.v.cockpit.t3':'Alertas & atividade recente','tour.v.cockpit.b3':'Rascunhos parados, gates atrasados, comitês próximos. Alerta vermelho = ação esperada de você ou da sua BU.',
 'tour.v.dash.t1':'Visão analítica','tour.v.dash.b1':'Além do cockpit: heatmap por BU × cultura, distribuição de orçamento, taxas históricas. É aqui que você prepara seus comitês.',
 'tour.v.dash.t2':'KPIs detalhados','tour.v.dash.b2':'Drill-down por BU, região, produto, tipo de trial. Números vêm do portfólio — nada de entrada manual.',
 'tour.v.dash.t3':'Alternar visão ↔ cockpit','tour.v.dash.b3':'CXTAB no topo para voltar ao cockpit sintético. Cockpit = orientação, Analítica = pilotagem.',
 'tour.v.prj.t1':'Projetos','tour.v.prj.b1':'Nível pai: um Projeto é um Call for Proposal que agrupa N trials sobre um tema comum. Um trial sempre pertence a um projeto.',
 'tour.v.prj.t2':'KPIs Projetos','tour.v.prj.b2':'Número de projetos ativos, orçamento total cumulativo, trials anexados. Permite ver o esforço por iniciativa.',
 'tour.v.prj.t3':'Criar novo projeto','tour.v.prj.b3':'Iniciando um novo Call for Proposal? Botão « + Novo projeto ». Os trials se anexam via o seletor de intake.',
 'tour.v.cal.t1':'Calendário anual do ciclo','tour.v.cal.b1':'Visão Gantt em 16 meses (Set N-1 → Dez N). Veja de relance as 4 macro-fases, 4 gates de governança e 3 janelas QBR.',
 'tour.v.cal.t2':'As barras','tour.v.cal.b2':'Código de cor por macro-fase: Launch (verde), Readiness, Execution, Decision. Gates pontuais em laranja, Fast Track lane em vermelho (sempre aberto).',
 'tour.v.cal.t3':'« Hoje » + QBR','tour.v.cal.b3':'A coluna destacada = mês atual. Marcadores QBR indicam as 3 janelas de intake no ano (Mar, Jun, Set).',
 'tour.v.ft.t1':'Fast Track Lane','tour.v.ft.b1':'Via de emergência fora do ciclo para Use Cases críticos (resposta cliente, janela agronômica, oportunidade comercial). Workflow leve de 5 etapas.',
 'tour.v.ft.t2':'KPIs Fast Track','tour.v.ft.b2':'Número de FTs ativos, tempo médio de decisão (alvo: 12 dias vs 90 padrão), orçamento total e taxa de GO. Deve permanecer raro.',
 'tour.v.ft.t3':'Workflow Fast Track','tour.v.ft.b3':'1) Identificação urgência → 2) Validação Chief/EVP → 3) Monitoring Committee ack → 4) Protocolo → 5) Execução → Decisão. Limites em Admin > Governança.',
 'tour.v.gov.t1':'SLAs ativos no banner','tour.v.gov.b1':'Prazos-alvo por etapa (SAI Review, Steering, CEO, Fast Track, Monitoring). Todos configuráveis — clique « Configurar » à direita.',
 'tour.v.gov.t2':'Steering & CEO','tour.v.gov.b2':'Os 2 comitês principais: Steering valida relevância, CEO decide recursos. UCs pendentes para cada um aqui.',
 'tour.v.gov.t3':'Matriz RACI','tour.v.gov.b3':'Quem é Responsável / Accountable / Consultado / Informado para cada uma das 11 etapas. Editável em Admin > Governança.',
 'tour.v.gov.t4':'Configurar SLAs & limites','tour.v.gov.b4':'Clique para ir a Admin > Governança e ajustar SLAs, limites CEO (orçamento > X, duração > N), e elegibilidade Fast Track.',
 'tour.v.kb.t1':'Knowledge Base','tour.v.kb.b1':'Todas as fichas de fechamento do ciclo anterior: aprendizagens, metodologias validadas. Memória institucional — consulte antes de repropor um trial similar.',
 'tour.v.kb.t2':'Filtros por veredicto','tour.v.kb.b2':'GO / HOLD / KILL. Um KILL não é falha: é info validada (hipótese refutada). Filtre para identificar protocolos a NÃO replicar como estão.',
 'tour.v.kb.t3':'Editar ou exportar PDF','tour.v.kb.b3':'Em cada card: « ✏ Editar » para escrever sua síntese + recomendação, « 🖨 PDF » para gerar um brief imprimível para o comitê.',
 'tour.v.ic.t1':'Controles internos','tour.v.ic.b1':'22 pontos de controle em 5 domínios (planning, governance, execução, recursos, capitalização). Seu backbone de auditoria/compliance.',
 'tour.v.ic.t2':'KPIs de conformidade','tour.v.ic.b2':'Score global, pontos em alerta, pontos resolvidos. Alvo: 100% nos pontos HIGH, ≥80% no geral.',
 'tour.v.ic.t3':'Detalhe por ponto','tour.v.ic.b3':'Clique em um ponto para ver os UCs. Se um ponto está vermelho, resolva antes do próximo Steering.',
 'tour.v.adm.t1':'Admin: 5 sub-abas','tour.v.adm.b1':'📚 Catálogos, 🧭 Framework v1.0, ⚖ Governança, 👥 Acessos & papéis, 🔗 Integrações. Cada uma editável.',

const LS_LANG = 'nplan_lang_v1';
function detectLang(){
  try{ const v=localStorage.getItem(LS_LANG); if(v && T[v]) return v; }catch(e){}
  const q=new URLSearchParams(location.search).get('lang'); if(q && T[q]) return q;
  const n=(navigator.language||'fr').slice(0,2).toLowerCase(); return T[n]?n:'fr';
}
let LANG = detectLang();
function tr(k, fb){
  const v = (T[LANG] && T[LANG][k]); if(v!==undefined) return v;
  if(fb!==undefined) return fb;
  return k;
}
function trf(k, params){
  let s = tr(k);
  if(params){ Object.keys(params).forEach(p=>{ s = s.split('{'+p+'}').join(params[p]); }); }
  return s;
}
function setLang(l){
  if(!T[l]) return;
  LANG = l;
  try{ localStorage.setItem(LS_LANG, l); }catch(e){}
  applyLang();
}
function applyLang(){
  document.documentElement.lang = LANG;
  // static elements with data-k
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v = tr(el.dataset.k); if(v!==undefined) el.innerHTML = v;
  });
  document.querySelectorAll('[data-kph]').forEach(el=>{
    const v = tr(el.dataset.kph); if(v!==undefined) el.placeholder = v;
  });
  // top bar bits
  const gs = document.getElementById('globalSearch'); if(gs) gs.placeholder = tr('tb.search.ph');
  const ti = document.getElementById('btnTopIntake'); if(ti) ti.textContent = tr('tb.intake');
  const pr = document.getElementById('profRole'); if(pr) pr.textContent = tr('tb.role');
  // language pills + sidebar foot
  document.querySelectorAll('.tb-lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===LANG));
  const sb = document.getElementById('sbBrandTag'); if(sb) sb.textContent = tr('side.tag');
  // re-render the active view (rebuilds all dynamic strings)
  renderSidebar();
  goView(PREFS.view||'cockpit');
}

function applyRefFromServer(data){
  if(!data || typeof data!=='object') return;
  let changed=false;
  REF_REGISTRY.forEach(r=>{
    if(r.kind==='grouped'){
      if(data[r.key] && typeof data[r.key]==='object' && !Array.isArray(data[r.key])){ r.set(data[r.key]); changed=true; }

  });
  if(changed && PREFS.view==='admin' && typeof renderAdmin==='function') renderAdmin();
}

  try{ localStorage.setItem('nplan_reference_v1', JSON.stringify(snapshotRef())); }catch(e){}
