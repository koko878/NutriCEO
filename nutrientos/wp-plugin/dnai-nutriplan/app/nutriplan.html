// Review SAI #1 — carte de détail façon maquette SAI : ligne de description
// (label / valeur) avec repli « — » si la donnée n'est pas encore saisie.
function ucDl(label, value, full){
  // Sécurité (code review/security) : la valeur est TOUJOURS échappée ici, donc
  // les appelants passent la donnée brute (ne pas pré-échapper → double-échappement).
  const has = (value!==undefined && value!==null && value!=='');
  const v = has ? escapeHtml(String(value)) : '—';
  return `<div class="dl-item${full?' full':''}"><span class="dl-label">${escapeHtml(String(label))}</span><span class="dl-value">${v}</span></div>`;
}
function _yr(d){ if(!d) return ''; const m=String(d).match(/\d{4}/); return m?m[0]:''; }
// Stepper 5 étapes du parcours gouvernance d'un trial (SAI → Steering → CEO →
// Exécution → Monitoring), états done/current/todo + sous-libellé par étape.
function ucDetailStepper(u){
  const phase = (typeof npGatePhase==='function') ? npGatePhase(u.status) : 1;

  const pend = tr('det.pending','En attente');
  const decLbl = (body, dec, fallbackDone) => dec ? (typeof govDecLabel==='function'?govDecLabel(body,dec):dec) : fallbackDone;
  // Décision CEO : stockée dans window._ceoDecisions par entité|région (pas sur le UC).
  const ceoDec = (window._ceoDecisions && window._ceoDecisions[u.bu+'|||'+u.region] && window._ceoDecisions[u.bu+'|||'+u.region].decision) || '';
  const subs = [
    decLbl('sai', u._saiDecision&&u._saiDecision.decision, phase>1?tr('det.reviewed','Revu'):pend),
    decLbl('steering', u._steeringDecision&&u._steeringDecision.decision, phase>2?tr('det.approved','Approuvé'):pend),

    decLbl('monitoring', u._monitoringDecision&&u._monitoringDecision.decision, phase>5?tr('det.done','Clôturé'):pend),

  const labels = [tr('track.sai','SAI Review'), tr('track.steering','Steering Committee'), tr('det.ceo','CEO Approval'), tr('track.exec','Execution'), tr('det.moncom','Monitoring Comm.')];
  return `<div class="proc-track">${labels.map((lab,i)=>{

      <div class="proc-node">${done?chk:n}</div>
      <div class="proc-label">${lab}</div>
      <div class="proc-sub">${n<=phase?subs[i]:(n===phase?subs[i]:'—')}</div>
    </div>`;
  }).join('')}</div>`;
}

  host.scrollTop = host.scrollHeight;

function _mdToHtml(s){
  // Very light markdown → HTML (bold, lists, paragraphs, inline code, headings).
  let h = escapeHtml(s);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h = h.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  h = h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  // bullet lists
  h = h.replace(/(^|\n)((?:- .+(?:\n|$))+)/g, (_, pfx, blk)=>{
    const items = blk.trim().split(/\n/).map(l=>l.replace(/^- /,'')).map(x=>`<li>${x}</li>`).join('');
    return `${pfx}<ul>${items}</ul>`;
  });
  // numbered lists
  h = h.replace(/(^|\n)((?:\d+\. .+(?:\n|$))+)/g, (_, pfx, blk)=>{
    const items = blk.trim().split(/\n/).map(l=>l.replace(/^\d+\. /,'')).map(x=>`<li>${x}</li>`).join('');
    return `${pfx}<ol>${items}</ol>`;
  });
  h = h.replace(/\n\n+/g,'<br><br>');
  h = h.replace(/\n/g,'<br>');
  return h;
}

async function chatSend(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='auto';
  if (typeof COACH !== 'undefined') COACH.flag('chat-asked');
  CHAT_HIST.push({ role:'user', text });
  CHAT_HIST.push({ role:'assistant', thinking:true });
  renderChatBody();
  document.getElementById('chatSendBtn').disabled = true;
  try{
    const reply = await chatCall(text);
    CHAT_HIST.pop(); // remove thinking
    CHAT_HIST.push({ role:'assistant', text: reply });
  } catch(e){
    CHAT_HIST.pop();
    CHAT_HIST.push({ role:'assistant', text: trf('chat.unavail',{e:e.message}) });
  } finally {
    document.getElementById('chatSendBtn').disabled = false;
    renderChatBody();
    renderChatSugs();
  }
}
async function chatCall(q){
  const cfg = CHAT_BACKEND || window.DNAI_NPLAN || null;
  if(!cfg || !cfg.chat || !cfg.ai){
    // Fallback — local synthetic response so the demo never breaks if the backend isn't wired.
    return _localFallback(q);
  }
  const sysPrompt = _buildSystemPrompt();
  const messages = [
    { role:'system',   content: sysPrompt },
    { role:'user',     content: q }
  ];
  // Include short rolling history (last 4 exchanges) for context.
  const hist = CHAT_HIST.filter(m=>!m.thinking && m.text).slice(-8);
  hist.forEach(m=>{ if(m.role==='user' && m.text!==q) messages.splice(1,0,{role:'user',content:m.text}); });
  const res = await fetch(cfg.chat, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-WP-Nonce':cfg.nonce||''},
    body: JSON.stringify({ messages, temperature:0.2, max_tokens:1200 })
  });
  const j = await res.json();
  if(j && j.error) throw new Error(j.error);
  if(j && j.text)  return j.text;
  throw new Error('Réponse vide du backend.');
}

  if(/brazil|bresil|brésil/.test(lc)){
    const list = DATA.filter(u=>u.bu==='BRA');
    return trf('chat.lfb.brazil',{n:list.length, b:fmtMoney(list.reduce((s,u)=>s+u.budget,0))}) + '\n\n' + list.slice(0,5).map(u=>`- **${u.id}** — ${u.name} _(${u.status})_`).join('\n');
  }
  if(/soufre|sulphur|sulfur/.test(lc)){
    const list = DATA.filter(u=>/sulph|sulfur|soufre/i.test(u.name));
    return tr('chat.lfb.sulphur') + '\n\n' + list.map(u=>`- **${u.id}** — ${u.name} _(${u.status})_`).join('\n');
  }
  if(/nutritrials|handoff|provisionn/.test(lc)){
    const ready = DATA.filter(u=>u.status==='approved');
    const sent  = DATA.filter(u=>['execution','monitoring'].includes(u.status));
    return trf('chat.lfb.handoff',{ready:ready.length, sent:sent.length}) + '\n' + ready.slice(0,5).map(u=>`- **${u.id}** — ${u.name}`).join('\n');
  }
  return trf('chat.localFb',{n:DATA.length});
}

function ifDateCheck(){
  const s=document.getElementById('if_start'), e=document.getElementById('if_end'), err=document.getElementById('if_dateErr');
  if(!s||!e||!err) return true;
  const bad = s.value && e.value && e.value < s.value;
  err.style.display = bad ? 'block' : 'none';
  e.style.borderColor = bad ? 'var(--bad)' : '';
  return !bad;
}
function ifPartnerOther(){
  const sel=document.getElementById('if_partner'), wrap=document.getElementById('if_partnerOtherWrap');

}
function ifAttachList(){

function ifBudgetFormat(){
  const inp=document.getElementById('if_budget'), hint=document.getElementById('if_budgetHint');
  if(!inp||!hint) return;

  if(v<=0){ hint.textContent = tr('in.f.budget.help'); hint.style.color=''; return; }
  hint.textContent = '$ '+v.toLocaleString('en-US')+' USD';
  hint.style.color = 'var(--green-800)';
}
// Review SAI #2 — état du wizard persisté entre les étapes. Le wizard ne rend
// qu'une étape à la fois ; sans ça, les champs des étapes 1/2 sont perdus à la
// soumission (étape 3). WIZ garde un snapshot, ifVal lit le DOM puis WIZ.
let WIZ = {};
function wizSnapshot(){
  document.querySelectorAll('#wizBody input, #wizBody textarea, #wizBody select').forEach(el=>{
    if(!el.id) return;
    WIZ[el.id] = (el.type==='checkbox') ? el.checked : el.value;
  });
  const rows = [...document.querySelectorAll('#bcCompTbody tr')];
  if(rows.length){
    WIZ._competitors = rows.map(tr=>{ const i=tr.querySelectorAll('input');
      return { product:i[0]?.value||'', company:i[1]?.value||'', volumes:i[2]?.value||'', eqP2O5:i[3]?.value||'' }; });
  }
  const mds = [...document.querySelectorAll('.if_mds:checked')].map(c=>c.dataset.mds);
  if(document.querySelector('.if_mds')) WIZ._mds = mds;
}
function wizRestore(){
  document.querySelectorAll('#wizBody input, #wizBody textarea, #wizBody select').forEach(el=>{
    if(!el.id || WIZ[el.id]===undefined) return;
    if(el.type==='checkbox') el.checked = !!WIZ[el.id]; else el.value = WIZ[el.id];
  });
  if(Array.isArray(WIZ._mds)){
    document.querySelectorAll('.if_mds').forEach(c=>{ c.checked = WIZ._mds.includes(c.dataset.mds); });
  }
  if(typeof ifTestedToggle==='function') ifTestedToggle();
  if(typeof ifPartnerOther==='function') ifPartnerOther();
}
function ifVal(id){
  const el=document.getElementById(id);
  if(el) return (el.value||'').trim();
  return (WIZ && WIZ[id]!=null) ? String(WIZ[id]).trim() : '';
}
function submitUc(isDraft){
  wizSnapshot(); // capture l'étape courante avant de lire toutes les étapes
  // Validation date fin < début (champs à l'étape 3, lus via WIZ si besoin)
  const _dStart = ifVal('if_start'), _dEnd = ifVal('if_end');
  if(_dStart && _dEnd && _dEnd < _dStart){ toast(tr('in.f.dateErr')); return; }
  if(!ifDateCheck()){ toast(tr('in.f.dateErr')); return; }
  const name = ifVal('if_name');
  if(!name){ toast(tr('in.err.name')); PREFS.intakeStep=3; savePrefs(); renderIntake(); return; }

  // ── Étape 2 : Business Use Case (niveau projet) ──
  const _bcCompetitors = (document.querySelector('#bcCompTbody')
    ? Array.from(document.querySelectorAll('#bcCompTbody tr')).map(tr => {
        const inputs = tr.querySelectorAll('input');
        return { product: inputs[0]?.value||'', company: inputs[1]?.value||'', volumes: inputs[2]?.value||'', eqP2O5: inputs[3]?.value||'' };
      })
    : (WIZ._competitors || [])
  ).filter(c => c.product || c.company);
  const buc = {
    cropArea: ifVal('if_buc_area'), currentP2O5: ifVal('if_buc_currp2o5'), potentialP2O5: ifVal('if_buc_marketp2o5'),
    targetReach: '', targetYield: ifVal('if_buc_targyield'), refYield: ifVal('if_buc_refyield'),
    improvement: ifVal('if_buc_yieldinc'), vcr: ifVal('if_buc_roi'), confidence: '',
    infoSource: '', comment: ifVal('if_buc_justif'),
  };
  const businessUseCase = {
    crop: ifVal('if_buc_crop'), country: ifVal('if_buc_country'),
    market: { cropArea: ifVal('if_buc_area'), currentP2O5: ifVal('if_buc_currp2o5'), marketP2O5: ifVal('if_buc_marketp2o5') },
    competitors: _bcCompetitors,
    agronomic: { nbTrials: Number(ifVal('if_buc_nbtrials'))||0, nbDemos: Number(ifVal('if_buc_nbdemos'))||0, objectives: ifVal('if_buc_objectives'), hypothesis: ifVal('if_buc_hyp') },
    targetedProducts: ifVal('if_buc_targeted'),
    demandCreation: { year: ifVal('if_buc_demandyear'), volume: ifVal('if_buc_demandvol') },
    marketShare: { product: ifVal('if_buc_msproduct'), share: ifVal('if_buc_msshare') },
    economicImpact: { refYield: ifVal('if_buc_refyield'), targetYield: ifVal('if_buc_targyield'), yieldIncrease: ifVal('if_buc_yieldinc'), roi: ifVal('if_buc_roi'), justification: ifVal('if_buc_justif') },
  };

  // ── Étape 1 : projet existant OU nouveau ──
  const mode = ifVal('if_projmode') || 'existing';
  let project_id, projBu = '';
  if(mode==='new'){
    // ID robuste : max des numéros PRJ existants + 1 (évite collision si non-contigu).
    const yr = (ifVal('if_proj_start').match(/\d{4}/)||[])[0] || String((new Date()).getFullYear());
    const maxN = PROJECTS.reduce((m,p)=>{ const mm=String(p.id||'').match(/PRJ-\d{4}-(\d+)/); return mm?Math.max(m,+mm[1]):m; }, 0);
    project_id = 'PRJ-'+yr+'-'+String(maxN+1).padStart(3,'0');
    const capex = Number(ifVal('if_proj_capex'))||0, opex = Number(ifVal('if_proj_opex'))||0;
    const pStart = ifVal('if_proj_start')||'', pEnd = ifVal('if_proj_end')||'';
    projBu = ifVal('if_bu')||'SAI';
    const newProj = {
      id: project_id,
      title: ifVal('if_proj_title') || name,
      entity: projBu, bu: projBu,
      region: ifVal('if_proj_region')||'—', country: ifVal('if_buc_country')||'', crop: ifVal('if_buc_crop')||'',
      partner: ifVal('if_proj_partner')||'—', partner_type: ifVal('if_proj_ptype')||'',
      status: 'New Project', project_status: 'New Project', contract_status: ifVal('if_proj_contract')||'',
      strategic_line: ifVal('if_proj_strat')||'', project_response: '',
      lead: ifVal('if_proj_lead')||'', owner: ifVal('if_proj_owner')||'',
      start_date: pStart, end_date: pEnd,
      start_year: (pStart.match(/\d{4}/)||[])[0] || '', end_year: (pEnd.match(/\d{4}/)||[])[0] || '',
      duration_years: Number(ifVal('if_proj_duration'))||0,
      nb_trials: Number(ifVal('if_proj_nbtrials'))||0,
      budget_capex: capex, budget_opex: opex, budget: capex+opex,
      objective: ifVal('if_proj_objective')||'', description: ifVal('if_proj_desc')||'',
      business_use_case: businessUseCase,
    };
    PROJECTS.push(newProj);
    if(typeof saveProjects==='function') saveProjects();
  } else {
    project_id = ifVal('if_project') || (PROJECTS[0] && PROJECTS[0].id) || null;
    const p = projById(project_id);
    if(p){ projBu = p.bu || p.entity || ''; p.business_use_case = businessUseCase; if(typeof saveProjects==='function') saveProjects(); }
  }

  // ── Étape 3 : le trial ──
  let partner = ifVal('if_partner');
  if(partner==='__other__'){ partner = ifVal('if_partnerOther') || 'Autre partenaire'; }
  const type = ifVal('if_type') || 'applied';
  const cls = ifVal('if_trial_class') || (type==='scientific' ? 'fundamental' : type==='applied' ? 'validation' : 'demo');
  const clsObj = (window.REF?REF.classes:CLASSES).find(c=>c.id===cls) || CLASSES[0];
  const businessCase = {
    p_market: { crop: ifVal('if_crop')||ifVal('if_buc_crop'), country: ifVal('if_country')||ifVal('if_buc_country'),
      area: ifVal('if_buc_area'), currentP2O5: ifVal('if_buc_currp2o5'), potentialP2O5: ifVal('if_buc_marketp2o5'),
      competitors: _bcCompetitors },
    design: { hypothesis: ifVal('if_hyp'), expectedYield: ifVal('if_buc_yieldinc'), revenue: '',
      nbTrials: Number(ifVal('if_buc_nbtrials'))||0, replications: 0 },
    eco: {},
    buc: buc,
  };
  const proto = (document.getElementById('if_protocol')||{files:[]}).files[0];
  const num = (DATA.length+1).toString().padStart(3,'0');
  const uc = {
    id:'UC-2026-'+num, name,
    project_id: project_id,
    bu: projBu || ifVal('if_bu') || 'SAI',
    region: ifVal('if_region')||ifVal('if_proj_region')||'—',
    crop: ifVal('if_crop')||ifVal('if_buc_crop')||'—',
    product: ifVal('if_prod')||'—',
    reference: '',
    type, priority: ifVal('if_prio')||'med',
    status: isDraft ? 'draft' : 'submitted',
    budget: Number(ifVal('if_budget'))||0,
    partner, partner_type: ifVal('if_partner_type')||'',
    start_date: ifVal('if_start')||null,
    end_date: ifVal('if_end')||null,
    fast_track: ifVal('if_ft')==='1',
    trial_class: cls,
    trial_type: (clsObj.types && clsObj.types[0] && clsObj.types[0].id) || type,
    strategic_objectives: [ (window.REF?REF.strategicObjectives:STRATEGIC_OBJECTIVES)[0].id ],
    partner_setup: 'provider',
    ic_issues: [],
    objective_primary: ifVal('if_objp'),
    objectives_secondary: [],
    kpis_primary: [], kpis_secondary: [],
    treatments: 0, replications: 0,
    mds_covered: (WIZ._mds || []),
    rationale: ifVal('if_proj_desc')||'',
    attachments: [],
    protocol: proto ? proto.name : null,
    sai_lead: ifVal('if_lead'),
    risks: [],
    gates: _gatesFor(isDraft?'draft':'submitted'),
    created_at: new Date().toISOString(),
    submitted_at: isDraft ? null : new Date().toISOString(),
    owner_bu: projBu || ifVal('if_bu') || 'SAI',
    business_case: businessCase,
    project_description: { rationale: ifVal('if_proj_desc')||'' },
    // Trial Description (maquette SAI)
    trial_description: {
      country: ifVal('if_country'),
      site: ifVal('if_site'),
      lead: ifVal('if_lead'),
      tested_before: ifVal('if_tested') === 'Yes',
      prior_trial_id: ifVal('if_tested') === 'Yes' ? ifVal('if_priorId') : '',
      ocp_products: ifVal('if_prod'),
      collaborators_products: ifVal('if_collab'),
      competitors_products: ifVal('if_compet'),
      reference_url: ifVal('if_refUrl'),
      operational_objectives: ifVal('if_objp'),
      hypothesis: ifVal('if_hyp'),
    },
    // Execution Progress (vide à la création)
    execution: { installed:false, dataCollection:'', postHarvest:'', analysis:'' },
  };
  if (uc.fast_track && typeof govFtEligible === 'function' && !govFtEligible(uc)) {
    toast(trf('in.err.ftIneligible', {b: GOV.thresholds.ftMaxBudget.toLocaleString('en-US'), d: GOV.thresholds.ftMaxDurationDays}), 'err');
    uc.fast_track = false;
  }
  if (typeof govCeoRequired === 'function' && govCeoRequired(uc)) { uc.ceo_required = true; }
  DATA.unshift(uc);
  try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){}
  if(typeof apiUpsert==='function') apiUpsert('usecases', uc);
  if (typeof COACH !== 'undefined') { COACH.flag('uc-created'); COACH.flag('uc:'+uc.id+':mine'); }
  if(!isDraft && typeof notify === 'function'){
    if(uc.fast_track) notify('uc.submitted.ft', {uc, author: (window.DNAI_NPLAN && window.DNAI_NPLAN.user)||'Vous'});
    else notify('uc.submitted', {uc, author: (window.DNAI_NPLAN && window.DNAI_NPLAN.user)||'Vous'});
  }
  if (typeof dataChanged === 'function') dataChanged();
  toast(isDraft ? tr('in.toast.draft') : tr('in.toast.submit'));
  PREFS.filters = {};
  delete PREFS.intakeMode; delete PREFS.intakeStep; delete PREFS.intakeFT;
  WIZ = {};
  savePrefs();
  goView('portfolio');
}

function renderCalendar(){

  const months16 = ['Sep N-1','Oct N-1','Nov N-1','Dec N-1', ...monthsBase];
  // Current month index in the 16-col view: assume "now" is in N (year of pitch = 2026)
  const cur = 4 + (new Date().getMonth());
  // Bars now positioned over the 16-col axis (col 0 = Sep N-1).
  // Macro-phase color mapping per the 4-phase framework.
  const bars = [
    { lblK:'cal.b1',  subK:'cal.b1.s',  start:0,  end:0,  cls:'b-launch'   },
    { lblK:'cal.b2',  subK:'cal.b2.s',  start:1,  end:3,  cls:'b-launch'   },

    { lblK:'cal.b10', subK:'cal.b10.s', start:14, end:15, cls:'b-decision' }

  // 3 QBR in-year intake windows (Mar, Jun, Sep N), aligned with framework §4.1.
  const qbrCols = [6, 9, 12]; // Mar, Jun, Sep of N (1-indexed: Jan=4 → Mar=6, Jun=9, Sep=12)

        }).join('')}
        ${bars.map(b=>{
          const lbl = tr(b.lblK), sub = tr(b.subK);
          return `<div class="cal-row">
            <div class="cal-lbl">${escapeHtml(lbl)}<small>${escapeHtml(sub)}</small></div>
            ${months16.map((_,m)=>`<div class="cal-cell">${m===b.start?`<div class="cal-bar ${b.cls}" style="left:6px;right:6px;width:calc(${(b.end-b.start+1)*100}% - 12px)">${escapeHtml(lbl)}</div>`:''}</div>`).join('')}
          </div>`;
        }).join('')}
      </div>
    </div>

    <div class="card" style="margin-top:14px;background:linear-gradient(135deg,#fbfdfb,#f4faf5);border-color:var(--green-200)">
      <h3>${tr('cal.legend.h')} <span class="sub">${tr('cal.legend.sub')}</span></h3>

        <span><span class="legend-sw b-launch"></span> ${tr('mp.launch')}</span>
        <span><span class="legend-sw b-readiness"></span> ${tr('mp.readiness')}</span>
        <span><span class="legend-sw b-exec"></span> ${tr('mp.execution')}</span>
        <span><span class="legend-sw b-decision"></span> ${tr('mp.decision')}</span>
        <span><span class="legend-sw b-gate"></span> ${tr('cal.legend.gate')}</span>
        <span><span class="legend-sw b-qbr"></span> ${tr('cal.legend.qbr')}</span>
        <span><span class="legend-sw b-fast"></span> ${tr('cal.legend.fast')}</span>
      </div>

    <p class="muted" style="margin-top:10px">${tr('cal.today')} ${new Date().toLocaleDateString(tr('date'),{day:'2-digit',month:'long',year:'numeric'})}.</p>

// v0.22 — Décision steering & monitoring inline (depuis l'accordion)
function govSetDecision(ucId, val){
  if(typeof _rbacGuard==='function' && !_rbacGuard('do-steering-decide')) return;
  const u = ucById(ucId); if(!u) return;
  if(!val) return;
  // Trace dans le UC (gates synthétique)
  if(!u._steeringDecision) u._steeringDecision = {};
  u._steeringDecision = { decision: val, at: new Date().toISOString() };
  // Si Go : passe à CEO, si Hold : reste en steering avec flag, si Kill : closed-kill
  if(val==='go') u.status = (u.fast_track ? 'approved' : 'ceo');
  else if(val==='kill') u.status = 'closed-kill';
  // hold = reste en steering
  saveData();
  toast(trf('gov.dec.applied',{id:u.id,d:govDecLabel('steering',val)})||u.id+' : décision '+val+' enregistrée','ok');
  // v0.23 — Notifs Halima : 'steering.decided' → tous les rôles entity_* + sai_reviewer
  if(typeof notify==='function') notify('steering.decided', {uc:u, decision:val});
}
function govSetMonDecision(ucId, val){
  if(typeof _rbacGuard==='function' && !_rbacGuard('do-monitoring-decide')) return;
  const u = ucById(ucId); if(!u) return;
  if(!val) return;
  u.status = val;  // closed-go | closed-hold | closed-kill
  u._monitoringDecision = { decision: val, at: new Date().toISOString() };
  saveData();
  toast(trf('gov.mondec.applied',{id:u.id,d:govDecLabel('monitoring',val)})||u.id+' : verdict '+val,'ok');
  // v0.23 — Notif Halima : 'monitoring.decided' → entity_*
  if(typeof notify==='function') notify('monitoring.decided', {uc:u, verdict:val});
}

/* -----------------------------------------------------------------
 * v0.22 — CEO APPROVAL : validation au niveau portfolio entité
 * (retour Halima #4 + #5). Le CEO valide le portfolio entité dans
 * son ensemble, avec drill-down possible vers les projets.
 *
 * Layout :
 *  - Section 1 : Annual Portfolio KPIs (7 ans × Projects/Trials/Demos/Budget)
 *  - Section 2 : Portfolio Overview by Entity (1 card par entité avec
 *    table interne par région + CEO Decision dropdown + commentaires)
 * --------------------------------------------------------------- */
function ceoBodyHtml(){
  const Y = 2026;
  // Persistance des décisions CEO par entité×région (localStorage + serveur)
  if(!window._ceoDecisions){
    try { window._ceoDecisions = JSON.parse(localStorage.getItem('nplan_ceo_decisions_v1')||'{}'); }
    catch(e) { window._ceoDecisions = {}; }
  }

  // ── Annual KPIs : 7 années (2024 → 2030) ──
  const years = [2024,2025,2026,2027,2028,2029,2030];
  const annualKPI = years.map(yr => {
    const projOfYear = (typeof PROJECTS !== 'undefined' ? PROJECTS : []).filter(p => {
      const s = parseInt(p.start_year || p.cycle || 2026) || 2026;
      const e = parseInt(p.end_year   || p.duration_end || (s+(p.duration||3))) || (s+3);
      return yr >= s && yr <= e;
    });
    const ucsOfYear = DATA.filter(u => {
      if(!u.start_date) return yr === 2026;  // fallback : UC sans date = cycle courant
      const sy = new Date(u.start_date).getFullYear();
      const ey = u.end_date ? new Date(u.end_date).getFullYear() : sy;
      return yr >= sy && yr <= ey;
    });
    const committed = ucsOfYear.reduce((s,u) => s + (u.budget||0), 0);
    return {
      yr, projects: projOfYear.length,
      trials: ucsOfYear.filter(u => u.type !== 'demo').length,
      demos:  ucsOfYear.filter(u => u.type === 'demo').length,
      committed,
    };
  });

  // ── Entity cards : 1 card par BU avec table par région ──
  const entCards = BUS.map(bu => {
    const entUCs = DATA.filter(u => u.bu === bu.id);
    if(entUCs.length === 0) return '';  // skip empty entities
    const entProjs = [...new Set(entUCs.map(u => u.project_id).filter(Boolean))];
    const totalBudget = entUCs.reduce((s,u) => s+(u.budget||0), 0);

    // Steering decisions summary
    const goCount = entUCs.filter(u => u._steeringDecision?.decision === 'go').length;
    const holdCount = entUCs.filter(u => u._steeringDecision?.decision === 'hold').length;
    const killCount = entUCs.filter(u => u._steeringDecision?.decision === 'kill').length;
    const pendingCount = entUCs.length - goCount - holdCount - killCount;

    // Groupement par région
    const regions = [...new Set(entUCs.map(u => u.region).filter(Boolean))];
    const regionRows = regions.map(reg => {
      const regUCs = entUCs.filter(u => u.region === reg);
      const regProjs = [...new Set(regUCs.map(u => u.project_id).filter(Boolean))];
      const regTrials = regUCs.filter(u => u.type !== 'demo').length;
      const regDemos  = regUCs.filter(u => u.type === 'demo').length;
      const regBudget = regUCs.reduce((s,u) => s+(u.budget||0), 0);
      const regCrops  = [...new Set(regUCs.map(u => u.crop).filter(Boolean))];

      const key = bu.id + '|||' + reg;
      const dec = (window._ceoDecisions[key]||{}).decision || '';
      const cmt = (window._ceoDecisions[key]||{}).comment || '';

function ceoSetDecision(buId, region, field, value){
  if(typeof _rbacGuard==='function' && !_rbacGuard('do-ceo-decide')) return;
  if(!window._ceoDecisions) window._ceoDecisions = {};
  const key = buId + '|||' + region;
  if(!window._ceoDecisions[key]) window._ceoDecisions[key] = {};
  // v0.23.1 #10 : dedupe notif — ne fire que si la décision change vraiment
  const previousDecision = window._ceoDecisions[key][field];
  window._ceoDecisions[key][field] = value;
  window._ceoDecisions[key].at = new Date().toISOString();
  try{ localStorage.setItem('nplan_ceo_decisions_v1', JSON.stringify(window._ceoDecisions)); }catch(e){}
  // Push serveur via apiPush (collection 'ceo_decisions' à whitelist plus tard)
  if(typeof apiPush==='function') apiPush('ceo_decisions', window._ceoDecisions);
  // Notif uniquement si decision change effectivement de valeur (évite spam)
  if(field === 'decision' && value && value !== previousDecision && typeof notify==='function'){
    const bu = buOf(buId);
    notify('ceo.decided', {bu: bu?bu.nm:buId, region, decision: value, comment: window._ceoDecisions[key].comment});
  }
  // Re-render léger pour refléter le changement de couleur du select
  // (CEO Approval est une sous-page de Gouvernance ET une vue à part)
  if(field === 'decision'){
    if(PREFS && PREFS.view==='governance' && typeof renderGovernance==='function') renderGovernance();
    else renderCEO();
  }
}

/* ---- Admin · Référentiels (CRUD persisté en BDD) ---- */
function refUsageField(key){ return {bus:'bu',crops:'crop',products:'product',partners:'partner',regions:'region',partner_types:'partner_type'}[key]; }
function refUsageCount(key, value){
  // v0.21 : extension à MDS (champ array dans chaque UC).
  if(key==='mds'){
    return DATA.filter(u => Array.isArray(u.mds_covered) && u.mds_covered.includes(value)).length;
  }
  const f = refUsageField(key); if(!f) return 0;
  return DATA.filter(u=>String(u[f])===String(value)).length;
}
// v0.21 : renommer un item string en propageant l'ancien→nouveau dans DATA (évite les références cassées).
// v0.22.4 — Guard RBAC réutilisable (defense in depth pour mutations admin)
function _rbacGuard(perm, msg){
  if(typeof can === 'function' && !can(perm)){
    if(typeof toast === 'function') toast(msg || (tr('rbac.deny')||'Action non autorisée pour ce rôle'), 'err');
    return false;
  }
  return true;
}
function refRenameStr(key, i, newVal){
  if(!_rbacGuard('do-crud-ref')) return;
  const r=refByKey(key); const list=r.get().slice();
  const old=list[i]; newVal=(newVal||'').trim();
  if(!newVal || newVal===old) return;
  if(list.some((x,j)=>j!==i && String(x).toLowerCase()===newVal.toLowerCase())){ toast(tr('adm.dup'),'err'); renderAdmin(); return; }
  list[i]=newVal; r.set(list);
  // Propagation cascade dans DATA (champ scalaire OU array MDS)
  const f = refUsageField(key);
  if(f){ DATA.forEach(u=>{ if(String(u[f])===String(old)) u[f]=newVal; }); }
  if(key==='mds'){ DATA.forEach(u=>{ if(Array.isArray(u.mds_covered)){ u.mds_covered = u.mds_covered.map(m=>m===old?newVal:m); } }); }
  saveData();
  refAfterChange();
  toast(trf('adm.renamed',{old:old, n:newVal}),'ok');
}

// v0.21 : édition inline d'une chip ref string (dblclick → input → blur/Enter pour valider)
function refChipEdit(chip){
  // v0.22.4 — RBAC defense in depth : seul admin peut renommer un référentiel
  if(typeof can === 'function' && !can('do-crud-ref')){
    if(typeof toast === 'function') toast(tr('rbac.deny')||'Action réservée à l\'admin', 'err');
    return;
  }
  const key = chip.dataset.key, i = +chip.dataset.i, cur = chip.dataset.v;
  const lbl = chip.querySelector('.ref-chip-lbl');
  if(!lbl || lbl.querySelector('input')) return;
  const inp = document.createElement('input');
  inp.type='text'; inp.value = cur; inp.className='ref-chip-inp';
  inp.onblur = ()=>refRenameStr(key, i, inp.value);
  inp.onkeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); inp.blur(); }
    else if(e.key==='Escape'){ inp.value = cur; inp.blur(); }
  };
  lbl.textContent='';
  lbl.appendChild(inp);
  inp.focus(); inp.select();
}
function refAddStr(key){
  if(!_rbacGuard('do-crud-ref')) return;
  const inp=document.getElementById('refadd_'+key); const v=(inp.value||'').trim(); if(!v) return;
  const r=refByKey(key); const list=r.get().slice();
  if(list.some(x=>String(x).toLowerCase()===v.toLowerCase())){ toast(tr('adm.dup')); return; }
  list.push(v); r.set(list); refAfterChange();
}
// Review SAI #3 — CRUD d'un référentiel groupé (ajout/suppression d'une valeur
// dans un groupe, ex. ajouter un pays à une BU).
function refGroupedAdd(key, group){
  if(!_rbacGuard('do-crud-ref')) return;
  const inp=document.getElementById('refadd_'+key+'_'+group); const v=((inp&&inp.value)||'').trim(); if(!v) return;
  const r=refByKey(key); const obj=JSON.parse(JSON.stringify(r.get()||{}));
  obj[group]=obj[group]||[];
  if(obj[group].some(x=>String(x).toLowerCase()===v.toLowerCase())){ toast(tr('adm.dup')); return; }
  obj[group].push(v); r.set(obj); refAfterChange();
}
async function refGroupedDel(key, group, i){
  if(!_rbacGuard('do-crud-ref')) return;
  const r=refByKey(key); const obj=JSON.parse(JSON.stringify(r.get()||{}));
  if(!obj[group] || !obj[group].length) return;
  const val=obj[group][i];
  const used=refUsageCount(key, val);
  if(used>0){ toast(trf('adm.usedBy',{n:used}), 'err'); return; }
  const ok = await UI.confirm({ eyebrow: tr('adm.del'), title: trf('adm.confirmDel',{v:val}), body: tr('adm.confirmDel.body')||'', danger:true, ok: tr('adm.del'), cancel: tr('adm.cancel')||'Annuler' });
  if(!ok) return;
  obj[group].splice(i,1); r.set(obj); refAfterChange();
}
function refAddObj(key){
  if(!_rbacGuard('do-crud-ref')) return;
  const r=refByKey(key); const obj={};
  r.cols.forEach(c=>{ const el=document.getElementById('refadd_'+key+'_'+c[0]); obj[c[0]]=(el&&el.value.trim())||''; });
  if(!Object.values(obj).some(Boolean)){ return; }
  if(key==='bus' && !obj.id) obj.id = (obj.nm||'BU').slice(0,4).toUpperCase();
  if(key==='partners' && !obj.typ) obj.typ='Partenaire';
  const list=r.get().slice(); list.push(obj); r.set(list); refAfterChange();
}
function refUpdObj(key,i,field,val){
  if(!_rbacGuard('do-crud-ref')) return;
  const r=refByKey(key); const list=r.get().slice(); if(!list[i]) return;
  list[i]={...list[i],[field]:val}; r.set(list); persistRef();
}
async function refDel(key,i){
  if(!_rbacGuard('do-crud-ref')) return;
  const r=refByKey(key); const list=r.get().slice(); const val=list[i];
  const label = (typeof val==='object')?(val.nm||val.id):val;
  const used = refUsageCount(key, (typeof val==='object')?(val.id||val.nm):val);
  if(used>0){ toast(trf('adm.usedBy',{n:used}), 'err'); return; }
  const ok = await UI.confirm({
    eyebrow: tr('adm.del'),
    title: trf('adm.confirmDel',{v:label}),
    body: tr('adm.confirmDel.body')||'',
    danger: true,
    ok: tr('adm.del'),
    cancel: tr('adm.cancel')||'Annuler'
  });
  if(!ok) return;
  list.splice(i,1); r.set(list); refAfterChange();
}
function refExport(){

let AX_LAST_FOCUS = null;

// v0.19 — persistence des rôles (collection 'roles' whitelistée côté PHP)
function axLoadRolesFromServer(){
  const c = apiCfg && apiCfg();
  if(!c || !c.api) return;
  fetch(c.api+'/collection/roles', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
    .then(r=>r.ok?r.json():null)
    .then(r=>{
      if(r && Array.isArray(r.data) && r.data.length){
        AX_USERS = r.data;
        // Re-render si on est sur l'écran admin > access
        if(PREFS.view==='admin' && PREFS.adminTab==='access' && typeof renderAdmin==='function') renderAdmin();
      } else {
        // Première fois : pousse le seed AX_USERS sur le serveur
        axSaveRolesToServer();
      }
    })
    .catch(()=>{});
}
function axSaveRolesToServer(){
  const c = apiCfg && apiCfg();
  if(!c || !c.api) return;
  fetch(c.api+'/collection/roles', {
    method:'PUT', credentials:'same-origin',
    headers:{'Content-Type':'application/json', 'X-WP-Nonce':c.nonce||''},
    body: JSON.stringify({ data: AX_USERS })
  }).catch(()=>{});
}

function axInitAccess(){
  // Tente de charger depuis le serveur (sinon reste sur le seed AX_USERS)
  axLoadRolesFromServer();
  // Animate sparklines
  document.querySelectorAll('#sc-admin .ax-spark').forEach(s => s.classList.add('revealed'));
  // Animate number counters
  document.querySelectorAll('#sc-admin .ax-ctr').forEach(el => {
    const to = parseInt(el.dataset.to, 10);
    const dur = 900;
    const start = performance.now();
    function step(t){
      const k = Math.min(1, (t - start)/dur);
      const eased = 1 - Math.pow(1-k, 4);
      el.textContent = Math.round(to * eased);
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}
function axFilterUsers(q){
  q = (q||'').toLowerCase().trim();
  document.querySelectorAll('#axTbody tr').forEach(tr => {
    const t = tr.textContent.toLowerCase();
    tr.style.display = !q || t.includes(q) ? '' : 'none';
  });
}
function axPickChip(el, role){
  document.querySelectorAll('.ax-chip').forEach(c => { c.classList.remove('on'); c.setAttribute('aria-pressed','false'); });
  el.classList.add('on'); el.setAttribute('aria-pressed','true');
  document.querySelectorAll('#axTbody tr').forEach((tr,i) => {
    if (role === 'all') { tr.style.display = ''; return; }
    const roles = (AX_USERS[i] && AX_USERS[i].roles) || [];
    tr.style.display = roles.some(r => r[0] === role) ? '' : 'none';
  });
}
function axSort(th){
  const cur = th.getAttribute('aria-sort');
  document.querySelectorAll('#sc-admin .ax-users th.s').forEach(o => o.setAttribute('aria-sort','none'));
  th.setAttribute('aria-sort', cur === 'descending' ? 'ascending' : 'descending');
}
function axToggleAll(master){
  document.querySelectorAll('.ax-cb-row').forEach(cb => cb.checked = master.checked);
  axUpdBatch();
}
function axClearSel(){
  document.querySelectorAll('.ax-cb-row, #axCbAll').forEach(cb => { cb.checked = false; cb.indeterminate = false; });
  axUpdBatch();
}
function axUpdBatch(){
  const sel = document.querySelectorAll('.ax-cb-row:checked').length;
  const tot = document.querySelectorAll('.ax-cb-row').length;
  const cbAll = document.getElementById('axCbAll');
  const bar = document.getElementById('axBatch');
  const n = document.getElementById('axSelN');
  if (n) n.textContent = sel;
  if (bar) bar.classList.toggle('on', sel > 0);
  document.querySelectorAll('.ax-cb-row').forEach(cb => cb.closest('tr').classList.toggle('sel', cb.checked));
  if (cbAll){
    if (sel === 0) { cbAll.checked = false; cbAll.indeterminate = false; }
    else if (sel === tot) { cbAll.checked = true; cbAll.indeterminate = false; }
    else { cbAll.checked = false; cbAll.indeterminate = true; }
  }
}

/* -----------------------------------------------------------------
 * v0.11 a11y : keyboard-actionable hook — any <div onclick> /
 * KPI / kanban card / table row / chip / sidebar item / heatmap
 * cell / KB card / alert action becomes Enter / Space activable,
 * receives role="button" and tabindex="0". MutationObserver re-runs
 * after each render (the app re-writes innerHTML often).
 * --------------------------------------------------------------- */
(function a11yClickable(){
  const sel = '[onclick], .kpi:not(.kpi--static), .kn-card, .tbl tr.t-link, .chip, .pf-empty-hero button, .sb-item, .kb-card, .heat-row .h-cell, .alert .act';
  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ') return;
    const t = e.target;
    if(!t.matches || !t.matches(sel)) return;
    if(t.tagName==='BUTTON' || t.tagName==='A' || t.tagName==='INPUT' || t.tagName==='SELECT' || t.tagName==='TEXTAREA') return;
    e.preventDefault();
    t.click();
  });
  function promote(){
    document.querySelectorAll(sel).forEach(function(el){
      if(el.tagName==='BUTTON' || el.tagName==='A' || el.tagName==='INPUT' || el.tagName==='SELECT' || el.tagName==='TEXTAREA') return;
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
    });
  }
  promote();
  let _t=null;
  const mo = new MutationObserver(function(){
    if(_t) return;
    _t = setTimeout(function(){ _t=null; promote(); }, 80);
  });
  mo.observe(document.body, {childList:true, subtree:true});
})();

/* ============================================================
 * FEEDBACK EDITION — clic-droit sur n'importe quel bloc pour
 * déposer un commentaire lié à son contexte (vue / bloc /
 * sélecteur). Tout reste en localStorage ; export JSON / CSV /
 * markdown depuis le panneau. Porté 1:1 du CGM Cockpit.
 * ============================================================ */
const FB = (function(){
  const LS='nutriplan_feedback_v1', LS_AUTHOR='nutriplan_feedback_author_v1';
  let list = []; try{ list = JSON.parse(localStorage.getItem(LS))||[]; }catch(e){ list=[]; }
  let author = ''; try{ author = localStorage.getItem(LS_AUTHOR)||''; }catch(e){}
  function save(){ try{ localStorage.setItem(LS, JSON.stringify(list)); }catch(e){} renderBadge(); }
  function setAuthor(a){ author=(a||'').trim(); try{ localStorage.setItem(LS_AUTHOR, author); }catch(e){} }
  function uid(){ return 'fb-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function viewLabel(){
    const id = (typeof PREFS!=='undefined' && PREFS.view) ? PREFS.view : 'cockpit';
    const nav = (typeof NAV!=='undefined') ? NAV.find(n=>n.id===id) : null;
    return nav ? tr(nav.crumbK) : id;
  }
  function blockLabel(el){
    if(!el) return '(zone)';
    let n=el.closest('[data-fb-name]'); if(n) return n.getAttribute('data-fb-name');
    const known=el.closest('.card, .ck-hero, .kpi, .kb-card, .kn-card, .uc-sect, .uc-kpi, .form-section, .heat-row, .row-2c, .cal-row, .mds-row, .screen');
    if(known){
      const h=known.querySelector('h2,h3,h4,.eyebrow,.h-pg'); if(h && h.textContent.trim()) return h.textContent.trim().slice(0,80);
      const cls=(known.className||'').split(/\s+/).find(c=>/^(card|ck-|kpi|kb|kn|uc|form|heat|row|cal|mds)/.test(c)); if(cls) return cls;
    }
    let p=el; for(let i=0;i<8 && p;i++,p=p.parentElement){ const hh=p.querySelector && p.querySelector('h2,h3,h4'); if(hh) return hh.textContent.trim().slice(0,80); }
    return '(zone non identifiée)';
  }
  function selectorOf(el){
    if(!el) return '';
    if(el.id) return '#'+el.id;
    const path=[];
    while(el && el.nodeType===1 && path.length<5){
      let p=el.nodeName.toLowerCase();
      if(el.className && typeof el.className==='string'){ const c=el.className.trim().split(/\s+/).slice(0,2).join('.'); if(c) p+='.'+c; }
      path.unshift(p);
      el=el.parentElement;
    }
    return path.join(' > ');
  }
  let hoveredEl=null, modal=null;
  function addAt(el){
    hoveredEl=el; closeMenu();
    el && el.classList.add('fb-highlight');
    const view=viewLabel(); const block=blockLabel(el); const sel=selectorOf(el);
    modal=document.createElement('div'); modal.className='fb-modal-wrap';
    modal.innerHTML='<div class="fb-modal" onclick="event.stopPropagation()">'
      +'<div class="fb-head"><h3>💬 Ajouter un commentaire</h3><button class="fb-x" aria-label="Fermer">✕</button></div>'
      +'<div class="fb-ctx"><span class="fb-lbl">SUR</span><b>'+escapeHtml(block)+'</b><span class="fb-bread">'+escapeHtml(view)+'</span></div>'
      +'<label class="fb-flbl">Auteur</label><input class="fb-author" type="text" placeholder="ton prénom" value="'+escapeHtml(author)+'">'
      +'<label class="fb-flbl">Commentaire</label><textarea class="fb-text" rows="4" placeholder="Que faut-il changer / ajouter / corriger ?"></textarea>'
      +'<div class="fb-act"><button class="fb-cancel">Annuler</button><button class="fb-save">Enregistrer</button></div>'
      +'</div>';
    document.body.appendChild(modal);
    const close=()=>{ if(modal){modal.remove();modal=null;} if(hoveredEl) hoveredEl.classList.remove('fb-highlight'); };
    modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
    modal.querySelector('.fb-x').onclick=close;
    modal.querySelector('.fb-cancel').onclick=close;
    setTimeout(()=>{ const t=modal.querySelector('.fb-text'); if(t) t.focus(); },50);
    modal.querySelector('.fb-save').onclick=function(){
      const a=modal.querySelector('.fb-author').value.trim();
      const text=modal.querySelector('.fb-text').value.trim();
      if(!text){ toast('Le commentaire est vide.', 'err'); return; }
      setAuthor(a);
      list.unshift({id:uid(), ts:new Date().toISOString(), author:a, view:view, block:block, selector:sel, lang:LANG, comment:text});
      save(); close(); flashBadge();
    };
  }
  let menu=null;
  function closeMenu(){ if(menu){menu.remove();menu=null;} }
  function openMenu(e){
    closeMenu(); const target=e.target;
    if(target.closest && target.closest('input, select, textarea, .fb-modal, .fb-panel')) return;
    e.preventDefault();
    menu=document.createElement('div'); menu.className='fb-menu';
    menu.style.left=Math.min(e.clientX, window.innerWidth-220)+'px';
    menu.style.top =Math.min(e.clientY, window.innerHeight-110)+'px';
    menu.innerHTML='<button class="fb-mi" data-act="add">💬 Ajouter un commentaire ici</button>'
      +'<button class="fb-mi" data-act="open">📋 Voir tous les commentaires ('+list.length+')</button>';
    document.body.appendChild(menu);
    menu.querySelector('[data-act=add]').onclick=()=>{ closeMenu(); addAt(target); };
    menu.querySelector('[data-act=open]').onclick=()=>{ closeMenu(); openPanel(); };
  }
  document.addEventListener('contextmenu', openMenu);
  document.addEventListener('click', e=>{ if(menu && !menu.contains(e.target)) closeMenu(); });
  let badge=null, panel=null;
  function renderBadge(){ if(!badge) return; badge.innerHTML='💬 '+list.length+' commentaire'+(list.length>1?'s':''); badge.classList.toggle('hot', list.length>0); }
  function flashBadge(){ if(!badge) return; badge.classList.add('flash'); setTimeout(()=>badge.classList.remove('flash'), 700); }
  function openPanel(){
    if(panel){ panel.remove(); panel=null; return; }
    panel=document.createElement('div'); panel.className='fb-panel';
    const head='<div class="fb-phead"><h3>📋 Commentaires ('+list.length+')</h3><button class="fb-x" aria-label="Fermer le panneau">✕</button></div>'
      +'<div class="fb-pacts"><button class="fb-btn" data-act="exjson">⤓ JSON</button><button class="fb-btn" data-act="excsv">⤓ CSV</button><button class="fb-btn" data-act="excopy">📋 Copier markdown</button><span style="flex:1"></span><button class="fb-btn danger" data-act="clear">🗑 Tout effacer</button></div>';
    const body=list.length?
      '<div class="fb-list">'+list.map(c=>`<div class="fb-item" data-id="${c.id}">
        <div class="fb-iblock"><b>${escapeHtml(c.block)}</b><span>${escapeHtml(c.view)}</span></div>
        <div class="fb-itext">${escapeHtml(c.comment)}</div>
        <div class="fb-imeta"><span>${escapeHtml(c.author||'anonyme')}</span><span>${new Date(c.ts).toLocaleString('fr-FR')}</span><button class="fb-del" title="Supprimer">🗑</button></div>
      </div>`).join('')+'</div>':
      '<p class="fb-empty">Aucun commentaire pour le moment. Clic-droit sur n\'importe quel bloc pour en ajouter un.</p>';
    panel.innerHTML='<div class="fb-pinner">'+head+body+'</div>';
    document.body.appendChild(panel);
    panel.querySelector('.fb-x').onclick=()=>{ panel.remove(); panel=null; };
    panel.querySelectorAll('.fb-del').forEach(b=>b.onclick=function(e){ e.stopPropagation();
      const id=this.closest('.fb-item').dataset.id; list=list.filter(x=>x.id!==id); save(); panel.remove(); panel=null; openPanel();
    });
    panel.querySelector('[data-act=clear]').onclick=async function(){
      const ok=await UI.confirm({title:'Effacer tous les commentaires ?', danger:true, ok:'Tout effacer'});
      if(!ok) return; list=[]; save(); panel.remove(); panel=null; openPanel();
    };
    panel.querySelector('[data-act=exjson]').onclick=()=>exportFile('nutriplan-feedback-'+stamp()+'.json', JSON.stringify({exportedAt:new Date().toISOString(),count:list.length,comments:list},null,2), 'application/json');
    panel.querySelector('[data-act=excsv]').onclick=()=>exportFile('nutriplan-feedback-'+stamp()+'.csv', toCsv(), 'text/csv;charset=utf-8');
    panel.querySelector('[data-act=excopy]').onclick=()=>{ navigator.clipboard.writeText(toMarkdown()).then(()=>toast('📋 Copié — colle dans Teams/Slack/Notion.','ok')); };
  }
  function stamp(){ const d=new Date(); return d.toISOString().slice(0,16).replace(/[:T]/g,'-'); }
  function csvQ(s){ s=String(s==null?'':s); return '"'+s.replace(/"/g,'""')+'"'; }
  function toCsv(){
    const head=['ts','author','view','block','comment','selector','lang'];
    const rows=list.map(c=>[c.ts,c.author||'',c.view,c.block,c.comment,c.selector||'',c.lang||''].map(csvQ).join(','));
    return '﻿'+head.join(',')+'\n'+rows.join('\n');
  }
  function toMarkdown(){
    if(!list.length) return '_(aucun commentaire)_';
    return list.map((c,i)=>`### ${i+1}. ${c.block} *(${c.view})*\n- **Par** ${c.author||'anonyme'} — ${new Date(c.ts).toLocaleString('fr-FR')}\n\n${c.comment}\n`).join('\n---\n\n');
  }
  function exportFile(name, content, mime){
    const blob=new Blob([content],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }
  function mountBadge(){
    badge=document.createElement('button'); badge.className='fb-badge'; badge.onclick=openPanel;
    badge.title='Voir les commentaires · clic-droit sur un bloc pour en ajouter un';
    document.body.appendChild(badge); renderBadge();
  }
  return {mount:mountBadge, openPanel:openPanel, count:()=>list.length};
})();
FB.mount();

postHeight();
</script>
