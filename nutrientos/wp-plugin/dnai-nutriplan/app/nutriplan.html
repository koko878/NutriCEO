function _backDate(d){ const x=new Date(); x.setDate(x.getDate()-d); return x.toISOString().slice(0,10); }
function _gatesFor(status){
  // 4 gates per the validated framework v1.0:
  //   Gate 1 = Trial Steering Committee (Ideation)
  //   Gate 2 = Trial Steering Committee (Execution readiness)
  //   Gate 3 = Scientific Monitoring Committee (Evidence review)
  //   Gate 4 = Scientific Monitoring Committee (Deployment Readiness)
  const order = ['submitted','steering','ceo','execution','monitoring','closed'];
  const idx = order.indexOf(status.replace(/^closed-.*$/,'closed'));
  const gates = [
    { id:'steering1', nm:'Trial Steering Committee — Gate 1', when:'2025-11-20', kind:'Gate 1 — Ideation' },
    { id:'steering2', nm:'Trial Steering Committee — Gate 2', when:'2025-12-10', kind:'Gate 2 — Execution readiness' },
    { id:'monitoring',nm:'Scientific Monitoring Committee',   when:'TBD',         kind:'Gate 3 — Evidence review' },
    { id:'deploy',    nm:'Deployment Readiness',              when:'TBD',         kind:'Gate 4 — Deployment readiness' }
  ];
  return gates.map((g,i)=>{
    let st='upcoming', dec=null;
    if(idx<=0){ st = i===0?'current':'upcoming'; }
    else if(idx===1){ st = i===0?'done':(i===1?'current':'upcoming'); if(i===0) dec='go'; }
    else if(idx===2){ st = i<2?'done':(i===2?'current':'upcoming'); if(i<2) dec='go'; }
    else if(idx>=3){ st = i<3?'done':(i===3?'current':'upcoming'); if(i<3) dec='go'; }
    if(status==='closed-hold' && i===2){ dec='hold'; }
    if(status==='closed-kill' && i===2){ dec='kill'; }
    if(status==='closed-go'   && i===2){ dec='go'; }
    if(status==='closed-go'   && i===3){ dec='go'; st='done'; }
    return Object.assign({}, g, { status:st, decision:dec });
  });
}

// Fix : seedProjects() n'assigne project_id qu'au 1er boot (avant cache). Après

// re-rattache à chaque boot, de façon idempotente, par BU.
function relinkTrialsToProjects(){
  if(!Array.isArray(DATA) || !Array.isArray(PROJECTS)) return false;
  const byBu = {};
  PROJECTS.forEach(p=>{ if(p.bu && !(p.bu in byBu)) byBu[p.bu] = p.id; });
  let changed = false;
  DATA.forEach(u=>{ if(!u.project_id && byBu[u.bu]){ u.project_id = byBu[u.bu]; changed = true; } });
  return changed;
}

function apiCfg(){ return CHAT_BACKEND || window.DNAI_NPLAN || null; }
function apiReady(){ const c=apiCfg(); return !!(c && c.api); }
let _pushTimers = {};
function apiPush(collection, data){
  // PUT bulk débounce — évite de marteler le serveur à chaque frappe.
  if(!apiReady()) return;
  clearTimeout(_pushTimers[collection]);
  _pushTimers[collection] = setTimeout(()=>{
    const c=apiCfg();
    fetch(c.api+'/collection/'+collection, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-WP-Nonce':c.nonce||''},
      credentials:'same-origin',
      body: JSON.stringify({ data })
    }).catch(()=>{});  // silencieux : le cache local garde la main si offline
  }, 600);
}
function apiUpsert(collection, item){
  if(!apiReady()) return Promise.resolve();
  const c=apiCfg();
  return fetch(c.api+'/item/'+collection, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-WP-Nonce':c.nonce||''},
    credentials:'same-origin',
    body: JSON.stringify(item)
  }).catch(()=>{});
}
function apiDelete(collection, id){
  if(!apiReady()) return Promise.resolve();
  const c=apiCfg();
  return fetch(c.api+'/item/'+collection+'/'+encodeURIComponent(id), {
    method:'DELETE', headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin'
  }).catch(()=>{});
}
// Sync au boot (et quand la config arrive par postMessage) :
//  - serveur a des données → on les adopte (source de vérité partagée)
//  - serveur vide → on l'amorce avec ce qu'on a en local/seed
let _syncedOnce = false;
function syncFromServer(){
  if(!apiReady() || _syncedOnce) return;
  _syncedOnce = true;
  const c=apiCfg();
  fetch(c.api+'/collection/usecases', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
    .then(r=>r.ok?r.json():null)
    .then(res=>{
      if(res && Array.isArray(res.data) && res.data.length){
        DATA = res.data;
        try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){}
        renderSidebar();
        if(typeof goView==='function') goView(PREFS.view||'cockpit');
      } else {
        // serveur vide → amorçage initial avec l'état courant (seed inclus)
        apiPush('usecases', DATA);
      }
      // Référentiels : adopter ceux du serveur s'ils existent
      fetch(c.api+'/collection/reference', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
        .then(r=>r.ok?r.json():null)
        .then(rr=>{ if(rr && rr.data && typeof applyRefFromServer==='function') applyRefFromServer(rr.data); })
        .catch(()=>{});
      // v0.21 : Gouvernance — adopter la config serveur si elle existe.
      fetch(c.api+'/collection/governance', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
        .then(r=>r.ok?r.json():null)
        .then(gg=>{ if(gg && gg.data && typeof applyGovFromServer==='function') applyGovFromServer(gg.data); })
        .catch(()=>{});
      // Projets : adopter ceux du serveur, sinon amorcer
      fetch(c.api+'/collection/projects', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
        .then(r=>r.ok?r.json():null)
        .then(pp=>{
          if(pp && Array.isArray(pp.data) && pp.data.length){ PROJECTS = pp.data; try{ localStorage.setItem(LS_PROJECTS, JSON.stringify(PROJECTS)); }catch(e){} if(PREFS.view==='projects') renderProjects(); }
          else { apiPush('projects', PROJECTS); }
        }).catch(()=>{});
    })
    .catch(()=>{});
}
function loadPrefs(){
  try{ const v=JSON.parse(localStorage.getItem(LS_PREFS)); if(v) return v; }catch(e){}
  return { view:'cockpit', portfolioView:'kanban', filters:{}, chatOpen:false, impersonate:null };
}
function savePrefs(){ try{ localStorage.setItem(LS_PREFS, JSON.stringify(PREFS)); }catch(e){} }

/* =================================================================
 * v0.22.2 — RBAC complet UI/UX (11 rôles × 17 permissions atomiques)
 *
 * 2 niveaux :
 *   - actualRole : rôle réel de l'utilisateur (lu depuis AX_USERS via
 *     l'email apporté par window.DNAI_NPLAN.userEmail si dispo, sinon
 *     'admin' par défaut pour Hamza/dev).
 *   - impersonate : rôle simulé via le sélecteur "Vue" en topbar
 *     (uniquement utilisable par admin, masqué pour les autres rôles).
 *
 * effectiveRole() = impersonate || actualRole — utilisé partout via
 * can(perm) pour décider de masquer/afficher un élément.
 *
 * En CSS : <body data-effective-role="X"> + classes .rbac-XXX-only sur
 * les éléments sensibles ; le CSS masque ceux qui ne correspondent pas
 * au rôle effectif. Backend RBAC reste autorité (cette couche est UI).
 * ================================================================= */
const IMPERSONATE_ROLES = [
  ['',                     'Vue normale (mon rôle)'],
  ['admin',                'Admin'],
  ['entity_manager',       'Entity Manager (sponsor BU)'],
  ['entity_contributor',   'Entity Contributor'],
  ['entity_trial_owner',   'Trial Owner'],
  ['sai_reviewer',         'SAI Reviewer'],
  ['steering_member',      'Membre Steering'],
  ['monitoring_member',    'Membre Monitoring'],
  ['ceo_approver',         'CEO Approver'],
  ['fast_track_approver',  'Fast Track Approver'],
  ['reader',               'Lecteur seul'],
  ['it_support',           'IT Support'],
];

/* Matrice RBAC : rôle → liste des permissions atomiques accordées.
 * Les permissions sont ensuite gatées en UI via .rbac-<perm>-only
 * (caché si !can(perm)). 'view-*' = peut voir l'écran/onglet/section.
 * 'do-*' = peut effectuer l'action (boutons, dropdowns décision). */
const RBAC_MATRIX = {
  admin: ['view-admin','view-ceo-tab','view-controls','view-sai-review',
          'do-create-uc','do-edit-uc-any','do-delete-uc','do-sai-review',
          'do-steering-decide','do-monitoring-decide','do-ceo-decide',
          'do-ft-decide','do-edit-closure','do-export-closure',
          'do-configure-gov','do-crud-ref','do-manage-users','do-impersonate'],
  entity_manager: ['do-create-uc','do-edit-uc-bu','do-edit-closure','do-export-closure'],
  entity_contributor: ['do-edit-uc-bu','do-export-closure'],
  entity_trial_owner: ['do-edit-uc-own','do-edit-closure','do-export-closure'],
  sai_reviewer: ['view-sai-review','do-sai-review','do-export-closure'],
  steering_member: ['view-ceo-tab','view-controls','do-steering-decide','do-export-closure'],
  monitoring_member: ['do-monitoring-decide','do-export-closure'],
  ceo_approver: ['view-ceo-tab','do-ceo-decide','do-export-closure'],
  fast_track_approver: ['do-ft-decide','do-export-closure'],
  reader: [],
  it_support: [],
};

function getImpersonate(){ return (PREFS.impersonate && PREFS.impersonate.role) || ''; }
/* Rôle réel : par défaut admin (Hamza). En prod SSO Entra, ce sera
 * lu depuis le claim 'role' du token JWT injecté par window.DNAI_NPLAN. */
function actualRole(){
  if(window.DNAI_NPLAN && window.DNAI_NPLAN.role) return window.DNAI_NPLAN.role;
  return PREFS.actualRole || 'admin';
}
/* Rôle effectif : si admin a impersonné qqun, on prend l'impersonate ;
 * sinon le rôle réel. Les non-admin ne peuvent PAS impersonner. */
function effectiveRole(){
  const imp = getImpersonate();
  if(imp && actualRole() === 'admin') return imp;
  return actualRole();
}
function can(perm){
  const role = effectiveRole();
  const perms = RBAC_MATRIX[role] || [];
  return perms.includes(perm);
}
function canAny(perms){ return perms.some(p => can(p)); }

function setImpersonate(role){
  if(actualRole() !== 'admin'){
    toast(tr('rbac.imp.deny')||'Impersonate réservé aux admins', 'err');
    return;
  }
  PREFS.impersonate = role ? {role} : null;
  savePrefs();
  applyRBACUI();
  const lbl = role ? (IMPERSONATE_ROLES.find(r=>r[0]===role)||[])[1] || role : null;
  toast(role ? trf('rbac.imp.now',{r:lbl})||('Vue '+lbl) : tr('rbac.imp.reset')||'Vue normale rétablie', 'ok');
}

/* Applique le rôle effectif en UI : body[data-effective-role] +
 * data-actual-role. Le CSS .rbac-*-only utilise ces attrs pour
 * masquer ce qui n'est pas autorisé. Re-render sidebar + vue
 * courante pour appliquer les masquages dynamiques. */
function applyRBACUI(){
  const eff = effectiveRole();
  const actual = actualRole();
  const isImpersonating = getImpersonate() && actual === 'admin';
  document.body.setAttribute('data-effective-role', eff);
  document.body.setAttribute('data-actual-role', actual);
  document.body.classList.toggle('imp-on', !!isImpersonating);
  document.body.setAttribute('data-imp-role', isImpersonating ? eff : '');
  // Masque le sélecteur impersonate pour non-admin
  const impSel = document.getElementById('impSel');
  if(impSel){ impSel.closest('.tb-imp').style.display = (actual==='admin')?'':'none'; }
  if(typeof renderSidebar==='function') renderSidebar();
  if(typeof goView==='function' && PREFS.view) goView(PREFS.view);
  // v0.23.1 — inbox keyé par email (stable), juste refresh le bell pour
  // re-filtrer par le nouveau rôle effectif. Plus de reload du localStorage.
  if(typeof _refreshBell==='function'){ _refreshBell(); }
}
/* Alias rétrocompat */
function applyImpersonateUI(){ applyRBACUI(); }

/* Inbox utilisateur courant. Persisté par email ; en démo, indexé par
 * "effectiveRole" pour que chaque switch de "Vue" affiche le bon inbox. */
/* v0.23.1 — Refonte suite code review xhigh effort (fix 14 findings) :
 *
 * MODÈLE : 1 inbox stable PAR USER (email), indépendamment du rôle. Chaque
 * notif a un recipientRole (qui devait la recevoir). À l'affichage, on
 * filtre par effectiveRole() pour le mode démo impersonate ; en prod
 * (1 user = 1 role), tous les items de l'inbox correspondent à l'user.
 *
 * Pourquoi : key par email = un changement de rôle (SSO promotion) ne perd
 * plus l'historique des notifs. C'était bug #2 du code review.
 *
 * En prod, cette fn devrait POST à /wp-json/dnai-nutriplan/v1/notify
 * (endpoint dédié, append-only, vs. l'apiPush qui replace la collection
 * entière — bug #1 du code review : apiPush retiré ici).
 */
let NOTIF_INBOX = [];          // toutes les notifs de l'utilisateur, tous rôles confondus
let _notifMounted = false;      // guard #9 (re-init ne double pas le listener)
let _notifClickHandler = null;  // ref pour pouvoir remove proprement
const NOTIF_INBOX_MAX = 200;
const NOTIF_DEBUG = false;       // #13 : passer à true en dev pour logs détaillés

function _notifInboxKey(){
  // Key par email uniquement (#2) — un user garde son inbox même si son rôle change
  const userEmail = (window.DNAI_NPLAN && window.DNAI_NPLAN.userEmail) || 'demo';
  return 'nplan_notif_inbox_' + userEmail;
}
function _loadInbox(){
  try { NOTIF_INBOX = JSON.parse(localStorage.getItem(_notifInboxKey())||'[]'); } catch(e){ NOTIF_INBOX = []; }
}
function _saveInbox(){
  // #11 : trim in-memory ET on disk pour ne pas accumuler indéfiniment
  if(NOTIF_INBOX.length > NOTIF_INBOX_MAX) NOTIF_INBOX = NOTIF_INBOX.slice(0, NOTIF_INBOX_MAX);
  try { localStorage.setItem(_notifInboxKey(), JSON.stringify(NOTIF_INBOX)); } catch(e){}
}
// Notifs visibles dans l'inbox courant (filtrées par rôle effectif en mode démo).
// En prod (1 user = 1 role), c'est l'identité.
function _visibleInbox(){
  const role = (typeof effectiveRole==='function') ? effectiveRole() : null;
  if(!role) return NOTIF_INBOX;
  return NOTIF_INBOX.filter(n => n.recipientRole === role);
}
// ID unique avec entropie suffisante (#5 : 3 chars → 10 chars = 60+ bits)
function _notifId(role){
  return 'ntf-' + Date.now().toString(36) + '-' + role.slice(0,4) + '-' + Math.random().toString(36).slice(2,12);
}

/* notify(triggerId, ctx) : pour chaque recipient role, crée une notif
 * dans l'inbox utilisateur (avec recipientRole = role destinataire). En
 * démo, toutes les notifs vont dans le même bucket localStorage de
 * l'utilisateur connecté ; l'affichage filtre par effectiveRole.
 * En prod, le serveur résout les users par rôle et écrit dans le bucket
 * de chaque user destinataire. */
function notify(triggerId, ctx){
  const tpl = NOTIF_TEMPLATES[triggerId];
  if(!tpl){ if(NOTIF_DEBUG) console.warn('[notify] unknown trigger', triggerId); return; }
  ctx = ctx || {};
  // #3 : snapshot du ctx pour éviter qu'une mutation ultérieure du UC change l'historique
  let ctxSnapshot;
  try { ctxSnapshot = JSON.parse(JSON.stringify(ctx)); } catch(e) { ctxSnapshot = {}; }
  const myRole = (typeof effectiveRole==='function') ? effectiveRole() : 'admin';
  const title = (typeof tpl.title==='function') ? tpl.title(ctxSnapshot) : tpl.title;
  const body = (typeof tpl.body==='function') ? tpl.body(ctxSnapshot) : tpl.body;
  // #4 : batch — on accumule en mémoire puis un seul _saveInbox à la fin.
  // v0.23.2 : on accumule aussi un array `batch` pour POST en bulk au backend.
  let touched = false, myBatch = 0;
  const batch = [];
  tpl.recipients.forEach(role => {
    if(NOTIF_DEBUG) console.log('[notify] %s → %s : %s', triggerId, role, title);
    const n = {
      id: _notifId(role),
      ts: new Date().toISOString(),
      triggerId, recipientRole: role,
      title, body, ico: tpl.ico||'🔔', phase: tpl.phase,
      read: false, ctx: ctxSnapshot,
    };
    NOTIF_INBOX.unshift(n);
    batch.push(n);
    touched = true;
    if(role === myRole) myBatch++;
  });
  if(touched) _saveInbox();  // #4 : un seul write par notify(), pas N
  if(myBatch > 0){
    _refreshBell();
    if(typeof toast==='function') toast('🔔 ' + title, 'ok');
  }
  // v0.23.2 : POST en bulk au backend (append-only via /notify endpoint).
  // Idempotent côté serveur via UNIQUE(notif_id) — si le call est retried,
  // INSERT IGNORE évite les doublons. Silent fail si backend offline ou
  // pas configuré (localStorage reste la source de vérité côté client).
  if(batch.length){
    const c = (typeof apiCfg==='function') ? apiCfg() : null;
    if(c && c.api){
      try {
        fetch(c.api + '/notify', {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'X-WP-Nonce': c.nonce||''},
          credentials: 'same-origin',
          body: JSON.stringify({notifications: batch}),
        }).catch(()=>{});  // silent — l'inbox local est la source de vérité côté UI
      } catch(e){}
    }
  }
}

function notifMarkRead(id){
  const n = NOTIF_INBOX.find(x => x.id === id);
  if(!n || n.read) return;
  n.read = true;
  _saveInbox();
  _refreshBell();
  // #12 : update DOM surgicalement au lieu de tout reconstruire
  const item = document.querySelector('.notif-it[data-id="'+id+'"]');
  if(item){
    item.classList.remove('unread');
    item.classList.add('read');
    const dot = item.querySelector('.notif-it-dot');
    if(dot) dot.remove();
    // Met à jour le compteur "N non lues sur M"
    const sub = document.querySelector('.notif-sub');
    if(sub){
      const vis = _visibleInbox();
      sub.textContent = vis.filter(x=>!x.read).length + ' non lues sur ' + vis.length;
    }
  }
  _notifPushBackend('mark-read', {ids: [id]});
}
function notifMarkAllRead(){
  let changed = false;
  NOTIF_INBOX.forEach(n => { if(!n.read){ n.read = true; changed = true; } });
  if(changed){
    _saveInbox(); _refreshBell();
    // #14 : ne re-render que si le panel est visible
    const p = document.getElementById('notifPanel');
    if(p && p.classList.contains('on')) renderNotifPanel();
  }
  // v0.23.2 : push toujours au backend même si rien n'a changé en local
  // (le serveur peut avoir des notifs non encore syncées). Filtré par rôle
  // effectif pour ne pas mark-read des notifs d'autres rôles en démo
  // impersonate.
  const role = (typeof effectiveRole==='function') ? effectiveRole() : null;
  if(role) _notifPushBackend('mark-read', {all: true, roles: [role]});
}
function notifClear(){
  if(NOTIF_INBOX.length === 0) return;
  const role = (typeof effectiveRole==='function') ? effectiveRole() : null;
  // En démo impersonate, on ne clear que les notifs du rôle effectif
  // (l'inbox local contient toutes les notifs de l'user, tous rôles confondus)
  if(role){
    NOTIF_INBOX = NOTIF_INBOX.filter(n => n.recipientRole !== role);
    if(_notifPushBackend) _notifPushBackend('delete', {all: true, roles: [role]});
  } else {
    NOTIF_INBOX = [];
  }
  _saveInbox(); _refreshBell();
  const p = document.getElementById('notifPanel');
  if(p && p.classList.contains('on')) renderNotifPanel();
}

// v0.23.2 — Helper unique pour POST/DELETE au backend notifications.
// Silent fail si backend offline ou pas configuré. action ∈ {'mark-read','delete'}.
function _notifPushBackend(action, body){
  const c = (typeof apiCfg==='function') ? apiCfg() : null;
  if(!c || !c.api) return;
  const url = c.api + (action === 'delete' ? '/inbox' : '/inbox/mark-read');
  const method = (action === 'delete') ? 'DELETE' : 'POST';
  try {
    fetch(url, {
      method,
      headers: {'Content-Type':'application/json', 'X-WP-Nonce': c.nonce||''},
      credentials: 'same-origin',
      body: JSON.stringify(body || {}),
    }).catch(()=>{});
  } catch(e){}
}

// v0.23.2 — Fetch from backend at boot + merge with localStorage (dedupe by id).
// Appelé une fois depuis notifInit() après _loadInbox.
function _notifSyncFromServer(){
  const c = (typeof apiCfg==='function') ? apiCfg() : null;
  if(!c || !c.api) return;
  // Récupère les notifs de TOUS les rôles que l'user peut potentiellement
  // voir (en démo : tous les rôles RBAC, en prod : juste son rôle réel).
  // Permet de switcher impersonate et voir directement l'inbox de chaque vue.
  const roles = (typeof RBAC_MATRIX === 'object') ? Object.keys(RBAC_MATRIX) : ['admin'];
  const url = c.api + '/inbox?limit=500&roles=' + encodeURIComponent(roles.join(','));
  try {
    fetch(url, {
      headers: {'X-WP-Nonce': c.nonce||''},
      credentials: 'same-origin',
    })
    .then(r => r.ok ? r.json() : null)
    .then(res => {
      if(!res || !Array.isArray(res.notifications)) return;
      // Merge dédupliqué (id unique) — serveur fait autorité sur le statut read.
      const byId = {};
      NOTIF_INBOX.forEach(n => byId[n.id] = n);
      res.notifications.forEach(n => {
        if(!n.id) return;
        // Si déjà en local, on prend read_at du serveur si il l'a marqué lu
        if(byId[n.id]){ byId[n.id].read = n.read || byId[n.id].read; }
        else { byId[n.id] = n; }
      });
      // Reconstruit l'array triée par ts desc, cappée
      // ts peut être number (Date.now()) OU string ISO côté payload → on
      // normalise via Date.parse pour un compare robuste.
      const _t = v => { if(!v) return 0; if(typeof v==='number') return v; const p = Date.parse(v); return isNaN(p) ? 0 : p; };
      NOTIF_INBOX = Object.values(byId)
        .sort((a,b) => _t(b.ts) - _t(a.ts))
        .slice(0, NOTIF_INBOX_MAX);
      _saveInbox();
      _refreshBell();
      const p = document.getElementById('notifPanel');
      if(p && p.classList.contains('on')) renderNotifPanel();
    })
    .catch(()=>{});
  } catch(e){}
}

function _refreshBell(){
  const bell = document.getElementById('notifBell');
  if(!bell) return;
  const unread = _visibleInbox().filter(n => !n.read).length;
  let badge = bell.querySelector('.notif-bell-badge');
  if(unread > 0){
    if(!badge){
      badge = document.createElement('span');
      badge.className = 'notif-bell-badge';
      bell.appendChild(badge);
    }
    badge.textContent = unread > 99 ? '99+' : String(unread);
    bell.classList.add('has-unread');
  } else {
    if(badge) badge.remove();
    bell.classList.remove('has-unread');
  }
}

function toggleNotifPanel(){
  const p = document.getElementById('notifPanel');
  const bell = document.getElementById('notifBell');
  if(!p) return;
  const open = p.classList.toggle('on');
  // #6 : a11y — sync aria-expanded sur le bell
  if(bell) bell.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(open){
    renderNotifPanel();
  } else if(bell){
    // Retour focus sur le bell à la fermeture pour navigation clavier
    bell.focus();
  }
}
function renderNotifPanel(){
  const p = document.getElementById('notifPanel');
  if(!p) return;
  const list = _visibleInbox().slice(0, 50);
  p.innerHTML = `
    <div class="notif-h">
      <div>
        <div class="notif-t">Notifications</div>
        <div class="notif-sub">${list.filter(n=>!n.read).length} non lues sur ${list.length}</div>
      </div>
      <div class="notif-h-actions">
        <button class="notif-h-btn" onclick="notifMarkAllRead()" title="Tout marquer comme lu">✓ Tout lu</button>
        <button class="notif-h-btn" onclick="notifClear()" title="Vider la boîte">🗑</button>
      </div>
    </div>
    <div class="notif-list">
      ${list.length ? list.map(n => {
        const dt = new Date(n.ts);
        const rel = _notifRelTime(dt);
        return `<div class="notif-it ${n.read?'read':'unread'}" data-id="${escapeHtml(n.id)}" onclick="notifMarkRead('${n.id}')">
          <span class="notif-it-ico" aria-hidden="true">${n.ico}</span>
          <div class="notif-it-body">
            <div class="notif-it-title">${escapeHtml(n.title)}</div>
            <div class="notif-it-text">${escapeHtml(n.body)}</div>
            <div class="notif-it-meta"><span>${escapeHtml(n.phase||'')}</span><span>· ${rel}</span></div>
          </div>
          ${!n.read?'<span class="notif-it-dot"></span>':''}
        </div>`;
      }).join('') : '<div class="notif-empty"><div class="notif-empty-ico">🔕</div><div class="notif-empty-t">Tout est calme</div><div class="notif-empty-sub">Les notifications de gouvernance et de cycle apparaîtront ici.</div></div>'}
    </div>
  `;
}
function _notifRelTime(d){
  const ms = Date.now() - d.getTime();
  const s = Math.floor(ms/1000);
  if(s<60) return 'à l\'instant';
  const m = Math.floor(s/60);
  if(m<60) return `il y a ${m} min`;
  const h = Math.floor(m/60);
  if(h<24) return `il y a ${h} h`;
  const days = Math.floor(h/24);
  if(days<7) return `il y a ${days} j`;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
}

/* notifInit : charge l'inbox + brancher click outside.
 * #9 : guard mounted pour éviter d'accumuler des listeners si re-appelé. */
function notifInit(){
  if(_notifMounted){
    // Re-init : juste refresh, le listener existe déjà
    _loadInbox(); _refreshBell();
    return;
  }
  _notifMounted = true;
  _loadInbox();
  _refreshBell();
  // v0.23.2 : sync from server backend (async, silent fail si offline).
  // L'inbox local s'affiche immédiatement (paint rapide), le serveur
  // overrides quand il répond (à 200ms après init).
  if(typeof _notifSyncFromServer === 'function') _notifSyncFromServer();
  _notifClickHandler = (e) => {
    const p = document.getElementById('notifPanel');
    const bell = document.getElementById('notifBell');
    if(!p || !p.classList.contains('on')) return;
    if(!p.contains(e.target) && !bell.contains(e.target)){
      p.classList.remove('on');
      if(bell) bell.setAttribute('aria-expanded','false');
    }
  };
  document.addEventListener('click', _notifClickHandler);
}

      { selector: '#sc-admin .ref-grid, #sc-admin .ref-card, #sc-admin .ax-users, #sc-admin .row-2c', view:'admin', placement: 'top', titleK: 'tour.v.adm.t2', bodyK: 'tour.v.adm.b2' },

  return {

      renderChecklistPanel();
      if (PREFS.coach.enabled && !PREFS.coach.tourSeen.welcome && !PREFS.coach.dismissedTour) {

    },
    isOn() { return PREFS.coach && PREFS.coach.enabled; },
    visit(viewId) { _visited.add(viewId); _persistFlags(); renderChecklistPanel(); },
    flag(key) { _flags.add(key); _persistFlags(); renderChecklistPanel(); },
    // applyHint(viewId) : appelée à chaque goView(). Auto-déclenche le mini-tour
    // de la vue si l'utilisateur ne l'a pas encore vu, et qu'aucun autre tour
    // n'est en cours. Le welcome a priorité tant qu'il n'est pas terminé.
    applyHint(viewId) {
      this.visit(viewId);
      renderTopbarToggle();  // refresh « Tour de cette page · <nom> » dans le menu
      if (!this.isOn()) return;
      // Pas de mini-tour si le welcome est en cours / pas encore terminé
      if (_tourState) return;
      if (!PREFS.coach.tourSeen.welcome && !PREFS.coach.dismissedTour) return;
      // Cooldown : si l'utilisateur vient de skipper un tour il y a <30s, on attend
      if (PREFS.coach.lastSkipAt && (Date.now() - PREFS.coach.lastSkipAt) < 30000) return;
      // Lance le mini-tour de la vue s'il existe et n'a pas été vu
      if (TOURS[viewId] && viewId !== 'welcome' && !PREFS.coach.tourSeen[viewId]) {
        setTimeout(() => {
          // Re-check au tir : vue toujours active, pas d'autre tour, coach toujours on
          if (_tourState || !COACH.isOn() || PREFS.view !== viewId) return;
          COACH.startTour(viewId);

      }
    },
    startTour(tourId) {

      _hideTour();
      _tourState = { tourId, idx: 0, steps };
      _showStep();
    },
    nextStep() {
      if (!_tourState) return;
      const cur = _tourState.steps[_tourState.idx];
      if (cur && cur.finish) { _finishTour(); return; }
      if (_tourState.idx >= _tourState.steps.length - 1) { _finishTour(); return; }
      _tourState.idx++;
      _showStep();
    },
    prevStep() {
      if (!_tourState || _tourState.idx === 0) return;
      _tourState.idx--;
      _showStep();
    },
    skipTour() {
      if (!_tourState) return;
      const id = _tourState.tourId;
      _hideTour();
      PREFS.coach.tourSeen[id] = true;
      PREFS.coach.lastSkipAt = Date.now();
      savePrefs();
      toast(tr('tour.skipped'), 'ok');
    },
    disable() {
      _hideTour();
      PREFS.coach.enabled = false;
      PREFS.coach.dismissedTour = true;
      savePrefs();
      renderTopbarToggle(); renderChecklistPanel();
      toast(tr('tour.disabled'), 'ok');
    },
    enable() {
      PREFS.coach.enabled = true;
      PREFS.coach.dismissedTour = false;
      savePrefs();
      renderTopbarToggle(); renderChecklistPanel();
      toast(tr('tour.enabled'), 'ok');
    },
    // Reset : tous les tours redeviennent inconnus → le tour de la vue courante

      const done = CHECKLIST.filter(t => { try { return t.check(); } catch(e) { return false; } }).length;
      return { done, total: CHECKLIST.length };
    },

  function _persistFlags() {
    try {
      localStorage.setItem('nplan_coach_flags', JSON.stringify({
        visited: [..._visited], flags: [..._flags]
      }));
    } catch(e){}
  }
  function _restoreFlags() {
    try {
      const v = JSON.parse(localStorage.getItem('nplan_coach_flags') || '{}');
      (v.visited||[]).forEach(x => _visited.add(x));
      (v.flags||[]).forEach(x => _flags.add(x));
    } catch(e){}
  }

  function _showStep() {
    if (!_tourState) return;
    const step = _tourState.steps[_tourState.idx];
    if (!step) { _finishTour(); return; }
    if (step.view && PREFS.view !== step.view) {
      goView(step.view);
      setTimeout(() => _renderStep(step), 380);
    } else {
      _renderStep(step);
    }
  }

  function _renderStep(step) {
    if (!_tourState) return;
    const target = step.selector ? _firstVisible(step.selector) : null;
    const placement = (target ? (step.placement || 'bottom') : 'center');
    _ensureOverlay();
    _positionSpotlight(target);
    _positionPopover(target, placement, step);
    if (_ro) { try { _ro.disconnect(); } catch(e){} _ro = null; }
    if (target && typeof ResizeObserver !== 'undefined') {
      _ro = new ResizeObserver(() => { _positionSpotlight(target); _positionPopover(target, placement, step); });
      try { _ro.observe(target); _ro.observe(document.body); } catch(e){}
    }
    if (target) {
      try { target.scrollIntoView({behavior:'smooth', block:'center', inline:'center'}); } catch(e){}
    }
  }

  function _firstVisible(selectorList) {
    const sels = String(selectorList).split(',').map(s=>s.trim()).filter(Boolean);
    for (const s of sels) {
      try {
        const els = document.querySelectorAll(s);
        for (const el of els) {
          if (el.offsetParent || el.getBoundingClientRect().width > 0) return el;
        }
      } catch(e){}
    }
    return null;
  }

  function _ensureOverlay() {
    let ov = document.getElementById('coachTourOverlay');
    if (ov) return ov;
    ov = document.createElement('div');
    ov.id = 'coachTourOverlay';
    ov.className = 'coach-tour-ov';
    ov.innerHTML = `
      <svg class="coach-tour-mask" aria-hidden="true">
        <defs>
          <mask id="coachSpotMask">
            <rect width="100%" height="100%" fill="white"/>
            <rect id="coachSpotHole" x="0" y="0" width="0" height="0" rx="12" ry="12" fill="black"/>
          </mask>
        </defs>
        <rect class="coach-tour-bg" width="100%" height="100%" mask="url(#coachSpotMask)"/>
      </svg>
      <div id="coachTourPop" class="coach-tour-pop" role="dialog" aria-modal="true" aria-labelledby="coachTourTitle"></div>
    `;
    document.body.appendChild(ov);
    requestAnimationFrame(()=>ov.classList.add('on'));
    document.addEventListener('keydown', _onKey, true);
    window.addEventListener('resize', _onResize);
    return ov;
  }

  function _onKey(e) {
    if (!_tourState) return;
    if (e.key === 'Escape') { e.preventDefault(); COACH.skipTour(); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); COACH.nextStep(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); COACH.prevStep(); }
  }
  function _onResize() {
    if (!_tourState) return;
    const step = _tourState.steps[_tourState.idx];
    const target = step.selector ? _firstVisible(step.selector) : null;
    const placement = target ? (step.placement || 'bottom') : 'center';
    _positionSpotlight(target);
    _positionPopover(target, placement, step);
  }

  function _positionSpotlight(target) {
    const hole = document.getElementById('coachSpotHole');
    if (!hole) return;
    if (!target) {
      hole.setAttribute('x', '0'); hole.setAttribute('y', '0');
      hole.setAttribute('width', '0'); hole.setAttribute('height', '0');
      return;
    }
    const r = target.getBoundingClientRect();
    const pad = 8;
    hole.setAttribute('x', Math.max(0, r.left - pad));
    hole.setAttribute('y', Math.max(0, r.top - pad));
    hole.setAttribute('width', r.width + pad*2);
    hole.setAttribute('height', r.height + pad*2);
    hole.setAttribute('rx', 12); hole.setAttribute('ry', 12);
  }

  function _positionPopover(target, placement, step) {
    const pop = document.getElementById('coachTourPop');
    if (!pop) return;
    const total = _tourState.steps.length;
    const idx = _tourState.idx;
    const isFirst = idx === 0;
    const isLast = !!step.finish || idx === total - 1;
    const title = tr(step.titleK);
    const body  = tr(step.bodyK);
    pop.innerHTML = `
      <div class="coach-tour-pop-h">
        <span class="coach-tour-eyebrow"><span class="coach-tour-dot"></span> ${tr('tour.eyebrow')}</span>
        <button class="coach-tour-x" type="button" onclick="COACH.skipTour()" aria-label="${tr('tour.skip')}">×</button>
      </div>
      <h3 id="coachTourTitle" class="coach-tour-title">${escapeHtml(title)}</h3>
      <p class="coach-tour-body">${escapeHtml(body)}</p>
      <div class="coach-tour-foot">
        <div class="coach-tour-prog">
          <div class="coach-tour-prog-bar"><div class="coach-tour-prog-fill" style="width:${Math.round((idx+1)/total*100)}%"></div></div>
          <span class="coach-tour-step">${idx+1} / ${total}</span>
        </div>
        <div class="coach-tour-actions">
          ${isFirst ? '' : `<button class="coach-tour-btn ghost" type="button" onclick="COACH.prevStep()">← ${tr('tour.prev')}</button>`}
          ${!isLast ? `<button class="coach-tour-btn ghost" type="button" onclick="COACH.skipTour()">${tr('tour.skip')}</button>` : ''}
          <button class="coach-tour-btn primary" type="button" onclick="COACH.nextStep()">
            ${isLast ? tr('tour.finish') + ' ✓' : tr('tour.next') + ' →'}
          </button>
        </div>
      </div>
      <span class="coach-tour-arrow coach-tour-arrow--${placement}"></span>
    `;
    const margin = 14;
    const popW = 380, popH = pop.offsetHeight || 240;
    let top, left;
    if (placement === 'center' || !target) {
      top = (window.innerHeight - popH) / 2;
      left = (window.innerWidth - popW) / 2;
      pop.classList.add('coach-tour-pop--center');
    } else {
      pop.classList.remove('coach-tour-pop--center');
      const r = target.getBoundingClientRect();
      switch (placement) {
        case 'top':    top = r.top - popH - margin;            left = r.left + r.width/2 - popW/2; break;
        case 'bottom': top = r.bottom + margin;                left = r.left + r.width/2 - popW/2; break;
        case 'left':   top = r.top + r.height/2 - popH/2;      left = r.left - popW - margin; break;
        case 'right':  top = r.top + r.height/2 - popH/2;      left = r.right + margin; break;
        default:       top = r.bottom + margin;                left = r.left + r.width/2 - popW/2;
      }
      const vw = window.innerWidth, vh = window.innerHeight;
      left = Math.max(12, Math.min(vw - popW - 12, left));
      top  = Math.max(12, Math.min(vh - popH - 12, top));
    }
    pop.style.top = top + 'px';
    pop.style.left = left + 'px';
    pop.style.width = popW + 'px';
    pop.setAttribute('data-placement', placement);
    pop.classList.remove('in');
    void pop.offsetWidth;
    requestAnimationFrame(()=>pop.classList.add('in'));
  }

  function _hideTour() {
    const ov = document.getElementById('coachTourOverlay');
    if (ov) {
      ov.classList.remove('on');
      setTimeout(()=>{ try { ov.remove(); } catch(e){} }, 260);
    }
    if (_ro) { try { _ro.disconnect(); } catch(e){} _ro = null; }
    document.removeEventListener('keydown', _onKey, true);
    window.removeEventListener('resize', _onResize);
    _tourState = null;
  }

  function _finishTour() {
    if (!_tourState) return;
    const id = _tourState.tourId;
    _hideTour();
    PREFS.coach.tourSeen[id] = true;
    savePrefs();
    toast(tr('tour.done'), 'ok');
    renderChecklistPanel();
  }

  function renderTopbarToggle() {
    const btn = document.getElementById('coachToggle');
    if (!btn) return;
    const on = COACH.isOn();
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? tr('tour.toggle.on.tt') : tr('tour.toggle.off.tt');
    // Met à jour le label « Tour de cette page · <nom> » dans le menu
    const cur = document.getElementById('coachMenuCurPage');
    if (cur) {
      const view = (PREFS && PREFS.view) || 'cockpit';
      const navItem = (typeof NAV !== 'undefined') ? NAV.find(n => n.id === view) : null;
      const lbl = navItem ? tr(navItem.lblK || navItem.crumbK || ('nav.'+view), view) : view;
      const seen = PREFS.coach && PREFS.coach.tourSeen && PREFS.coach.tourSeen[view];
      cur.textContent = lbl + (seen ? ' · ' + tr('tour.seen') : ' · ' + tr('tour.new'));
    }
  }
  function renderChecklistPanel() {
    const host = document.getElementById('coachChecklist');
    if (!host) return;
    if (!COACH.isOn()) { host.style.display = 'none'; return; }
    const p = COACH.progress();
    if (p.done >= p.total) { host.style.display = 'none'; return; }
    host.style.display = '';
    const pct = Math.round(p.done/p.total*100);
    host.innerHTML = `
      <button class="coach-cl-h" onclick="COACH.checklistOpen()" aria-expanded="${host.classList.contains('open')}">
        <span class="coach-cl-prog">
          <svg viewBox="0 0 36 36" aria-hidden="true">
            <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(124,252,154,.18)" stroke-width="3"/>
            <circle cx="18" cy="18" r="15" fill="none" stroke="#7cfc9a" stroke-width="3" stroke-dasharray="${pct*0.942} 100" stroke-dashoffset="0" transform="rotate(-90 18 18)" stroke-linecap="round"/>
          </svg>
          <span class="coach-cl-pct">${p.done}/${p.total}</span>
        </span>
        <span class="coach-cl-t">${tr('tour.cl.title')}</span>
        <svg class="coach-cl-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="coach-cl-list">
        <button class="coach-cl-replay" onclick="COACH.startTour('welcome')">▶ ${tr('tour.replay')}</button>
        ${CHECKLIST.map(t => { const d = (()=>{try{return t.check();}catch(e){return false;}})(); return `
          <div class="coach-cl-it ${d?'done':''}">
            <span class="coach-cl-cb" aria-hidden="true">${d ? '✓' : ''}</span>
            <span class="coach-cl-lbl">${escapeHtml(tr(t.lbl))}</span>
          </div>`; }).join('')}
      </div>
    `;
  }
})();

function ucById(id){ return DATA.find(u=>u.id===id); }
function statusOf(id){ return STATUSES.find(s=>s.id===id) || STATUSES[0]; }
function typeOf(id){ return TYPES.find(t=>t.id===id) || TYPES[0]; }
function prioOf(id){ return PRIORITIES.find(p=>p.id===id) || PRIORITIES[1]; }
function buOf(id){ return BUS.find(b=>b.id===id) || BUS[6]; }
function fmtMoney(n){ return '$'+(n||0).toLocaleString('en-US',{maximumFractionDigits:0}); }
function fmtDate(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'2-digit'}); }catch(e){ return s; } }
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}

/* =================================================================
 * v0.22 — UC schema enrichment (retours Halima)
 * 3 blocs structurels par UC :
 *   - Project Description (rationale projet, héritage du parent)
 *   - Business Case (P Market + Design & Hypothesis + Eco Impact)
 *   - Trial Description (objectifs, KPIs, MDS, protocole)
 * Accesseurs rétro-compatibles : si le bloc n'existe pas (UCs créés
 * avant v0.22), on le fabrique depuis les champs scalaires existants.
 * ================================================================= */
function ucProjectDescription(u){
  if(!u) return {};
  if(u.project_description && typeof u.project_description==='object') return u.project_description;
  const proj = u.project_id ? projById(u.project_id) : null;
  return {
    rationale: u.rationale || (proj ? (proj.description || '') : ''),
    parent_project: proj ? {id:proj.id, title:proj.title} : null,
    strategic_objectives: u.strategic_objectives || [],
    bu: u.bu, region: u.region,
  };
}
function ucBusinessCase(u){
  if(!u) return {};
  if(u.business_case && typeof u.business_case==='object') return u.business_case;
  // Fabrique un Business Case minimal depuis les champs existants
  return {
    p_market: { crop:u.crop, country:u.region, currentP2O5:'', potentialP2O5:'', competitors:[] },
    design: { nbTrials:1, hypothesis:u.objective_primary||'', expectedYield:'', treatments:u.treatments||0, replications:u.replications||0 },
    eco: { co2Reduction:'', adoption:'', revenue:'', notes:'' },
  };
}
function ucTrialDescription(u){
  if(!u) return {};
  if(u.trial_description && typeof u.trial_description==='object') return u.trial_description;
  return {
    name: u.name, objective_primary: u.objective_primary,
    objectives_secondary: u.objectives_secondary||[],
    kpis_primary: u.kpis_primary||[], kpis_secondary: u.kpis_secondary||[],
    mds_covered: u.mds_covered||[],
    treatments: u.treatments, replications: u.replications,
    start_date: u.start_date, end_date: u.end_date,
    partner: u.partner, sai_lead: u.sai_lead,
    protocol: u.protocol, attachments: u.attachments||[],
    risks: u.risks||[],
  };
}

/* govProjectAccordion(items, actionFn, opts?) — utilisé par Portfolio,
 * Steering, Monitoring : groupe les trials sous leur project parent
 * avec un accordion. actionFn(uc) → HTML inséré au pied de chaque
 * trial card (boutons décision, par exemple). opts.containerId pour
 * le wiring du click-to-toggle. */
function govProjectAccordion(items, actionFn, opts){
  opts = opts || {};
  if(!items || !items.length) return `<div class="empty" style="padding:48px 20px"><div class="big">📦</div>${tr('pf.kn.empty')}</div>`;
  const groups = {};
  items.forEach(u => {
    const pid = u.project_id || '__orphan__';
    if(!groups[pid]) groups[pid] = [];
    groups[pid].push(u);
  });
  const orderedIds = Object.keys(groups).sort((a,b) => {
    if(a==='__orphan__') return 1;
    if(b==='__orphan__') return -1;
    return a.localeCompare(b);
  });
  const html = `<div class="proj-acc">${orderedIds.map(pid => {
    const list = groups[pid];
    const proj = (pid==='__orphan__')
      ? {id:'—', title:tr('acc.orphan')||'Trials sans projet rattaché', region:'—', entity:'—', status:'—'}
      : (projById(pid) || {id:pid, title:'Unknown', region:'—', entity:'—', status:'—'});
    const trials = list.filter(u => u.type !== 'demo').length;
    const demos = list.filter(u => u.type === 'demo').length;
    const totBudget = list.reduce((s,u)=>s+(u.budget||0),0);
    const opened = opts.openFirst && pid === orderedIds[0];
    return `
      <div class="proj-acc-card" data-pid="${escapeHtml(pid)}">
        <div class="proj-acc-h ${opened?'open':''}" data-pid="${escapeHtml(pid)}">
          <span class="proj-acc-chev" aria-hidden="true">▶</span>
          <div class="proj-acc-meta">
            <div class="proj-acc-id">${escapeHtml(proj.id)}</div>
            <div class="proj-acc-title">${escapeHtml(proj.title)}</div>
            <div class="proj-acc-tags">
              ${proj.region && proj.region!=='—' ? `<span class="badge bg-soft">${escapeHtml(proj.region)}</span>` : ''}
              ${proj.entity && proj.entity!=='—' ? `<span class="badge bg-soft">${escapeHtml(String(proj.entity).replace('BU-',''))}</span>` : ''}
              ${(proj.status||proj.project_status) && (proj.status||proj.project_status)!=='—' ? `<span class="badge bg-info">${escapeHtml(proj.status||proj.project_status)}</span>` : ''}
            </div>
          </div>
          <div class="proj-acc-cnt">
            <div class="cnt">${list.length}</div>
            <div class="cnt-lbl">${trials} ${tr('acc.trials')||'trials'} · ${demos} ${tr('acc.demos')||'demos'} · ${fmtMoney(totBudget)}</div>
          </div>
        </div>
        <div class="proj-acc-body ${opened?'open':''}" data-pid="${escapeHtml(pid)}">
          ${opts.distFn ? opts.distFn(list) : ''}
          <div class="proj-acc-grid">${list.map(u => {
            const st = statusOf(u.status), ty = typeOf(u.type), bu = buOf(u.bu);
            return `<div class="proj-acc-card-uc" onclick="if(!event.target.closest('.no-bubble'))openUc('${u.id}')">
              <div class="pauc-h">
                <span class="pauc-id">${u.id} · ${tyLbl(ty)}</span>
                ${u.fast_track?`<span class="pill" style="background:#fde7e7;color:#a01f1f">${tr('badge.ft')}</span>`:''}
              </div>
              <div class="pauc-title">${escapeHtml(u.name)}</div>
              <div class="pauc-meta"><span>📍 ${escapeHtml(u.region)} · ${escapeHtml(buOf(u.bu).nm)}</span><span>🌾 ${escapeHtml(u.crop)}</span></div>
              <div class="pauc-pills">
                <span class="pill ${st.pill}">${stLbl(st)}</span>
                <span class="pauc-budget">${fmtMoney(u.budget)}</span>
              </div>
              ${actionFn ? `<div class="pauc-action no-bubble" onclick="event.stopPropagation()">${actionFn(u)}</div>` : ''}
            </div>`;
          }).join('')}</div>
        </div>
      </div>`;
  }).join('')}</div>`;
  // Wire toggles après injection
  setTimeout(()=>{
    document.querySelectorAll('.proj-acc-h').forEach(h => {
      h.onclick = ()=>{
        const pid = h.dataset.pid;
        const body = h.parentElement.querySelector('.proj-acc-body');
        const isOpen = body.classList.contains('open');
        h.classList.toggle('open', !isOpen);
        body.classList.toggle('open', !isOpen);
      };
    });
  }, 20);
  return html;
}
// Review SAI #3 — vocabulaire de décision configurable (Admin > Gouvernance).
// govDecSegs(body) renvoie [{key,label,color}] depuis GOV.decisions (libellés
// admin) — clés structurelles fixes. La décision d'un trial est lue par body.
function govDecSegs(body){
  const cfg = (GOV && GOV.decisions && GOV.decisions[body]) || [];
  return cfg.map(s=>({ key:s.key, label:s.label||s.key, color:s.color||'#c2cdc6' }));
}
function govDecLabel(body, key){
  const s = govDecSegs(body).find(x=>x.key===key);
  return s ? s.label : key;
}
// Décision enregistrée pour ce trial par cette instance (clé ou null).
function govDecOf(u, body){
  if(body==='sai')        return (u._saiDecision && u._saiDecision.decision) || null;
  if(body==='steering')   return (u._steeringDecision && u._steeringDecision.decision) || null;
  if(body==='monitoring') return (u._monitoringDecision && u._monitoringDecision.decision) || null;
  return null;
}
// Population de référence pour la répartition : TOUS les trials du projet
// (pas seulement ceux encore dans le gate) — sinon les décisions « go/kill »
// quittent la file et la répartition afficherait toujours ~0 %.
function govDistPopulation(list){
  const pid = list && list[0] && list[0].project_id;
  if(pid && typeof trialsOfProject==='function'){
    const all = trialsOfProject(pid);
    if(all && all.length) return all;
  }
  return list || [];
}
// Répartition des décisions d'une instance par projet (en %).
function govDistFor(body, list){
  const pop = govDistPopulation(list);
  const segs = govDecSegs(body).concat([{ key:'pending', label:tr('gov.dist.pending','En attente'), color:'#c2cdc6' }]);
  const total = pop.length || 1;
  const counts = {}; segs.forEach(s=>counts[s.key]=0);
  pop.forEach(u=>{ const d = govDecOf(u, body) || 'pending'; counts[d] = (counts[d]||0) + 1; });
  const bar = segs.filter(s=>counts[s.key]>0).map(s=>
    `<span style="width:${Math.round(counts[s.key]/total*100)}%;background:${s.color}" title="${escapeHtml(s.label)}: ${counts[s.key]}/${total}"></span>`
  ).join('') || '<span style="width:100%;background:#e7eee9"></span>';
  const legend = segs.map(s=>{
    const pct = Math.round((counts[s.key]||0)/total*100);
    return `<span class="gov-dist-lg"><i style="background:${s.color}"></i>${escapeHtml(s.label)} <b>${pct}%</b></span>`;
  }).join('');
  return `<div class="gov-dist"><div class="gov-dist-bar">${bar}</div><div class="gov-dist-legend">${legend}</div></div>`;
}
function govSteerDistFn(list){ return govDistFor('steering', list); }
function govSaiDistFn(list){   return govDistFor('sai', list); }
function govMonDistFn(list){   return govDistFor('monitoring', list); }
// Sélecteur de décision dérivé de GOV.decisions (libellés admin) — un seul
// rendu pour les 3 instances. rbacCls/onchangeFn pilotent permission & action.
function govDecSelect(body, uc, onchangeFn, rbacCls, chooseLbl){
  const cur = govDecOf(uc, body);
  const opts = govDecSegs(body).map(s=>
    `<option value="${s.key}" ${cur===s.key?'selected':''}>${escapeHtml(s.label)}</option>`
  ).join('');
  return `<select class="gov-acc-dec ${rbacCls}" data-id="${uc.id}" onchange="${onchangeFn}('${uc.id}', this.value)">
    <option value="">— ${chooseLbl} —</option>${opts}
  </select>`;
}
// Commentaire de comité par body (sai/steering/monitoring), persisté sur le UC.
// Persistance « silencieuse » : on évite saveData()→dataChanged()→renderGovernance()
// qui réinitialiserait l'accordéon et la saisie en cours pendant la frappe.
function govSetComment(ucId, body, text){
  const u = ucById(ucId); if(!u) return;
  u._gov = u._gov || {}; u._gov[body] = u._gov[body] || {};
  u._gov[body].comment = text;
  try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){}
  if(typeof apiPush==='function') apiPush('usecases', DATA);
}
// Champ commentaire de comité (membre enregistre son commentaire sur le trial).
function govCommentInput(u, body){
  const val = (u._gov && u._gov[body] && u._gov[body].comment) || '';
  return `<textarea class="gov-acc-comment" rows="2" placeholder="${tr('gov.comment.ph','Commentaire du comité…')}" onchange="govSetComment('${u.id}','${body}',this.value)">${escapeHtml(val)}</textarea>`;
}
// Décision SAI Review (revu / à retravailler). Stockée en _saiDecision (cohérent
// avec _steeringDecision/_monitoringDecision) + notification comme ses pairs.
function govSetSaiDecision(ucId, val){
  if(typeof _rbacGuard==='function' && !_rbacGuard('do-sai-review')) return;
  const u = ucById(ucId); if(!u || !val) return;
  u._saiDecision = { decision: val, at: new Date().toISOString() };
  if(val==='reviewed') u.status = 'steering'; // SAI Review OK → passe au Steering
  if(typeof saveData==='function') saveData();
  toast(u.id+' : SAI '+govDecLabel('sai', val), 'ok');
  if(val==='reviewed' && typeof notify==='function') notify('sai.reviewed', {uc:u, decision:val});
}
function toast(m, kind){
  const t=document.getElementById('toast');
  t.textContent=m;
  t.className='toast show' + (kind?(' toast-'+kind):'');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2800);
}

/* =================================================================
 * UI · système de modale premium (remplace prompt/alert/confirm
 * natifs — Double-Bezel, spring physics, focus trap, ESC/Enter).
 * ================================================================= */
const UI = (()=>{
  let _open = null;
  function close(val){
    if(!_open) return;
    const {wrap, resolve} = _open;
    wrap.classList.add('ui-out');
    setTimeout(()=>{ wrap.remove(); document.removeEventListener('keydown', _open.kh, true); _open=null; resolve(val); }, 220);
  }
  function build(opts){
    if(_open) close(null);
    return new Promise(resolve=>{
      const wrap = document.createElement('div');
      wrap.className = 'ui-wrap';
      const danger = opts.danger ? ' ui-modal--danger' : '';
      const fieldsHtml = (opts.fields||[]).map((f,i)=>{
        const id='ui_f_'+i;
        const required = f.required ? ' required' : '';
        const auto = i===0 ? ' autofocus' : '';
        if(f.type==='select'){
          return `<label class="ui-fld"><span class="ui-lbl">${escapeHtml(f.label)}${f.required?' <em>*</em>':''}</span>
            <select id="${id}" data-name="${escapeHtml(f.name||id)}"${required}>
              ${(f.options||[]).map(o=>`<option value="${escapeHtml(o[0])}"${o[0]==f.value?' selected':''}>${escapeHtml(o[1])}</option>`).join('')}
            </select></label>`;
        }
        if(f.type==='textarea'){
          return `<label class="ui-fld"><span class="ui-lbl">${escapeHtml(f.label)}${f.required?' <em>*</em>':''}</span>
            <textarea id="${id}" data-name="${escapeHtml(f.name||id)}" rows="${f.rows||3}" placeholder="${escapeHtml(f.placeholder||'')}"${required}${auto}>${escapeHtml(f.value||'')}</textarea>
            ${f.hint?`<span class="ui-hint">${escapeHtml(f.hint)}</span>`:''}</label>`;
        }
        return `<label class="ui-fld"><span class="ui-lbl">${escapeHtml(f.label)}${f.required?' <em>*</em>':''}</span>
          <input id="${id}" data-name="${escapeHtml(f.name||id)}" type="${f.type||'text'}" placeholder="${escapeHtml(f.placeholder||'')}" value="${escapeHtml(f.value||'')}"${required}${auto}>
          ${f.hint?`<span class="ui-hint">${escapeHtml(f.hint)}</span>`:''}</label>`;
      }).join('');
      wrap.innerHTML = `<div class="ui-back"></div>
        <div class="ui-shell" role="dialog" aria-modal="true">
          <div class="ui-modal${danger}">
            ${opts.eyebrow?`<div class="ui-eye">${escapeHtml(opts.eyebrow)}</div>`:''}
            <h3 class="ui-title">${escapeHtml(opts.title||'')}</h3>
            ${opts.body?`<p class="ui-body">${opts.body}</p>`:''}
            ${fieldsHtml?`<form class="ui-form" onsubmit="return false">${fieldsHtml}</form>`:''}
            <div class="ui-act">
              ${opts.cancel===false?'':`<button type="button" class="ui-btn ui-btn--ghost" data-act="cancel">${escapeHtml(opts.cancel||'Annuler')}</button>`}
              <button type="button" class="ui-btn ui-btn--primary" data-act="ok">
                <span>${escapeHtml(opts.ok||'OK')}</span>
                <span class="ui-btn-arrow" aria-hidden="true">→</span>
              </button>
            </div>
          </div>
        </div>`;
      document.body.appendChild(wrap);
      // Spring entrance via class added on next frame
      requestAnimationFrame(()=>wrap.classList.add('ui-in'));
      const kh = (e)=>{
        if(e.key==='Escape'){ e.preventDefault(); _open.resolve=resolve; close(null); }
        else if(e.key==='Enter' && (e.target.tagName!=='TEXTAREA')){ e.preventDefault(); doOk(); }
      };
      _open = { wrap, resolve, kh };
      document.addEventListener('keydown', kh, true);
      wrap.querySelector('.ui-back').addEventListener('click', ()=>close(null));
      wrap.querySelector('[data-act=cancel]')?.addEventListener('click', ()=>close(null));
      function doOk(){
        if(opts.fields){
          const values = {};
          let firstInvalid=null;
          wrap.querySelectorAll('[data-name]').forEach(el=>{
            const v = (el.value||'').trim();
            values[el.dataset.name]=v;
            if(el.required && !v && !firstInvalid){ firstInvalid=el; }
          });
          if(firstInvalid){
            firstInvalid.classList.add('ui-err');
            firstInvalid.focus();
            setTimeout(()=>firstInvalid.classList.remove('ui-err'), 800);
            return;
          }
          close(values);
        } else {
          close(true);
        }
      }
      wrap.querySelector('[data-act=ok]').addEventListener('click', doOk);
      // Focus first input
      setTimeout(()=>{
        const fst = wrap.querySelector('input,select,textarea');
        if(fst) fst.focus();
      }, 80);
    });
  }
  return {
    prompt: (opts)=>build({ok:'Valider', ...opts}),
    confirm: (opts)=>build({cancel:'Annuler', ok:'Confirmer', ...opts}),
    alert:   (opts)=>build({cancel:false, ok:'OK', ...(typeof opts==='string'?{title:opts}:opts)})
  };
})();

function renderSidebar(){
  const host = document.getElementById('sbNav');
  const inSteering = DATA.filter(u=>u.status==='steering').length;
  const draft      = DATA.filter(u=>u.status==='draft').length;
  const fastTrack  = DATA.filter(u=>u.fast_track && u.status!=='closed-go' && u.status!=='closed-kill' && u.status!=='closed-hold').length;
  const closed     = DATA.filter(u=>/^closed-/.test(u.status)).length;
  const badges = { portfolio: DATA.length, intake: draft||null, fasttrack: fastTrack||null, kb: closed||null, governance: inSteering||null };
  host.innerHTML = NAV.map(it => {
    if(it.sec) return `<div class="sb-section">${tr(it.sec)}</div>`;
    const bd = badges[it.id];
    const bdCls = it.id==='governance' && bd ? 'warn' : '';
    // v0.22.2 — RBAC : ajout classes selon nature de l'item nav
    const rbacCls = it.id === 'admin' ? ' rbac-admin-only' : '';
    return `<button class="sb-item ${PREFS.view===it.id?'on':''}${rbacCls}" data-v="${it.id}" onclick="goView('${it.id}')"><svg class="ico" aria-hidden="true" focusable="false" width="18" height="18"><use href="#${it.svg}"/></svg><span class="lbl">${tr(it.lblK)}</span>${bd?`<span class="badge ${bdCls}">${bd}</span>`:''}</button>`;
  }).join('');
  const sf = document.getElementById('sbFoot');
  if(sf) sf.innerHTML = `<b style="color:#fff;margin:0 4px">${tr('cycle')} 2026</b> · ${tr('side.foot')}`;
  const sbTag = document.getElementById('sbBrandTag'); if(sbTag) sbTag.textContent = tr('side.tag');
}
function goView(id){
  PREFS.view = id; savePrefs();
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('sc-'+id).classList.add('on');
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.toggle('on', b.dataset.v===id));
  const nav = NAV.find(n=>n.id===id);
  document.getElementById('crumbs').innerHTML = `<span>NutriPlan</span><span class="sep">/</span><b>${nav?tr(nav.crumbK):id}</b>`;
  if(id==='cockpit')    renderCockpit();
  if(id==='dashboards') renderDashboards();
  if(id==='projects')   renderProjects();
  if(id==='portfolio')  renderPortfolio();
  if(id==='intake')     renderIntake();
  if(id==='calendar')   renderCalendar();
  if(id==='governance') renderGovernance();
  if(id==='ceo')        renderCEO();
  if(id==='controls')   renderControls();
  if(id==='fasttrack')  renderFastTrack();
  if(id==='kb')         renderKB();
  if(id==='admin')      renderAdmin();
  // v0.19 : inject sub-tabs contextuels en haut des écrans groupés
  injectCxTab(id);
  // v0.21 : coach contextuel (1 hint par écran selon règles)
  if (typeof COACH !== 'undefined') COACH.applyHint(id);
  document.getElementById('main').scrollTo({top:0,behavior:'instant'});
}

// Q3 — KPI cliquable qui FILTRE le portefeuille (pas juste l'ouvrir brut).
// IMPORTANT : on atterrit en vue TABLE, pas Kanban. Un drill-down peut cibler
// un statut tardif (closed-go, execution, monitoring) qui vit dans les colonnes
// Kanban 5-6 (hors écran) → l'utilisateur voyait 4 colonnes vides alors que le
// filtre comptait bien des résultats. La table montre la liste filtrée à plat,
// tout de suite visible, sans scroll horizontal ni colonnes vides.
function kpiGo(filt, view){
  PREFS.filters = filt || {};
  PREFS.portfolioView = view || 'table';
  savePrefs();
  goView('portfolio');
}
function kpiTile(ico,k,v,d,pct,filt){
  // Filter présent → cliquable + drill-down ; sinon, info pure non-cliquable.
  const clickable = filt && Object.keys(filt).length>0;
  const handler = clickable ? ` onclick='kpiGo(${JSON.stringify(filt)})' title="${tr('dash.drill.tip')||'Voir le portefeuille filtré'}"` : ' style="cursor:default"';
  return `<div class="kpi${clickable?'':' kpi--static'}"${handler}>
    <div class="k"><span class="ico">${ico}</span>${escapeHtml(k)}</div>
    <div class="v">${v}<small>${tr('ck.k.unit')}</small></div>
    <div class="d flat">${escapeHtml(d)}</div>
    <div class="bar"><i style="width:${pct||0}%"></i></div>
  </div>`;
}
function kpiOfficial(ico,k,v,d,pct,target,lowerIsBetter,filt){
  // KPI tile aligned with the validated framework's 4 official process KPIs (§8).
  const ok = lowerIsBetter ? (pct<=target) : (pct>=target);
  const cls = ok ? '' : 'kpi-bad';
  const clickable = filt && Object.keys(filt).length>0;
  const handler = clickable ? ` onclick='kpiGo(${JSON.stringify(filt)})' title="${escapeHtml(d)} — ${tr('dash.drill.tip')||'cliquer pour filtrer'}"` : ` style="cursor:default" title="${escapeHtml(d)}"`;
  return `<div class="kpi ${cls}${clickable?'':' kpi--static'}"${handler}>
    <div class="k"><span class="ico">${ico}</span>${escapeHtml(k)}</div>
    <div class="v">${v}</div>
    <div class="d ${ok?'up':'down'}">${ok?'✓':'⚠'} ${escapeHtml(d)}</div>
    <div class="bar"><i style="width:${Math.min(100,pct||0)}%;background:${ok?'linear-gradient(90deg,var(--green-500),var(--green-700))':'linear-gradient(90deg,#f0c9c9,var(--bad))'}"></i></div>
  </div>`;
}
function pctFastTrack(){
  const total = DATA.length || 1;
  return DATA.filter(u=>u.fast_track).length / total * 100;
}
function pctTransform(){
  const closed = DATA.filter(u=>/^closed-/.test(u.status));
  if(!closed.length) return 0;
  return closed.filter(u=>u.status==='closed-go').length / closed.length * 100;
}
function pctOnTime(){
  // Synthetic: trials whose end_date is within the current year and aren't kill'd are "on time"
  const closed = DATA.filter(u=>/^closed-/.test(u.status));
  if(!closed.length) return 0;
  return closed.filter(u=>u.status!=='closed-kill').length / closed.length * 100;
}
function budgetVariance(){
  // Synthetic budget variance: deterministic spread around the planned budget.
  let p=0, a=0;
  DATA.forEach((u,i)=>{ p += u.budget; a += u.budget * (1 + ((i%9)-4)*0.012); });
  return p ? ((a-p)/p)*100 : 0;
}

function buildAlerts(){
  const out = [];
  const lateGates = DATA.filter(u=>u.status==='steering').slice(0,3);
  lateGates.forEach(u=>{
    out.push({ kind:'warn', ico:'⏳',
      title: trf('ck.alert.late',{id:u.id}),
      ctx:   trf('ck.alert.late.ctx',{name:u.name, bu:buOf(u.bu).nm}),
      cta:   tr('ck.alert.late.cta'),
      action:`openUc('${u.id}')` });
  });
  const mds = DATA.filter(u=>u.mds_covered && u.mds_covered.length<11 && u.status!=='draft').slice(0,2);
  mds.forEach(u=>{
    const miss = MDS_ITEMS.filter(m=>!u.mds_covered.includes(m)).slice(0,2).join(' · ');
    out.push({ kind:'bad', ico:'⚠️',
      title: trf('ck.alert.mds',{id:u.id, n:u.mds_covered.length}),
      ctx:   trf('ck.alert.mds.ctx',{miss}),
      cta:   tr('ck.alert.mds.cta'),
      action:`openUc('${u.id}')` });
  });
  const ftPending = DATA.filter(u=>u.fast_track && u.status==='submitted').slice(0,1);
  ftPending.forEach(u=>{
    out.push({ kind:'warn', ico:'🚀',
      title: trf('ck.alert.ft',{id:u.id}),
      ctx:   trf('ck.alert.ft.ctx',{name:u.name}),
      cta:   tr('ck.alert.ft.cta'),
      action:`goView('fasttrack')` });
  });
  return out.slice(0,5);
}
function buildActivity(){
  return DATA.slice().sort((a,b)=>(b.last_update||'').localeCompare(a.last_update||''))
    .slice(0,8).map(u=>{
      const st = statusOf(u.status);
      const kind = u.status==='draft'?'':(u.status==='approved'||u.status.startsWith('closed-go')?'':(u.status==='closed-kill'?'bad':(u.status==='steering'||u.status==='ceo'?'warn':'info')));
      return { title:`${u.id} · ${stLbl(st)}`, when:fmtDate(u.last_update), ctx:u.name, kind };
    });
}
function renderHeatmap(){
  const cropsTop = CROPS.slice(0,7);
  const head = `<div class="heat-head"><div></div>${cropsTop.map(c=>`<div class="h-cell">${c}</div>`).join('')}</div>`;
  const rows = BUS.filter(b=>b.id!=='SAI').map(b=>{
    const cells = cropsTop.map(c=>{
      const n = DATA.filter(u=>u.bu===b.id && u.crop===c).length;
      const lvl = n===0?0:Math.min(5, n);
      const click = n>0 ? ` onclick="kpiGo({bu:'${b.id}',crop:'${escapeHtml(c)}'})" role="button" tabindex="0"` : '';
      const tip = n>0 ? `${b.nm} · ${c} · ${n} UCs · clic pour filtrer` : `${b.nm} · ${c} · aucun trial`;
      return `<div class="h-cell h-${lvl}${n>0?' h-click':''}" title="${escapeHtml(tip)}"${click}>${n||''}</div>`;
    }).join('');
    return `<div class="heat-row"><div class="h-lbl"><span class="av ${b.color}" style="margin-right:6px">${b.id}</span>${escapeHtml(b.nm)}</div>${cells}</div>`;
  }).join('');
  return `<div class="heat">${head}${rows}</div>`;
}

function dashAgg(keyFn, valFn){
  const m = {};
  DATA.forEach(u=>{ const k=keyFn(u); if(k==null) return; m[k]=(m[k]||0)+(valFn?valFn(u):1); });
  const total = Object.values(m).reduce((s,v)=>s+v,0)||1;
  return Object.entries(m).map(([label,value])=>({label,value,pct:Math.round(value/total*100)})).sort((a,b)=>b.value-a.value);
}
// Donut SVG (anneau) — segments depuis [{label,value,pct}].
// Drill-down helper for dashboard donuts/map → portfolio filtered
function dashDrill(filt, hint){
  if(!filt) return;
  PREFS.filters = filt;
  savePrefs();
  toast(tr('dash.drill.toast')+' '+(hint||''), 'ok');
  goView('portfolio');
}
function donutSVG(data, opts, onFilter){
  opts=opts||{}; const size=opts.size||200, sw=opts.stroke||30, r=(size-sw)/2, cx=size/2, cy=size/2;
  const C=2*Math.PI*r; let off=0; const total=data.reduce((s,d)=>s+d.value,0)||1;
  const segs = data.map((d,i)=>{
    const frac=d.value/total, len=frac*C;
    const col=DASH_PALETTE[i%DASH_PALETTE.length];
    const filt = onFilter ? onFilter(d, i) : null;
    const click = filt ? ` style="cursor:pointer" onclick='dashDrill(${JSON.stringify(filt)}, ${JSON.stringify(d.label)})' class="donut-seg"` : '';
    const el=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"${click}><title>${escapeHtml(d.label)} : ${d.pct}% — ${tr('dash.drill.tip')}</title></circle>`;
    let lbl='';
    if(frac>0.04){
      const mid=(off+len/2)/C*2*Math.PI - Math.PI/2;
      const lr=r; const lx=cx+lr*Math.cos(mid), ly=cy+lr*Math.sin(mid);
      lbl=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="${i<4?'#fff':'#1a1a1a'}" pointer-events="none">${d.pct}%</text>`;
    }
    off+=len;
    return el+lbl;
  }).join('');
  const legend = data.map((d,i)=>{
    const filt = onFilter ? onFilter(d, i) : null;
    const click = filt ? ` onclick='dashDrill(${JSON.stringify(filt)}, ${JSON.stringify(d.label)})' style="cursor:pointer"` : '';
    return `<span class="dl${filt?' dl-click':''}"${click}><i style="background:${DASH_PALETTE[i%DASH_PALETTE.length]}"></i>${escapeHtml(d.label)} <small>${d.pct}%</small></span>`;
  }).join('');
  return `<div class="donut-wrap"><svg viewBox="0 0 ${size} ${size}" class="donut">${segs}</svg><div class="donut-legend">${legend}</div></div>`;
}

// v0.22.1 — Geographic world map (countries SVG paths + region bubbles)
function drawWorldMap(){
  const svg = document.getElementById('wmapSvg');
  if(!svg) return;
  // Mapping BU code → region label de Halima
  const BU_TO_REGION = {NAM:'North America', BRA:'Brazil', SAI:'LATAM', EUR:'Europe', AFR:'Africa', IND:'India', APAC:'SEA'};
  // Stats par région (utilisant la labelisation Halima)
  const stats = {};
  Object.values(BU_TO_REGION).forEach(reg => { stats[reg] = {trials:0, demos:0, progress:0, _n:0}; });
  DATA.forEach(u => {
    const reg = BU_TO_REGION[u.bu];
    if(!reg) return;
    if(u.type==='demo') stats[reg].demos++; else stats[reg].trials++;
    stats[reg]._n++;
    stats[reg].progress += statusProgress(u.status);
  });
  Object.keys(stats).forEach(reg => {
    if(stats[reg]._n>0) stats[reg].progress = Math.round(stats[reg].progress / stats[reg]._n);
  });
  // Couleur shade par progress (4 niveaux)
  function progressColor(p){
    if(p >= 75) return '#0c3b2e';
    if(p >= 50) return '#5e9479';
    if(p >= 25) return '#a9c8b9';
    return '#e6efe9';
  }
  // Build SVG
  let s = '';
  WORLDMAP_DATA.countries.forEach(c => {
    const fill = c.region && stats[c.region] ? progressColor(stats[c.region].progress) : '#f1efe6';
    const tip = c.region && stats[c.region] ? c.name + ' — ' + c.region + ' : ' + stats[c.region].progress + '% overall' : c.name;
    s += '<path class="wmap-country" d="' + c.d + '" fill="' + fill + '"><title>' + tip + '</title></path>';
  });
  // Bubbles trials/demos par région
  Object.entries(REGION_COORDS).forEach(([reg, coord]) => {
    const st = stats[reg]; if(!st) return;
    const rt = 10 + Math.sqrt(Math.max(0, st.trials)) * 6.5;
    const rd = 10 + Math.sqrt(Math.max(0, st.demos)) * 6.5;
    s += '<text class="wmap-region-lbl" x="' + coord.x + '" y="' + (coord.y - 28) + '">' + reg + '</text>';
    if(st.trials > 0) {
      s += '<circle class="wmap-bubble-t" cx="' + (coord.x - 15) + '" cy="' + coord.y + '" r="' + rt + '" onclick="dashDrill({bu:\'' + (Object.keys(BU_TO_REGION).find(k=>BU_TO_REGION[k]===reg)) + '\'}, \'' + reg + '\')"><title>' + reg + ' — Trials : ' + st.trials + '</title></circle>';
      s += '<text class="wmap-bubble-lbl" x="' + (coord.x - 15) + '" y="' + (coord.y + 4) + '">' + st.trials + '</text>';
    }
    if(st.demos > 0) {
      s += '<circle class="wmap-bubble-d" cx="' + (coord.x + 15) + '" cy="' + coord.y + '" r="' + rd + '" onclick="dashDrill({bu:\'' + (Object.keys(BU_TO_REGION).find(k=>BU_TO_REGION[k]===reg)) + '\', type:\'demo\'}, \'' + reg + ' demos\')"><title>' + reg + ' — Demos : ' + st.demos + '</title></circle>';
      s += '<text class="wmap-bubble-lbl" x="' + (coord.x + 15) + '" y="' + (coord.y + 4) + '">' + st.demos + '</text>';
    }
    if(st._n > 0) {
      s += '<text class="wmap-progress" x="' + coord.x + '" y="' + (coord.y + Math.max(rt, rd) + 18) + '">' + st.progress + '% progress</text>';
    }
  });
  svg.innerHTML = s;
}

/* Export CSV des trials clôturés (B8 — KB / Closure). */
function exportClosedCsv(){
  const closed = DATA.filter(u=>/^closed-/.test(u.status));
  if(!closed.length){ toast(tr('kb.export.empty')||'—'); return; }
  const head=['id','name','status','bu','region','crop','product','partner','budget','project_id'];
  const rows=[head].concat(closed.map(u=>head.map(k=>u[k]==null?'':u[k])));
  const csv='﻿'+rows.map(r=>r.map(c=>{c=String(c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nutriplan-closed-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

async function newProject(){
  const values = await UI.prompt({
    eyebrow: tr('prj.eye'),
    title: tr('prj.new'),
    body: tr('prj.new.body'),
    ok: tr('prj.create'),
    fields: [
      { name:'title',    label:tr('prj.f.title'),    required:true, placeholder:tr('prj.f.title.ph') },
      { name:'bu',       label:tr('prj.f.bu'),       type:'select', value:'SAI', options: BUS.map(b=>[b.id, b.id+' — '+b.nm]) },
      { name:'partner',  label:tr('prj.f.partner'),  placeholder:tr('prj.f.partner.ph') },
      { name:'crop',     label:tr('prj.f.crop'),     type:'select', value:CROPS[0], options: CROPS.map(c=>[c,c]) },
      { name:'budget',   label:tr('prj.f.budget'),   type:'number', placeholder:'0', hint:tr('prj.f.budget.hint') },
      { name:'description', label:tr('prj.f.desc'), type:'textarea', rows:3, placeholder:tr('prj.f.desc.ph') }
    ]
  });
  if(!values) return;
  const buCode = BUS.find(b=>b.id===values.bu) ? values.bu : 'SAI';
  const num = (PROJECTS.length+1).toString().padStart(3,'0');
  const p = {
    id:'PRJ-2026-'+num,
    title: values.title.trim(),
    entity: buCode, bu: buCode,
    country:'—', region:'—',
    crop: values.crop || CROPS[0],
    partner: (values.partner||'').trim() || '—',
    project_status:'New Project',
    contract_status:'Not started',
    strategic_line: STRATEGIC_LINES[0],
    project_response: PROJECT_RESPONSE[0],
    description: (values.description||'').trim(),
    lead:'SAI', owner: (apiCfg()&&apiCfg().user)||'SAI',
    start_date: new Date().toISOString().slice(0,10),
    end_date: null,
    duration_years: 1,
    budget: Number(values.budget)||0
  };
  PROJECTS.unshift(p);
  apiUpsert('projects', p);
  try{ localStorage.setItem(LS_PROJECTS, JSON.stringify(PROJECTS)); }catch(e){}
  renderSidebar();
  toast(tr('prj.created'), 'ok');
  // Ouverture directe de la fiche du projet créé (UX best-practice : pas de detour)
  openProjectDetail(p.id);
}

  if(f.q){       chips.push({key:'q', label:tr('pf.af.search'), val:'"'+f.q+'"', ico:'🔎'}); }

    chips.push({key:'partner_setup', label:tr('pf.af.ptype'), val:m[f.partner_setup]||f.partner_setup, ico:'🏛️'});
  }
  if(f.trial_kind){ chips.push({key:'trial_kind', label:tr('pf.af.kind'), val:f.trial_kind==='demo'?'démos':'trials', ico:'🔬'}); }
  if(f.installed){ chips.push({key:'installed', label:tr('pf.af.installed'), val:'oui', ico:'✅'}); }
  if(f.status_open){ chips.push({key:'status_open', label:tr('pf.af.open'), val:'oui', ico:'⏳'}); }
  if(f.ic_with_issues){ chips.push({key:'ic_with_issues', label:tr('pf.af.icissues'), val:'oui', ico:'🚨'}); }
  if(f.type){ const ty=TYPES.find(x=>x.id===f.type); if(ty) chips.push({key:'type', label:tr('pf.filt.type'), val:tyLbl(ty), ico:'🏷'}); }
  if(f.bu){ const b=BUS.find(x=>x.id===f.bu); if(b) chips.push({key:'bu', label:tr('pf.filt.bu'), val:b.nm, ico:'🏢'}); }
  if(f.status){ const st=STATUSES.find(x=>x.id===f.status); if(st) chips.push({key:'status', label:tr('pf.filt.status'), val:stLbl(st), ico:'🎯'}); }
  if(!chips.length) return '';

    <span class="af-lead">${tr('pf.af.lead')} <b>${total}</b> ${tr('pf.af.results')}</span>
    ${chips.map(c=>`<button class="af-chip" onclick="clearFilter('${c.key}')" title="${tr('pf.af.clear')}">

function chipFilter(label, key, options){
  const v = (PREFS.filters||{})[key];
  const cur = options.find(o=>o[0]===v);
  return `<div class="chip" onclick="cycleFilter('${key}', ${JSON.stringify(options.map(o=>o[0])).replace(/"/g,'&quot;')})">
    <span style="color:var(--muted)">${label}:</span> <b>${cur?escapeHtml(cur[1]):tr('pf.filt.all')}</b>
    ${v?'<span class="x" onclick="event.stopPropagation();clearFilter(\''+key+'\')">×</span>':''}
  </div>`;
}
function cycleFilter(key, options){
  const v = (PREFS.filters||{})[key];
  const idx = options.indexOf(v);
  const next = idx<options.length-1 ? options[idx+1] : null;
  PREFS.filters = PREFS.filters||{}; if(next) PREFS.filters[key]=next; else delete PREFS.filters[key];
  savePrefs(); renderPortfolio();
}
function clearFilter(key){ if(PREFS.filters) delete PREFS.filters[key]; savePrefs(); renderPortfolio(); }
function filteredUCs(){
  const f = PREFS.filters||{};
  const q = (f.q||'').toLowerCase().trim();
  return DATA.filter(u=>{
    if(f.type && u.type!==f.type) return false;
    if(f.bu && u.bu!==f.bu) return false;
    if(f.status && u.status!==f.status) return false;
    if(f.crop && u.crop!==f.crop) return false;
    if(f.project && u.project_id!==f.project) return false;
    if(f.partnerq && !String(u.partner||'').toLowerCase().includes(f.partnerq.toLowerCase())) return false;
    if(f.fast_track && !u.fast_track) return false;
    if(f.partner_setup && u.partner_setup!==f.partner_setup) return false;
    if(f.trial_kind==='trial' && u.type==='demo') return false;
    if(f.trial_kind==='demo'  && u.type!=='demo') return false;
    if(f.installed && !['execution','monitoring','closed-go','closed-hold','closed-kill'].includes(u.status)) return false;
    if(f.status_open && /^closed-/.test(u.status)) return false;
    if(f.ic_with_issues && !(u.ic_issues && u.ic_issues.length>0)) return false;
    if(q){
      const hay = [u.id,u.name,u.partner,u.crop,u.product,u.region,buOf(u.bu).nm].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderKanban(list){
  const cols = [
    { ids:['draft'],                                  lblK:'pf.kn.draft',     dot:'#5c6b62' },
    { ids:['submitted'],                              lblK:'pf.kn.submitted', dot:'#1f6c9c' },
    { ids:['steering','ceo'],                         lblK:'pf.kn.gates',     dot:'#7c5b07' },
    { ids:['approved'],                               lblK:'pf.kn.approved',  dot:'#15803D' },
    { ids:['execution','monitoring'],                 lblK:'pf.kn.inflight',  dot:'#2E7D32' },
    { ids:['closed-go','closed-hold','closed-kill'],  lblK:'pf.kn.closed',    dot:'#103d17' }
  ];
  // Quand un filtre est actif, on masque les colonnes vides : sinon l'utilisateur
  // voit un mur de colonnes "vide" alors que ses résultats sont dans une colonne
  // plus loin (hors écran). Sans filtre, on garde les 6 colonnes (vue pipeline).
  const filtered = Object.keys(PREFS.filters||{}).length > 0;
  let shown = cols.map(c=>({ ...c, items: list.filter(u=>c.ids.includes(u.status)) }));
  if(filtered) shown = shown.filter(c=>c.items.length>0);
  if(!shown.length){
    return `<div class="empty" style="padding:48px 20px"><div class="big">${tr('pf.kn.empty.dot')}</div>${tr('pf.kn.empty')}</div>`;
  }
  return `<div class="kanban">${shown.map(c=>{
    return `<div class="kn-col">
      <div class="kn-col-h"><span class="dot" style="background:${c.dot}"></span><span class="nm">${tr(c.lblK)}</span><span class="cnt">${c.items.length}</span></div>
      <div class="kn-list">${c.items.map(kanbanCard).join('') || `<div class="empty" style="padding:14px 6px"><div class="big">${tr('pf.kn.empty.dot')}</div>${tr('pf.kn.empty')}</div>`}</div>
    </div>`;
  }).join('')}</div>`;
}
// Review SAI #1 — phase de gate (1 SAI · 2 Steering · 3 CEO · 4 Exécution ·
// 5 Monitoring) déduite du statut NutriPlan, pour le mini-tracker de la carte.
function npGatePhase(status){
  switch(status){
    case 'draft': case 'submitted': return 1;
    case 'steering': return 2;
    case 'ceo': return 3;
    case 'approved': case 'execution': return 4;
    case 'monitoring': return 5;
    case 'closed-go': case 'closed-hold': case 'closed-kill': return 6;
    default: return 1;
  }
}
function npMiniTracker(u){
  const phase = npGatePhase(u.status);
  const steps = [[1,tr('track.sai','SAI')],[2,tr('track.steering','Steering')],[3,tr('track.ceo','CEO')],[4,tr('track.exec','Exec')],[5,tr('track.monitor','Monitor')]];
  const chk = '<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.6" width="9" height="9"><path d="M3 8l3 3 7-6"/></svg>';
  return `<div class="sai-track" aria-hidden="true">${steps.map((s,idx)=>{
    const done = s[0] < phase, curr = s[0] === phase;
    const nodeStyle = done
      ? 'background:var(--green-600);border:2px solid var(--green-600)'
      : curr
        ? 'background:#fff;border:2px solid #c8961f;color:#c8961f'
        : 'background:#fff;border:2px solid #d9e3dc;color:#bcc8c0';
    const node = `<div class="node" style="${nodeStyle}">${done?chk:s[0]}</div>`;
    const lbl  = `<span class="lbl" style="color:${done?'var(--green-700)':curr?'#c8961f':'#bcc8c0'}">${s[1]}</span>`;
    const conn = idx<4 ? `<div class="conn" style="background:${done?'var(--green-300)':'#e7eee9'}"></div>` : '';
    return `<div class="seg">${node}${lbl}</div>${conn}`;
  }).join('')}</div>`;
}
