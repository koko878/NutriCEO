<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPlan — Trial Management · OCP Nutricrops · D²nAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#103d17;--green-800:#1B5E20;--green-700:#2E7D32;--green-600:#2f8a39;--green-500:#4CAF50;
  --green-300:#66BB6A;--green-200:#A5D6A7;--green-100:#D6EADb;--green-50:#EAF4EC;
  --ink:#10231a;--ink-2:#1f3a2a;--muted:#5c6b62;--muted-2:#8aa195;
  --line:#e3ebe5;--line-2:#cfdcd4;
  --bad:#B91C1C;--bad-bg:#fdeced;--ok:#15803D;--ok-bg:#dcfce7;--warn:#B45309;--warn-bg:#fef3c7;
  --info:#0e4f6e;--info-bg:#dff1fb;
  --soft:#f5f9f6;--bg-deep:#07140c;
  --shadow-sm:0 1px 2px rgba(16,35,26,.06);
  --shadow-md:0 6px 18px -6px rgba(16,35,26,.18);
  --shadow-lg:0 24px 60px -20px rgba(16,35,26,.30);
  --rad-sm:8px;--rad-md:12px;--rad-lg:16px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--soft);line-height:1.5;overflow:hidden}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--green-700);text-decoration:none}

/* ==========================================================================
 * APP SHELL — sidenav (left) + main + chat panel (right, slide-in)
 * ========================================================================== */
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;height:100vh;
     grid-template-areas:'sidebar topbar' 'sidebar main'}
.app.chat-open{grid-template-columns:240px 1fr 420px;
     grid-template-areas:'sidebar topbar chat' 'sidebar main chat'}
@media(max-width:980px){.app,.app.chat-open{grid-template-columns:56px 1fr;grid-template-areas:'sidebar topbar' 'sidebar main'}
  .app.chat-open .chat{position:fixed;top:56px;right:0;bottom:0;width:min(420px,90vw);z-index:80;box-shadow:var(--shadow-lg)}}

/* ----- sidenav ----- */
.sidebar{grid-area:sidebar;background:linear-gradient(180deg,#0a1812 0%,#07140c 100%);color:#dff0e3;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)}
.sb-brand{padding:14px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-brand .by{font:600 9px 'Inter';letter-spacing:.14em;text-transform:uppercase;color:#8fae97;margin-bottom:4px}
.sb-brand .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:.01em;display:flex;align-items:baseline;gap:6px}
.sb-brand .nm b{color:var(--green-300);font-weight:700}
.sb-brand .tag{font:600 10px 'Inter';color:#7cfc9a;background:rgba(124,252,154,.13);padding:2px 7px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;display:inline-block}
.sb-nav{flex:1;overflow-y:auto;padding:14px 8px}
.sb-section{font:700 10px 'Inter';color:#5d7a68;letter-spacing:.12em;text-transform:uppercase;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;color:#bcd4c2;font:600 13px 'Inter';margin-bottom:2px;transition:background .15s,color .15s;text-align:left}
.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-item.on{background:rgba(124,252,154,.13);color:#fff}
.sb-item .ico{font-size:16px;width:20px;text-align:center;flex-shrink:0;line-height:1}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .badge{font:800 9.5px 'Inter';background:rgba(124,252,154,.18);color:#7cfc9a;padding:1px 6px;border-radius:999px}
.sb-item .badge.warn{background:rgba(255,193,7,.18);color:#FFCC55}
.sb-item .badge.bad{background:rgba(255,82,82,.18);color:#ff8a8a}
.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);font:500 11.5px 'Inter';color:#7c9c87;display:flex;align-items:center;gap:8px}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:#7cfc9a;box-shadow:0 0 0 0 rgba(124,252,154,.7);animation:pulseDot 1.8s ease-out infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(124,252,154,.7)}80%,100%{box-shadow:0 0 0 7px rgba(124,252,154,0)}}
@media(max-width:980px){.sb-brand,.sb-section,.sb-foot,.sb-item .lbl,.sb-item .badge{display:none}.sb-nav{padding:10px 4px}.sb-item{justify-content:center;padding:10px 0}.sidebar{padding-top:8px}}

/* ----- topbar ----- */
.topbar{grid-area:topbar;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:5}
.tb-crumbs{display:flex;align-items:center;gap:6px;font:600 13px 'Inter';color:var(--muted)}
.tb-crumbs b{color:var(--ink);font-weight:700}
.tb-crumbs span.sep{color:var(--line-2)}
.tb-sp{flex:1}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:280px;max-width:35vw;transition:border-color .15s,background .15s}
.tb-search:focus-within{border-color:var(--green-500);background:#fff}
.tb-search input{flex:1;border:0;outline:0;background:none;font:500 13px 'Inter'}
.tb-search .kbd{font:700 10.5px 'Inter';color:var(--muted);background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.tb-btn{display:inline-flex;align-items:center;gap:7px;font:700 12.5px 'Inter';padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:background .15s,border-color .15s}
.tb-btn:hover{background:var(--soft);border-color:var(--line-2)}
.tb-btn.primary{background:var(--green-700);color:#fff;border-color:var(--green-700)}
.tb-btn.primary:hover{background:var(--green-800)}
.tb-btn.ai{background:linear-gradient(135deg,#0a1812,#0c1f14);color:#7cfc9a;border-color:rgba(124,252,154,.32)}
.tb-btn.ai:hover{background:linear-gradient(135deg,#0c1f14,#103d17);color:#fff}
.tb-btn.ai .dot{width:6px;height:6px;border-radius:50%;background:#7cfc9a;box-shadow:0 0 0 0 rgba(124,252,154,.7);animation:pulseDot 1.6s ease-out infinite}
.tb-prof{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 10px}
.tb-prof .av{width:26px;height:26px;border-radius:50%;background:var(--green-700);color:#fff;display:grid;place-items:center;font:800 11px 'Inter'}
.tb-prof .nm{font:700 12px 'Inter';color:var(--ink)}
.tb-prof .ro{font:500 10.5px 'Inter';color:var(--muted)}
.tb-lang{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px}
.tb-lang button{border:0;background:none;font-size:16px;line-height:1;padding:5px 7px;border-radius:6px;cursor:pointer;opacity:.55;transition:opacity .15s,background .15s}
.tb-lang button:hover{opacity:.85}
.tb-lang button.on{opacity:1;background:#fff;box-shadow:0 1px 2px rgba(16,35,26,.08)}
@media(max-width:780px){.tb-search{display:none}.tb-prof .nm,.tb-prof .ro{display:none}}

/* ----- main ----- */
.main{grid-area:main;overflow-y:auto;background:var(--soft);padding:24px 28px 60px}
@media(max-width:560px){.main{padding:18px 16px 40px}}
.screen{display:none;animation:fadeIn .25s ease}
.screen.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* eyebrow + page title */
.eyebrow{font:700 11px 'Inter';color:var(--green-700);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.h-pg{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--ink);margin:0 0 6px}
.lead{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:78ch}

/* ==========================================================================
 * KPI tiles (Stripe-style)
 * ========================================================================== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:16px 18px;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--green-200)}
.kpi .k{font:600 11px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi .k .ico{font-size:14px;opacity:.7}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--green-800);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font:700 11.5px 'Inter';margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .d.up{color:var(--ok)}
.kpi .d.down{color:var(--bad)}
.kpi .d.flat{color:var(--muted);font-weight:500}
.kpi .bar{margin-top:10px;height:4px;background:var(--soft);border-radius:999px;overflow:hidden}
.kpi .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green-500),var(--green-700));border-radius:999px;transition:width .55s ease}
.kpi.kpi-bad{border-color:#f0c9c9;background:linear-gradient(180deg,#fff,#fef6f6)}
.kpi.kpi-bad .v{color:#a01f1f}
.ic-chip{margin-top:6px;font:800 10.5px 'Inter';padding:2px 7px;border-radius:5px;display:inline-block}
.ic-chip.bad{background:var(--bad-bg);color:var(--bad)}
.ic-chip.ok{background:var(--ok-bg);color:var(--ok)}

/* ==========================================================================
 * Card / Panel
 * ========================================================================== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:18px 20px;margin-bottom:18px}
.card.flat{padding:0;overflow:hidden}
.card h3{margin:0 0 14px;font:700 16px 'Inter';color:var(--ink);display:flex;align-items:center;gap:8px}
.card h3 .sub{font:500 12px 'Inter';color:var(--muted);font-style:italic}
.card .card-act{margin-left:auto;display:flex;gap:6px;align-items:center}

.row-2c{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1100px){.row-2c{grid-template-columns:1fr}}

/* ==========================================================================
 * Tables (Airtable-style)
 * ========================================================================== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad-md);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:11px 12px;text-align:left;background:#fbfdfb;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafdfa}
.tbl tr.sel td{background:var(--green-50)}
.tbl .t-num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl .t-cell-prim{font-weight:700;color:var(--ink);max-width:340px}
.tbl .t-cell-prim .meta{font:500 11px 'Inter';color:var(--muted);margin-top:2px;font-weight:500}
.tbl .t-link{cursor:pointer}
.tbl .t-link:hover .t-cell-prim{color:var(--green-700)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:700 10.5px 'Inter';padding:3px 9px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill-st-draft{background:#eef0ef;color:#5c6b62}
.pill-st-submitted{background:#e0eef9;color:#1f6c9c}
.pill-st-steering{background:#fff1cd;color:#7c5b07}
.pill-st-ceo{background:#fde2c8;color:#8d4a04}
.pill-st-approved{background:#dcfce7;color:#15803D}
.pill-st-execution{background:#e7f0eb;color:var(--green-700)}
.pill-st-monitoring{background:#e0ecf6;color:#0e4f6e}
.pill-st-go{background:#c5f0d4;color:#0c5b27}
.pill-st-hold{background:#fde7c7;color:#8c5a06}
.pill-st-kill{background:#fde0e0;color:#8b1a1a}
.pill-typ-scientific{background:#ede5f8;color:#583c8d}
.pill-typ-applied{background:#e5f0fa;color:#1d5e94}
.pill-typ-demo{background:#dff5e7;color:#106a32}
.pill-prio-high{background:#fde2e2;color:#a01f1f}
.pill-prio-med{background:#fdf1c8;color:#7c5b07}
.pill-prio-low{background:#e7eef0;color:#37526a}

/* avatar */
.av{width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;display:inline-grid;place-items:center;font:800 10px 'Inter';margin-right:-6px;border:2px solid #fff;flex-shrink:0}
.av.alt-1{background:#7c5b07}.av.alt-2{background:#583c8d}.av.alt-3{background:#0e4f6e}.av.alt-4{background:#8d4a04}.av.alt-5{background:#a01f1f}.av.alt-6{background:#15803D}
.av-stack{display:inline-flex;align-items:center;padding-right:6px}

/* tabs (within a screen) */
.subnav{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.subnav button{font:700 12.5px 'Inter';color:var(--muted);padding:7px 14px;border-radius:8px;transition:background .15s,color .15s}
.subnav button:hover{color:var(--ink)}
.subnav button.on{background:var(--green-700);color:#fff}

.tool-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tool-bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px 'Inter';color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--line-2);background:var(--soft)}
.chip.on{background:var(--green-50);border-color:var(--green-500);color:var(--green-800)}
.chip .x{font:800 11px 'Inter';color:var(--muted);margin-left:3px}

/* generic btn */
.btn{display:inline-flex;align-items:center;gap:7px;font:700 13px 'Inter';padding:9px 16px;border-radius:9px;border:0;transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn.primary{background:var(--green-700);color:#fff}
.btn.primary:hover{background:var(--green-800)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:var(--soft);border-color:var(--line-2)}
.btn.danger{background:#fff;border:1px solid #f0c9c9;color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:active{transform:translateY(1px)}

/* ==========================================================================
 * COCKPIT — Stripe meets Linear: hero KPIs, alerts, recent activity, heatmap
 * ========================================================================== */
.ck-hero{background:linear-gradient(135deg,#07140c 0%,#0c1f14 60%,#103d17 100%);color:#dff0e3;border-radius:var(--rad-lg);padding:24px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.ck-hero::after{content:"";position:absolute;right:-80px;top:-80px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(124,252,154,.18),transparent 70%);pointer-events:none}
.ck-hero-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ck-hero-meta .pill{background:rgba(124,252,154,.15);color:#7cfc9a;border:1px solid rgba(124,252,154,.3)}
.ck-hero-meta .pill.ghost{background:transparent;border-color:rgba(255,255,255,.18);color:#9fb3a6}
.ck-hero h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:34px;margin:0 0 6px;color:#fff;letter-spacing:-.02em}
.ck-hero p{margin:0;font-size:14px;color:#9fb3a6;max-width:60ch}
.ck-hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:18px;position:relative;z-index:1}
@media(max-width:780px){.ck-hero-stats{grid-template-columns:1fr;gap:14px}}
.ck-hs{padding:0}
.ck-hs .l{font:600 11px 'Inter';color:#7fb98e;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.ck-hs .v{font:800 36px 'Inter';color:#fff;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.ck-hs .v small{font-size:13px;color:#9fb3a6;font-weight:600}
.ck-hs .d{margin-top:5px;font:700 12px 'Inter';color:#9fb3a6}

/* alerts */
.alert{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:var(--rad-sm);padding:11px 14px;margin-bottom:8px;transition:background .15s}
.alert:hover{background:#fafdfa}
.alert .ico{font-size:16px;line-height:1;margin-top:2px}
.alert.warn{border-left-color:var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.alert.ok{border-left-color:var(--ok)}
.alert .b{flex:1;min-width:0}
.alert .b b{font:700 13px 'Inter';color:var(--ink);display:block;margin-bottom:1px}
.alert .b span{font:500 12px 'Inter';color:var(--muted)}
.alert .act{font:700 11.5px 'Inter';color:var(--green-700);padding:3px 8px;border-radius:6px}
.alert .act:hover{background:var(--green-50)}

/* activity timeline */
.act-line{position:relative;padding-left:24px}
.act-line::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.act-it{position:relative;padding:8px 0 8px 4px;font-size:13px}
.act-it::before{content:"";position:absolute;left:-20px;top:14px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--green-500)}
.act-it.bad::before{border-color:var(--bad)}
.act-it.warn::before{border-color:var(--warn)}
.act-it.info::before{border-color:#1f6c9c}
.act-it b{font-weight:700;color:var(--ink)}
.act-it .ts{font:500 11px 'Inter';color:var(--muted-2)}
.act-it .ctx{font:500 12px 'Inter';color:var(--muted);margin-top:2px}

/* heatmap */
.heat{display:grid;gap:2px}
.heat-head{display:grid;grid-template-columns:160px repeat(7,1fr);gap:2px;font:700 10px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.heat-head .h-cell{text-align:center;padding:4px 0}
.heat-row{display:grid;grid-template-columns:160px repeat(7,1fr);gap:2px;align-items:stretch}
.heat-row .h-lbl{font:600 12px 'Inter';color:var(--ink);padding:8px 10px;background:var(--soft);border-radius:6px;display:flex;align-items:center}
.heat-row .h-cell{height:30px;display:flex;align-items:center;justify-content:center;font:700 11px 'Inter';color:var(--ink);border-radius:6px;cursor:pointer;transition:transform .12s;background:#f1f4f1;color:var(--muted)}
.heat-row .h-cell:hover{transform:scale(1.1);z-index:2;box-shadow:var(--shadow-md)}
.heat-row .h-cell.h-1{background:#e6f3e9;color:var(--green-800)}
.heat-row .h-cell.h-2{background:#bfe2c7;color:var(--green-800)}
.heat-row .h-cell.h-3{background:#7cc795;color:#fff}
.heat-row .h-cell.h-4{background:#3f9c5d;color:#fff}
.heat-row .h-cell.h-5{background:var(--green-800);color:#fff}

/* ==========================================================================
 * KANBAN (Linear-style)
 * ========================================================================== */
.kanban{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 18px;scroll-snap-type:x mandatory}
.kn-col{flex:0 0 280px;background:#f3f6f4;border:1px solid var(--line);border-radius:var(--rad-md);padding:10px 10px 12px;scroll-snap-align:start;display:flex;flex-direction:column;max-height:calc(100vh - 220px);min-height:0}
.kn-col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kn-col-h .nm{font:700 12px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.kn-col-h .cnt{font:700 10.5px 'Inter';color:var(--muted);background:#fff;border:1px solid var(--line);padding:1px 6px;border-radius:999px}
.kn-col-h .dot{width:8px;height:8px;border-radius:50%}
.kn-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.kn-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;transition:transform .12s,box-shadow .15s,border-color .15s}
.kn-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--green-200)}
.kn-card .ttl{font:700 13px 'Inter';color:var(--ink);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kn-card .meta{font:500 11px 'Inter';color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.kn-card .pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.kn-card .foot{display:flex;align-items:center;gap:8px;font:500 11px 'Inter';color:var(--muted)}
.kn-card .foot .sp{flex:1}

/* ==========================================================================
 * AI CHAT panel (slide-in from right)
 * ========================================================================== */
.chat{grid-area:chat;background:linear-gradient(180deg,#0a1812 0%,#07140c 100%);color:#dff0e3;display:flex;flex-direction:column;border-left:1px solid rgba(124,252,154,.15);position:relative;overflow:hidden}
.chat-h{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-h .ai-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7cfc9a,#3f9c5d);display:grid;place-items:center;font:900 14px 'Inter';color:#04100a}
.chat-h .nm{font:700 14px 'Inter';color:#fff}
.chat-h .sub{font:500 11.5px 'Inter';color:#7cfc9a}
.chat-h .x{margin-left:auto;color:#9fb3a6;padding:6px 10px;border-radius:6px}
.chat-h .x:hover{background:rgba(255,255,255,.07);color:#fff}
.chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.chat-msg{display:flex;gap:10px;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chat-msg .av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font:800 11px 'Inter';color:#bcd4c2;flex-shrink:0}
.chat-msg.you .av{background:var(--green-700);color:#fff}
.chat-msg.ai .av{background:linear-gradient(135deg,#7cfc9a,#3f9c5d);color:#04100a}
.chat-msg .bub{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.55;min-width:0;white-space:pre-wrap;word-wrap:break-word}
.chat-msg.you .bub{background:rgba(124,252,154,.08);border-color:rgba(124,252,154,.18)}
.chat-msg .bub b{color:#fff}
.chat-msg .bub h1,.chat-msg .bub h2,.chat-msg .bub h3,.chat-msg .bub h4{font-family:'Inter',sans-serif;color:#fff;margin:8px 0 4px;font-weight:700;font-size:14px}
.chat-msg .bub ul,.chat-msg .bub ol{padding-left:18px;margin:4px 0}
.chat-msg .bub li{margin:2px 0}
.chat-msg .bub code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;font:600 12px var(--mono);color:#7cfc9a}
.chat-msg .bub a{color:#7cfc9a;text-decoration:underline}
.chat-msg .bub table{border-collapse:collapse;margin:6px 0;font-size:12px}
.chat-msg .bub th,.chat-msg .bub td{padding:4px 8px;border:1px solid rgba(255,255,255,.1);text-align:left}
.chat-msg .bub th{background:rgba(255,255,255,.05);font-weight:700;color:#fff}
.chat-msg.thinking .bub{color:#7cfc9a;font-style:italic}
.chat-msg.thinking .bub::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7cfc9a;margin-left:4px;animation:dot 1s infinite}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chat-sugs{padding:10px 18px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.chat-sugs .l{font:700 10px 'Inter';color:#5d7a68;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.chat-sugs button{text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:7px 10px;color:#bcd4c2;font:500 12px 'Inter';transition:background .15s,color .15s;cursor:pointer}
.chat-sugs button:hover{background:rgba(124,252,154,.1);color:#fff;border-color:rgba(124,252,154,.25)}
.chat-input-wrap{padding:12px 18px 14px;border-top:1px solid rgba(255,255,255,.06);background:#04100a;flex-shrink:0}
.chat-input{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 6px 6px 12px;transition:border-color .15s}
.chat-input:focus-within{border-color:rgba(124,252,154,.4)}
.chat-input textarea{flex:1;background:none;border:0;outline:0;color:#fff;font:500 13.5px 'Inter';resize:none;padding:6px 0;max-height:140px;line-height:1.4}
.chat-input textarea::placeholder{color:#5d7a68}
.chat-input .send{background:#7cfc9a;color:#04100a;width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-size:14px;font-weight:800;cursor:pointer;transition:background .15s}
.chat-input .send:hover{background:#a8ffbe}
.chat-input .send:disabled{background:#3f4a44;color:#7c9c87;cursor:not-allowed}
.chat-meta{font:500 10.5px 'Inter';color:#5d7a68;margin-top:6px;text-align:center}

/* ==========================================================================
 * MODAL (Use Case detail)
 * ========================================================================== */
.modal-bg{position:fixed;inset:0;background:rgba(7,20,12,.55);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:30px;overflow-y:auto;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:var(--rad-lg);max-width:880px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.modal-h .ttl{flex:1;min-width:0}
.modal-h .ttl .eye{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.modal-h .ttl h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;margin:0;color:var(--ink);line-height:1.15}
.modal-h .ttl .meta{font:500 12.5px 'Inter';color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-h .x{color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.modal-h .x:hover{background:var(--soft);color:var(--ink)}
.modal-body{padding:20px 24px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;max-height:calc(100vh - 220px);overflow-y:auto}
@media(max-width:780px){.modal-body{grid-template-columns:1fr;gap:14px}}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fbfdfb}
.modal-foot .sp{flex:1}
.uc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.uc-cell{font-size:13px}
.uc-cell .lbl{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.uc-cell .val{font-weight:700;color:var(--ink)}
.uc-cell .val.muted{color:var(--muted);font-weight:500;font-style:italic}
.uc-sect{margin-top:18px}
.uc-sect h4{font:700 12px 'Inter';color:var(--green-800);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.uc-sect h4::before{content:"";width:14px;height:2px;background:var(--green-500);border-radius:2px}
.uc-sect p{font-size:13.5px;color:var(--ink-2);margin:0 0 8px;line-height:1.55}
.uc-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.uc-kpi .it{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.uc-kpi .it .k{font:700 10px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.uc-kpi .it .v{font:700 14px 'Inter';color:var(--ink);margin-top:1px}
.gate-list{display:flex;flex-direction:column;gap:8px}
.gate-it{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfdfb}
.gate-it.done{border-color:var(--green-200);background:var(--green-50)}
.gate-it.cur{border-color:var(--warn);background:var(--warn-bg);box-shadow:0 0 0 2px rgba(180,83,9,.12)}
.gate-it .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font:800 11px 'Inter';color:var(--muted);flex-shrink:0}
.gate-it.done .ico{background:var(--green-700);border-color:var(--green-700);color:#fff}
.gate-it.cur .ico{background:var(--warn);border-color:var(--warn);color:#fff}
.gate-it .b{flex:1;min-width:0}
.gate-it .b b{font:700 12.5px 'Inter';color:var(--ink);display:block}
.gate-it .b span{font:500 11.5px 'Inter';color:var(--muted)}
.gate-it .b .dec{font:700 11px 'Inter';margin-top:3px;display:inline-flex;align-items:center;gap:4px}
.gate-it .b .dec.go{color:var(--ok)}
.gate-it .b .dec.hold{color:var(--warn)}
.gate-it .b .dec.kill{color:var(--bad)}

/* ==========================================================================
 * Intake form
 * ========================================================================== */
.form-section{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:20px 22px;margin-bottom:14px}
.form-section h3{font:700 14px 'Inter';color:var(--green-800);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.form-section .sub{font:500 12.5px 'Inter';color:var(--muted);margin:0 0 14px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.form-grid .full{grid-column:1/-1}
@media(max-width:680px){.form-grid{grid-template-columns:1fr}}
.fld label{display:block;font:700 11px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 5px}
.fld label .req{color:var(--bad);margin-left:3px}
.fld label .opt{color:var(--muted-2);font-weight:500;text-transform:none;margin-left:6px;letter-spacing:0}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:500 13.5px 'Inter';background:#fff;color:var(--ink);transition:border-color .15s,background .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--green-500);background:#fafdfa}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld .help{font:500 11.5px 'Inter';color:var(--muted);margin-top:5px}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--bad);background:var(--bad-bg)}
.fld.bad .help{color:var(--bad)}
.opt-grid{display:flex;gap:8px;flex-wrap:wrap}
.opt-grid .opt{flex:1;min-width:140px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.opt-grid .opt:hover{border-color:var(--green-300)}
.opt-grid .opt.on{border-color:var(--green-500);background:var(--green-50);box-shadow:0 0 0 1px var(--green-500) inset}
.opt-grid .opt .nm{font:700 13px 'Inter';color:var(--ink)}
.opt-grid .opt .dd{font:500 11.5px 'Inter';color:var(--muted);margin-top:2px}
.steps-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.steps-bar .s{display:flex;align-items:center;gap:8px;font:600 12px 'Inter';color:var(--muted)}
.steps-bar .s .n{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font:800 11px 'Inter'}
.steps-bar .s.on{color:var(--ink)}.steps-bar .s.on .n{background:var(--green-700);border-color:var(--green-700);color:#fff}
.steps-bar .s.done{color:var(--green-700)}.steps-bar .s.done .n{background:var(--green-50);border-color:var(--green-500);color:var(--green-800)}
.steps-bar .s.done .n::before{content:"✓"}
.steps-bar .s.done .n .num{display:none}
.steps-bar .conn{flex:0 0 26px;height:1px;background:var(--line)}
.mds-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfdfb;font-size:12.5px;margin-bottom:4px}
.mds-row.ok{border-color:var(--green-200);background:var(--green-50)}
.mds-row.miss{border-color:#f0c9c9;background:var(--bad-bg)}
.mds-row .ico{width:18px;text-align:center}
.mds-row .nm{flex:1;font-weight:600;color:var(--ink)}
.mds-row.miss .ico{color:var(--bad)}
.mds-row.ok .ico{color:var(--ok)}

/* ==========================================================================
 * CALENDAR (Gantt-style annual cycle)
 * ========================================================================== */
.cal-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:18px;overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:200px repeat(12,1fr);gap:1px;min-width:880px}
.cal-grid.cal16{grid-template-columns:170px repeat(16,1fr);min-width:1180px}
.cal-h{font:700 10.5px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.cal-h.lbl{text-align:left;padding-left:8px}
.cal-h.today{color:var(--green-700);background:var(--green-50);border-radius:6px}
.cal-h.cal-h-prev{color:#8aa195;background:#f5f9f6;font-size:9.5px}
.cal-h.cal-h-qbr{background:#eaf3f8;color:#1d5e94}
.cal-h.cal-h-qbr .qbr-dot{display:block;font:800 8.5px 'Inter';color:#0e4f6e;margin-top:2px;letter-spacing:.05em}
.cal-row{display:contents}
.cal-row .cal-lbl{font:600 12.5px 'Inter';color:var(--ink);padding:9px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.cal-row .cal-lbl small{font:500 10.5px 'Inter';color:var(--muted);margin-top:1px}
.cal-row .cal-cell{position:relative;border-bottom:1px solid var(--line);min-height:42px;border-right:1px dashed var(--line)}
.cal-bar{position:absolute;top:7px;height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font:700 11px 'Inter';color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:transform .12s,box-shadow .15s;background:linear-gradient(90deg,var(--green-600),var(--green-700))}
.cal-bar:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);z-index:2}
.cal-bar.b-gate{background:linear-gradient(90deg,#7c5b07,#a06b04)}
.cal-bar.b-cycle{background:linear-gradient(90deg,#0c5b27,#103d17)}
.cal-bar.b-fast{background:linear-gradient(90deg,#a01f1f,#7a1313)}
.cal-bar.b-qbr{background:linear-gradient(90deg,#1d5e94,#0e4f6e)}
.cal-bar.b-launch{background:linear-gradient(90deg,#2E7D32,#103d17)}
.cal-bar.b-readiness{background:linear-gradient(90deg,#7c5b07,#5b3f05)}
.cal-bar.b-exec{background:linear-gradient(90deg,#1d5e94,#0e4f6e)}
.cal-bar.b-decision{background:linear-gradient(90deg,#583c8d,#3d2a64)}
.legend-sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.legend-sw.b-launch{background:linear-gradient(135deg,#2E7D32,#103d17)}
.legend-sw.b-readiness{background:linear-gradient(135deg,#7c5b07,#5b3f05)}
.legend-sw.b-exec{background:linear-gradient(135deg,#1d5e94,#0e4f6e)}
.legend-sw.b-decision{background:linear-gradient(135deg,#583c8d,#3d2a64)}
.legend-sw.b-gate{background:linear-gradient(135deg,#7c5b07,#a06b04)}
.legend-sw.b-qbr{background:linear-gradient(135deg,#1d5e94,#0e4f6e);border:1px dashed #1d5e94}
.legend-sw.b-fast{background:linear-gradient(135deg,#a01f1f,#7a1313)}

/* ==========================================================================
 * RACI matrix
 * ========================================================================== */
.raci{font-size:12.5px}
.raci-cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:800 10.5px 'Inter';color:#fff}
.raci-cell.r{background:#15803D}
.raci-cell.a{background:#a01f1f}
.raci-cell.c{background:#7c5b07}
.raci-cell.i{background:#37526a}

/* Closure KB cards */
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:16px 18px;transition:transform .12s,box-shadow .15s,border-color .15s;cursor:pointer}
.kb-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--green-200)}
.kb-card .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kb-card .h .pill{font-size:10px}
.kb-card h4{font:700 14.5px 'Inter';color:var(--ink);margin:0 0 6px;line-height:1.3}
.kb-card .ll{font:500 12px 'Inter';color:var(--muted);margin-bottom:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kb-card .ft{display:flex;align-items:center;gap:8px;font:500 11.5px 'Inter';color:var(--muted-2)}

/* generic */
.muted{color:var(--muted)}
.sp-y-lg{margin:24px 0}
.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:13.5px}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.5}

/* tiny toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#07140c;color:#dff0e3;border:1px solid rgba(124,252,154,.4);border-radius:10px;padding:11px 18px;font:600 13px 'Inter';box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s,transform .25s;z-index:9000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* scrollbars */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
.chat-body::-webkit-scrollbar-thumb,.chat-body::-webkit-scrollbar-thumb{background:#2c3a32}
.sidebar ::-webkit-scrollbar-thumb{background:#2c3a32}

/* responsive */
@media(max-width:780px){.h-pg{font-size:24px}}

/* === FEEDBACK EDITION — clic-droit sur n'importe quel bloc pour commenter === */
.fb-highlight{outline:3px dashed #FFC107!important;outline-offset:3px;border-radius:8px;animation:fbPulseHi 1s ease-in-out infinite alternate}
@keyframes fbPulseHi{from{outline-color:#FFC107}to{outline-color:#ffe082}}
.fb-badge{position:fixed;right:18px;bottom:18px;z-index:9500;background:linear-gradient(135deg,#FFC107,#FF8F00);color:#1a0f00;border:0;border-radius:999px;padding:11px 18px;font:800 13px 'Inter';cursor:pointer;box-shadow:0 12px 30px -8px rgba(255,143,0,.6);transition:transform .15s,box-shadow .15s}
.fb-badge:hover{transform:translateY(-2px);box-shadow:0 16px 36px -10px rgba(255,143,0,.7)}
.fb-badge.hot{background:linear-gradient(135deg,#FF6F00,#E53935);color:#fff}
.fb-badge.flash{animation:fbFlash .7s ease-out}
@keyframes fbFlash{0%{transform:scale(1.15);box-shadow:0 0 0 12px rgba(255,235,59,.4)}100%{transform:scale(1);box-shadow:0 12px 30px -8px rgba(255,143,0,.6)}}
.fb-menu{position:fixed;z-index:9700;background:#0c1f14;border:1px solid rgba(255,193,7,.35);border-radius:11px;padding:5px;box-shadow:0 24px 60px -10px rgba(0,0,0,.7);min-width:230px}
.fb-mi{display:block;width:100%;text-align:left;background:none;border:0;color:#dff0e3;font:600 13px 'Inter';padding:9px 12px;border-radius:7px;cursor:pointer}
.fb-mi:hover{background:rgba(255,193,7,.15);color:#fff}
.fb-modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9800;display:flex;align-items:center;justify-content:center;padding:20px}
.fb-modal{background:#0c1f14;color:#dff0e3;border:1px solid rgba(255,193,7,.4);border-radius:16px;padding:22px 24px;max-width:520px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
.fb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fb-head h3{margin:0;font:700 17px 'Inter';color:#fff}
.fb-head .fb-x{background:none;border:0;color:#9fb3a6;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.fb-head .fb-x:hover{background:rgba(255,255,255,.07);color:#fff}
.fb-ctx{display:flex;flex-direction:column;gap:2px;background:rgba(255,193,7,.08);border:1px solid rgba(255,193,7,.22);border-radius:9px;padding:9px 12px;margin-bottom:14px}
.fb-ctx .fb-lbl{font:700 10px 'Inter';letter-spacing:.08em;color:#ffc107;text-transform:uppercase}

const LS_LANG = 'nplan_lang_v1';
function detectLang(){
  try{ const v=localStorage.getItem(LS_LANG); if(v && T[v]) return v; }catch(e){}
  const q=new URLSearchParams(location.search).get('lang'); if(q && T[q]) return q;
  const n=(navigator.language||'fr').slice(0,2).toLowerCase(); return T[n]?n:'fr';
}
let LANG = detectLang();
function tr(k, fb){
  const v = (T[LANG] && T[LANG][k]); if(v!==undefined) return v;
  if(fb!==undefined) return fb;
  return k;
}
function trf(k, params){
  let s = tr(k);
  if(params){ Object.keys(params).forEach(p=>{ s = s.split('{'+p+'}').join(params[p]); }); }
  return s;
}
function setLang(l){
  if(!T[l]) return;
  LANG = l;
  try{ localStorage.setItem(LS_LANG, l); }catch(e){}
  applyLang();
}
function applyLang(){
  document.documentElement.lang = LANG;
  // static elements with data-k
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v = tr(el.dataset.k); if(v!==undefined) el.innerHTML = v;
  });
  document.querySelectorAll('[data-kph]').forEach(el=>{
    const v = tr(el.dataset.kph); if(v!==undefined) el.placeholder = v;
  });
  // top bar bits
  const gs = document.getElementById('globalSearch'); if(gs) gs.placeholder = tr('tb.search.ph');
  const ti = document.getElementById('btnTopIntake'); if(ti) ti.textContent = tr('tb.intake');
  const pr = document.getElementById('profRole'); if(pr) pr.textContent = tr('tb.role');
  // language pills + sidebar foot
  document.querySelectorAll('.tb-lang button').forEach(b=>b.classList.toggle('on', b.dataset.l===LANG));
  const sb = document.getElementById('sbBrandTag'); if(sb) sb.textContent = tr('side.tag');
  // re-render the active view (rebuilds all dynamic strings)
  renderSidebar();
  goView(PREFS.view||'cockpit');
}

  if(statusId==='approved') return 'readiness';
  if(['execution','monitoring'].includes(statusId)) return 'execution';
  if(/^closed-/.test(statusId)) return 'decision';
  return 'launch';
}

    ],
    gates: _gatesFor(status),
    created_at: _backDate(40 + i*2),
    submitted_at: status==='draft'?null:_backDate(30 + i*2),
    owner_bu: bu,
    sai_lead: ['Anaïs M.','Karim T.','Sarah B.','David L.'][i % 4],

  };
});
function _backDate(d){ const x=new Date(); x.setDate(x.getDate()-d); return x.toISOString().slice(0,10); }
function _gatesFor(status){
  // 4 gates per the validated framework v1.0:
  //   Gate 1 = Trial Steering Committee (Ideation)
  //   Gate 2 = Trial Steering Committee (Execution readiness)
  //   Gate 3 = Scientific Monitoring Committee (Evidence review)
  //   Gate 4 = Scientific Monitoring Committee (Deployment Readiness)
  const order = ['submitted','steering','ceo','execution','monitoring','closed'];
  const idx = order.indexOf(status.replace(/^closed-.*$/,'closed'));
  const gates = [
    { id:'steering1', nm:'Trial Steering Committee — Gate 1', when:'2025-11-20', kind:'Gate 1 — Ideation' },
    { id:'steering2', nm:'Trial Steering Committee — Gate 2', when:'2025-12-10', kind:'Gate 2 — Execution readiness' },
    { id:'monitoring',nm:'Scientific Monitoring Committee',   when:'TBD',         kind:'Gate 3 — Evidence review' },
    { id:'deploy',    nm:'Deployment Readiness',              when:'TBD',         kind:'Gate 4 — Deployment readiness' }
  ];
  return gates.map((g,i)=>{
    let st='upcoming', dec=null;
    if(idx<=0){ st = i===0?'current':'upcoming'; }
    else if(idx===1){ st = i===0?'done':(i===1?'current':'upcoming'); if(i===0) dec='go'; }
    else if(idx===2){ st = i<2?'done':(i===2?'current':'upcoming'); if(i<2) dec='go'; }
    else if(idx>=3){ st = i<3?'done':(i===3?'current':'upcoming'); if(i<3) dec='go'; }
    if(status==='closed-hold' && i===2){ dec='hold'; }
    if(status==='closed-kill' && i===2){ dec='kill'; }
    if(status==='closed-go'   && i===2){ dec='go'; }
    if(status==='closed-go'   && i===3){ dec='go'; st='done'; }
    return Object.assign({}, g, { status:st, decision:dec });
  });
}

/* -----------------------------------------------------------------
 * 3bis. DATA LAYER — persistance serveur (BDD WordPress réelle)
 *  localStorage sert de cache offline / premier paint ; la source de
 *  vérité partagée entre utilisateurs est la table {prefix}dnai_nplan_store
 *  exposée via /wp-json/dnai-nutriplan/v1/collection|item.
 * --------------------------------------------------------------- */
function apiCfg(){ return CHAT_BACKEND || window.DNAI_NPLAN || null; }
function apiReady(){ const c=apiCfg(); return !!(c && c.api); }
let _pushTimers = {};
function apiPush(collection, data){
  // PUT bulk débounce — évite de marteler le serveur à chaque frappe.
  if(!apiReady()) return;
  clearTimeout(_pushTimers[collection]);
  _pushTimers[collection] = setTimeout(()=>{
    const c=apiCfg();
    fetch(c.api+'/collection/'+collection, {
      method:'PUT',
      headers:{'Content-Type':'application/json','X-WP-Nonce':c.nonce||''},
      credentials:'same-origin',
      body: JSON.stringify({ data })
    }).catch(()=>{});  // silencieux : le cache local garde la main si offline
  }, 600);
}
function apiUpsert(collection, item){
  if(!apiReady()) return Promise.resolve();
  const c=apiCfg();
  return fetch(c.api+'/item/'+collection, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-WP-Nonce':c.nonce||''},
    credentials:'same-origin',
    body: JSON.stringify(item)
  }).catch(()=>{});
}
function apiDelete(collection, id){
  if(!apiReady()) return Promise.resolve();
  const c=apiCfg();
  return fetch(c.api+'/item/'+collection+'/'+encodeURIComponent(id), {
    method:'DELETE', headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin'
  }).catch(()=>{});
}
// Sync au boot (et quand la config arrive par postMessage) :
//  - serveur a des données → on les adopte (source de vérité partagée)
//  - serveur vide → on l'amorce avec ce qu'on a en local/seed
let _syncedOnce = false;
function syncFromServer(){
  if(!apiReady() || _syncedOnce) return;
  _syncedOnce = true;
  const c=apiCfg();
  fetch(c.api+'/collection/usecases', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
    .then(r=>r.ok?r.json():null)
    .then(res=>{
      if(res && Array.isArray(res.data) && res.data.length){
        DATA = res.data;
        try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){}
        renderSidebar();
        if(typeof goView==='function') goView(PREFS.view||'cockpit');
      } else {
        // serveur vide → amorçage initial avec l'état courant (seed inclus)
        apiPush('usecases', DATA);
      }
      // Référentiels : adopter ceux du serveur s'ils existent
      fetch(c.api+'/collection/reference', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
        .then(r=>r.ok?r.json():null)
        .then(rr=>{ if(rr && rr.data && typeof applyRefFromServer==='function') applyRefFromServer(rr.data); })
        .catch(()=>{});
      // Projets : adopter ceux du serveur, sinon amorcer
      fetch(c.api+'/collection/projects', { headers:{'X-WP-Nonce':c.nonce||''}, credentials:'same-origin' })
        .then(r=>r.ok?r.json():null)
        .then(pp=>{
          if(pp && Array.isArray(pp.data) && pp.data.length){ PROJECTS = pp.data; try{ localStorage.setItem(LS_PROJECTS, JSON.stringify(PROJECTS)); }catch(e){} if(PREFS.view==='projects') renderProjects(); }
          else { apiPush('projects', PROJECTS); }
        }).catch(()=>{});
    })
    .catch(()=>{});
}

function pctOnTime(){
  // Synthetic: trials whose end_date is within the current year and aren't kill'd are "on time"
  const closed = DATA.filter(u=>/^closed-/.test(u.status));
  if(!closed.length) return 0;
  return closed.filter(u=>u.status!=='closed-kill').length / closed.length * 100;
}
function budgetVariance(){
  // Synthetic budget variance: deterministic spread around the planned budget.
  let p=0, a=0;
  DATA.forEach((u,i)=>{ p += u.budget; a += u.budget * (1 + ((i%9)-4)*0.012); });
  return p ? ((a-p)/p)*100 : 0;
}

function buildAlerts(){
  const out = [];
  const lateGates = DATA.filter(u=>u.status==='steering').slice(0,3);
  lateGates.forEach(u=>{
    out.push({ kind:'warn', ico:'⏳',
      title: trf('ck.alert.late',{id:u.id}),
      ctx:   trf('ck.alert.late.ctx',{name:u.name, bu:buOf(u.bu).nm}),
      cta:   tr('ck.alert.late.cta'),
      action:`openUc('${u.id}')` });
  });
  const mds = DATA.filter(u=>u.mds_covered && u.mds_covered.length<11 && u.status!=='draft').slice(0,2);
  mds.forEach(u=>{
    const miss = MDS_ITEMS.filter(m=>!u.mds_covered.includes(m)).slice(0,2).join(' · ');
    out.push({ kind:'bad', ico:'⚠️',
      title: trf('ck.alert.mds',{id:u.id, n:u.mds_covered.length}),
      ctx:   trf('ck.alert.mds.ctx',{miss}),
      cta:   tr('ck.alert.mds.cta'),
      action:`openUc('${u.id}')` });
  });
  const ftPending = DATA.filter(u=>u.fast_track && u.status==='submitted').slice(0,1);
  ftPending.forEach(u=>{
    out.push({ kind:'warn', ico:'🚀',
      title: trf('ck.alert.ft',{id:u.id}),
      ctx:   trf('ck.alert.ft.ctx',{name:u.name}),
      cta:   tr('ck.alert.ft.cta'),
      action:`goView('fasttrack')` });
  });
  return out.slice(0,5);
}
function buildActivity(){
  return DATA.slice().sort((a,b)=>(b.last_update||'').localeCompare(a.last_update||''))

      const st = statusOf(u.status);
      const kind = u.status==='draft'?'':(u.status==='approved'||u.status.startsWith('closed-go')?'':(u.status==='closed-kill'?'bad':(u.status==='steering'||u.status==='ceo'?'warn':'info')));
      return { title:`${u.id} · ${stLbl(st)}`, when:fmtDate(u.last_update), ctx:u.name, kind };

/* Export CSV des trials clôturés (B8 — KB / Closure). */
function exportClosedCsv(){
  const closed = DATA.filter(u=>/^closed-/.test(u.status));
  if(!closed.length){ toast(tr('kb.export.empty')||'—'); return; }
  const head=['id','name','status','bu','region','crop','product','partner','budget','project_id'];
  const rows=[head].concat(closed.map(u=>head.map(k=>u[k]==null?'':u[k])));
  const csv='﻿'+rows.map(r=>r.map(c=>{c=String(c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nutriplan-closed-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

function chipFilter(label, key, options){
  const v = (PREFS.filters||{})[key];
  const cur = options.find(o=>o[0]===v);
  return `<div class="chip" onclick="cycleFilter('${key}', ${JSON.stringify(options.map(o=>o[0])).replace(/"/g,'&quot;')})">
    <span style="color:var(--muted)">${label}:</span> <b>${cur?escapeHtml(cur[1]):tr('pf.filt.all')}</b>
    ${v?'<span class="x" onclick="event.stopPropagation();clearFilter(\''+key+'\')">×</span>':''}
  </div>`;
}
function cycleFilter(key, options){
  const v = (PREFS.filters||{})[key];
  const idx = options.indexOf(v);
  const next = idx<options.length-1 ? options[idx+1] : null;
  PREFS.filters = PREFS.filters||{}; if(next) PREFS.filters[key]=next; else delete PREFS.filters[key];
  savePrefs(); renderPortfolio();
}
function clearFilter(key){ if(PREFS.filters) delete PREFS.filters[key]; savePrefs(); renderPortfolio(); }
function filteredUCs(){
  const f = PREFS.filters||{};
  const q = (f.q||'').toLowerCase().trim();
  return DATA.filter(u=>{
    if(f.type && u.type!==f.type) return false;
    if(f.bu && u.bu!==f.bu) return false;
    if(f.status && u.status!==f.status) return false;
    if(f.crop && u.crop!==f.crop) return false;
    if(f.project && u.project_id!==f.project) return false;
    if(f.partnerq && !String(u.partner||'').toLowerCase().includes(f.partnerq.toLowerCase())) return false;
    if(f.fast_track && !u.fast_track) return false;
    if(q){
      const hay = [u.id,u.name,u.partner,u.crop,u.product,u.region,buOf(u.bu).nm].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function toggleChat(){
  PREFS.chatOpen = !PREFS.chatOpen; savePrefs();
  document.getElementById('app').classList.toggle('chat-open', PREFS.chatOpen);
  document.getElementById('chatPanel').style.display = PREFS.chatOpen?'flex':'none';
  if(PREFS.chatOpen){
    if(CHAT_HIST.length===0) chatGreet();
    renderChatSugs();
    setTimeout(()=>document.getElementById('chatInput').focus(),120);
  }
}
function chatGreet(){
  CHAT_HIST.length = 0;
  CHAT_HIST.push({ role:'assistant', text: trf('chat.greet',{n:DATA.length}) });
  renderChatBody();
}
function renderChatBody(){
  const host = document.getElementById('chatBody'); if(!host) return;
  host.innerHTML = CHAT_HIST.map(m=>`<div class="chat-msg ${m.role==='user'?'you':'ai'}${m.thinking?' thinking':''}"><div class="av">${m.role==='user'?'You':'⚡'}</div><div class="bub">${m.thinking?tr('chat.thinking'):_mdToHtml(m.text)}</div></div>`).join('');
  host.scrollTop = host.scrollHeight;
}
function _mdToHtml(s){
  // Very light markdown → HTML (bold, lists, paragraphs, inline code, headings).
  let h = escapeHtml(s);
  h = h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h = h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h = h.replace(/^### (.+)$/gm,'<h4>$1</h4>');
  h = h.replace(/^## (.+)$/gm,'<h3>$1</h3>');
  // bullet lists
  h = h.replace(/(^|\n)((?:- .+(?:\n|$))+)/g, (_, pfx, blk)=>{
    const items = blk.trim().split(/\n/).map(l=>l.replace(/^- /,'')).map(x=>`<li>${x}</li>`).join('');
    return `${pfx}<ul>${items}</ul>`;
  });
  // numbered lists
  h = h.replace(/(^|\n)((?:\d+\. .+(?:\n|$))+)/g, (_, pfx, blk)=>{
    const items = blk.trim().split(/\n/).map(l=>l.replace(/^\d+\. /,'')).map(x=>`<li>${x}</li>`).join('');
    return `${pfx}<ol>${items}</ol>`;
  });
  h = h.replace(/\n\n+/g,'<br><br>');
  h = h.replace(/\n/g,'<br>');
  return h;
}
function renderChatSugs(){
  const host = document.getElementById('chatSugs'); if(!host) return;
  const sugs = ['chat.sug1','chat.sug2','chat.sug3','chat.sug4','chat.sug5','chat.sug6'].map(k=>tr(k));
  host.innerHTML = `<div class="l">${tr('chat.sugs.l')}</div>` + sugs.map(s=>`<button onclick="chatAsk(${JSON.stringify(s).replace(/"/g,'&quot;')})">${escapeHtml(s)}</button>`).join('');
}
function chatAsk(q){
  document.getElementById('chatInput').value = q;
  chatSend();
}
function askAIAbout(id){
  const u = ucById(id); if(!u) return;
  if(!PREFS.chatOpen) toggleChat();
  chatAsk(`Analyse le Use Case ${id} (${u.name}) : risques, points forts, alignement avec le portefeuille, recommandation pour le prochain gate.`);
  closeUc();
}
async function chatSend(){
  const inp = document.getElementById('chatInput');
  const text = inp.value.trim(); if(!text) return;
  inp.value=''; inp.style.height='auto';
  CHAT_HIST.push({ role:'user', text });
  CHAT_HIST.push({ role:'assistant', thinking:true });
  renderChatBody();
  document.getElementById('chatSendBtn').disabled = true;
  try{
    const reply = await chatCall(text);
    CHAT_HIST.pop(); // remove thinking
    CHAT_HIST.push({ role:'assistant', text: reply });
  } catch(e){
    CHAT_HIST.pop();
    CHAT_HIST.push({ role:'assistant', text: trf('chat.unavail',{e:e.message}) });
  } finally {
    document.getElementById('chatSendBtn').disabled = false;
    renderChatBody();
    renderChatSugs();
  }
}
async function chatCall(q){
  const cfg = CHAT_BACKEND || window.DNAI_NPLAN || null;
  if(!cfg || !cfg.chat || !cfg.ai){
    // Fallback — local synthetic response so the demo never breaks if the backend isn't wired.
    return _localFallback(q);
  }
  const sysPrompt = _buildSystemPrompt();
  const messages = [
    { role:'system',   content: sysPrompt },
    { role:'user',     content: q }
  ];
  // Include short rolling history (last 4 exchanges) for context.
  const hist = CHAT_HIST.filter(m=>!m.thinking && m.text).slice(-8);
  hist.forEach(m=>{ if(m.role==='user' && m.text!==q) messages.splice(1,0,{role:'user',content:m.text}); });
  const res = await fetch(cfg.chat, {
    method:'POST',
    headers:{'Content-Type':'application/json','X-WP-Nonce':cfg.nonce||''},
    body: JSON.stringify({ messages, temperature:0.2, max_tokens:1200 })
  });
  const j = await res.json();
  if(j && j.error) throw new Error(j.error);
  if(j && j.text)  return j.text;
  throw new Error('Réponse vide du backend.');
}
function _buildSystemPrompt(){
  const rows = DATA.map(u=>({
    id:u.id, name:u.name, bu:u.bu, region:u.region, crop:u.crop, product:u.product,

    mds_covered:(u.mds_covered||[]).length, ic_issues:u.ic_issues||[],

  }));
  const langName = {fr:'French',en:'English',pt:'Brazilian Portuguese'}[LANG] || 'French';
  return `You are **D²nAI bot**, the AI co-pilot dedicated to **NutriPlan** — the Plan & Govern module that sits on top of **NutriTrials** (the execution platform live at nutritrials.ma) to cover the full Trial Management cycle at OCP Nutricrops, in strict alignment with the **validated Trial Management Framework v1.0** signed by the CEO.

Framework v1.0 context (CEO-signed):

Data — ${rows.length} Use Cases in the portfolio:

\`\`\`json
${JSON.stringify(rows)}

BUs: ${BUS.map(b=>b.id+'='+b.nm).join(' · ')}.
Statuses (id=labels in ${LANG}): ${STATUSES.map(s=>s.id+'='+stLbl(s)).join(' · ')}.

IC catalogue: ${IC_POINTS.map(p=>p.id+'='+tr(p.lblK)).join(' | ')}.

function _localFallback(q){
  const lc = q.toLowerCase();
  if(/risque|risk|mds|incomplet|incomplete/.test(lc)){
    const list = DATA.filter(u=>(u.mds_covered||[]).length<11 && u.status!=='draft').slice(0,5);
    return tr('chat.lfb.mds') + '\n\n' + list.map(u=>`- **${u.id}** — ${u.name} _(MDS ${u.mds_covered.length}/12)_`).join('\n') + tr('chat.lfb.mds.mode');
  }
  if(/brazil|bresil|brésil/.test(lc)){
    const list = DATA.filter(u=>u.bu==='BRA');
    return trf('chat.lfb.brazil',{n:list.length, b:fmtMoney(list.reduce((s,u)=>s+u.budget,0))}) + '\n\n' + list.slice(0,5).map(u=>`- **${u.id}** — ${u.name} _(${u.status})_`).join('\n');
  }
  if(/soufre|sulphur|sulfur/.test(lc)){
    const list = DATA.filter(u=>/sulph|sulfur|soufre/i.test(u.name));
    return tr('chat.lfb.sulphur') + '\n\n' + list.map(u=>`- **${u.id}** — ${u.name} _(${u.status})_`).join('\n');
  }
  if(/nutritrials|handoff|provisionn/.test(lc)){
    const ready = DATA.filter(u=>u.status==='approved');
    const sent  = DATA.filter(u=>['execution','monitoring'].includes(u.status));
    return trf('chat.lfb.handoff',{ready:ready.length, sent:sent.length}) + '\n' + ready.slice(0,5).map(u=>`- **${u.id}** — ${u.name}`).join('\n');
  }
  return trf('chat.localFb',{n:DATA.length});
}

/* Intake helpers + real submission (fixes B1/B3/B4/B5, Q4/Q6/Q7) */
function ifDateCheck(){
  const s=document.getElementById('if_start'), e=document.getElementById('if_end'), err=document.getElementById('if_dateErr');
  if(!s||!e||!err) return true;
  const bad = s.value && e.value && e.value < s.value;
  err.style.display = bad ? 'block' : 'none';
  e.style.borderColor = bad ? 'var(--bad)' : '';
  return !bad;
}
function ifPartnerOther(){
  const sel=document.getElementById('if_partner'), wrap=document.getElementById('if_partnerOtherWrap');
  if(wrap) wrap.style.display = (sel && sel.value==='__other__') ? '' : 'none';
}
function ifAttachList(){
  const inp=document.getElementById('if_attach'), out=document.getElementById('if_attachList');
  if(inp&&out) out.textContent = inp.files.length ? Array.from(inp.files).map(f=>f.name).join(', ') : '';
}
function ifProtoName(){
  const inp=document.getElementById('if_protocol'), out=document.getElementById('if_protocolName');
  if(inp&&out){ out.textContent = inp.files.length ? '📎 '+inp.files[0].name : tr('in.f.protocol.help'); out.style.color = inp.files.length ? 'var(--green-700)' : ''; }
}
function ifVal(id){ const el=document.getElementById(id); return el?el.value.trim():''; }
function submitUc(isDraft){
  if(!ifDateCheck()){ toast(tr('in.f.dateErr')); return; }
  const name = ifVal('if_name');
  if(!name){ toast(tr('in.err.name')); document.getElementById('if_name').focus(); return; }
  let partner = ifVal('if_partner');
  if(partner==='__other__'){ partner = ifVal('if_partnerOther') || 'Autre partenaire'; }
  const type = ifVal('if_type') || 'applied';
  const cls = type==='scientific' ? 'fundamental' : type==='applied' ? 'validation' : 'demo';
  const clsObj = (window.REF?REF.classes:CLASSES).find(c=>c.id===cls) || CLASSES[0];
  const mds = Array.from(document.querySelectorAll('.if_mds:checked')).map(c=>c.dataset.mds);
  const attachments = Array.from((document.getElementById('if_attach')||{files:[]}).files).map(f=>f.name);
  const proto = (document.getElementById('if_protocol')||{files:[]}).files[0];
  // Protocol mandatory on submit (not on draft) — Q5
  if(!isDraft && !proto){ toast(tr('in.err.proto')); return; }
  const num = (DATA.length+1).toString().padStart(3,'0');
  const uc = {
    id:'UC-2026-'+num, name,
    project_id: ifVal('if_project')||null,
    bu: ifVal('if_bu')||'SAI',
    region: ifVal('if_region')||'—',
    crop: ifVal('if_crop')||'—',
    product: ifVal('if_prod')||'—',
    reference: ifVal('if_ref')||'',
    type, priority: ifVal('if_prio')||'med',
    status: isDraft ? 'draft' : 'submitted',
    budget: Number(ifVal('if_budget'))||0,
    partner,
    start_date: ifVal('if_start')||null,
    end_date: ifVal('if_end')||null,
    fast_track: ifVal('if_ft')==='1',
    trial_class: cls,
    trial_type: clsObj.types[0].id,
    strategic_objectives: [ (window.REF?REF.strategicObjectives:STRATEGIC_OBJECTIVES)[0].id ],
    partner_setup: 'provider',
    ic_issues: [],
    objective_primary: ifVal('if_objp'),
    objectives_secondary: ifVal('if_objs') ? ifVal('if_objs').split('\n').filter(Boolean) : [],
    kpis_primary: [], kpis_secondary: [],
    treatments: Number(ifVal('if_treat'))||4,
    replications: Number(ifVal('if_rep'))||3,
    mds_covered: mds,
    rationale: ifVal('if_rat'),
    attachments,
    protocol: proto ? proto.name : null,
    sai_ref: ifVal('if_sai'),
    risks: [],
    gates: _gatesFor(isDraft?'draft':'submitted'),
    created_at: new Date().toISOString(),
    submitted_at: isDraft ? null : new Date().toISOString(),
    owner_bu: ifVal('if_bu')||'SAI'
  };
  DATA.unshift(uc);
  try{ localStorage.setItem(LS_DATA, JSON.stringify(DATA)); }catch(e){}
  apiUpsert('usecases', uc);  // upsert granulaire serveur (anti-clobber multi-user)
  renderSidebar();
  toast(isDraft ? tr('in.toast.draft') : tr('in.toast.submit'));
  PREFS.filters = {}; savePrefs();
  goView('portfolio');
}

  // Bars now positioned over the 16-col axis (col 0 = Sep N-1).
  // Macro-phase color mapping per the 4-phase framework.
  const bars = [
    { lblK:'cal.b1',  subK:'cal.b1.s',  start:0,  end:0,  cls:'b-launch'   },
    { lblK:'cal.b2',  subK:'cal.b2.s',  start:1,  end:3,  cls:'b-launch'   },

    { lblK:'cal.b10', subK:'cal.b10.s', start:14, end:15, cls:'b-decision' }

        }).join('')}
        ${bars.map(b=>{
          const lbl = tr(b.lblK), sub = tr(b.subK);
          return `<div class="cal-row">
            <div class="cal-lbl">${escapeHtml(lbl)}<small>${escapeHtml(sub)}</small></div>
            ${months16.map((_,m)=>`<div class="cal-cell">${m===b.start?`<div class="cal-bar ${b.cls}" style="left:6px;right:6px;width:calc(${(b.end-b.start+1)*100}% - 12px)">${escapeHtml(lbl)}</div>`:''}</div>`).join('')}

        <span><span class="legend-sw b-exec"></span> ${tr('mp.execution')}</span>
        <span><span class="legend-sw b-decision"></span> ${tr('mp.decision')}</span>

    return `<div class="card ref-card">${head}${bodyHtml}</div>`;

  return `<p class="muted" style="margin:-4px 0 14px">${tr('adm.ref.lead')}</p>
    <div class="ref-grid">${cards}</div>
    <div class="tool-bar" style="margin-top:8px">
      <button class="btn ghost sm" onclick="refExport()">⤓ ${tr('adm.export')}</button>
      <span class="sp"></span>
      <button class="btn ghost sm" onclick="refResetDefaults()">↺ ${tr('adm.reset')}</button>
    </div>`;
}
function refAfterChange(){ persistRef(); renderAdmin(); renderSidebar(); }
function refAddStr(key){
  const inp=document.getElementById('refadd_'+key); const v=(inp.value||'').trim(); if(!v) return;
  const r=refByKey(key); const list=r.get().slice();
  if(list.some(x=>String(x).toLowerCase()===v.toLowerCase())){ toast(tr('adm.dup')); return; }
  list.push(v); r.set(list); refAfterChange();
}
function refAddObj(key){
  const r=refByKey(key); const obj={};
  r.cols.forEach(c=>{ const el=document.getElementById('refadd_'+key+'_'+c[0]); obj[c[0]]=(el&&el.value.trim())||''; });
  if(!Object.values(obj).some(Boolean)){ return; }
  if(key==='bus' && !obj.id) obj.id = (obj.nm||'BU').slice(0,4).toUpperCase();
  if(key==='partners' && !obj.typ) obj.typ='Partenaire';
  const list=r.get().slice(); list.push(obj); r.set(list); refAfterChange();
}
function refUpdObj(key,i,field,val){
  const r=refByKey(key); const list=r.get().slice(); if(!list[i]) return;
  list[i]={...list[i],[field]:val}; r.set(list); persistRef();
}
function refDel(key,i){
  const r=refByKey(key); const list=r.get().slice(); const val=list[i];
  const label = (typeof val==='object')?(val.nm||val.id):val;
  const used = refUsageCount(key, (typeof val==='object')?(val.id||val.nm):val);
  if(used>0){ toast(trf('adm.usedBy',{n:used})); return; }
  if(!confirm(trf('adm.confirmDel',{v:label}))) return;
  list.splice(i,1); r.set(list); refAfterChange();
}
function refExport(){
  const blob=new Blob([JSON.stringify(snapshotRef(),null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nutriplan-referentiels-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function refResetDefaults(){
  if(!confirm(tr('adm.confirmReset'))) return;
  try{ localStorage.removeItem('nplan_reference_v1'); }catch(e){}
  location.reload();
}

/* ============================================================
 * FEEDBACK EDITION — clic-droit sur n'importe quel bloc pour
 * déposer un commentaire lié à son contexte (vue / bloc /
 * sélecteur). Tout reste en localStorage ; export JSON / CSV /
 * markdown depuis le panneau. Porté 1:1 du CGM Cockpit.
 * ============================================================ */
const FB = (function(){
  const LS='nutriplan_feedback_v1', LS_AUTHOR='nutriplan_feedback_author_v1';
  let list = []; try{ list = JSON.parse(localStorage.getItem(LS))||[]; }catch(e){ list=[]; }
  let author = ''; try{ author = localStorage.getItem(LS_AUTHOR)||''; }catch(e){}
  function save(){ try{ localStorage.setItem(LS, JSON.stringify(list)); }catch(e){} renderBadge(); }
  function setAuthor(a){ author=(a||'').trim(); try{ localStorage.setItem(LS_AUTHOR, author); }catch(e){} }
  function uid(){ return 'fb-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function viewLabel(){
    const id = (typeof PREFS!=='undefined' && PREFS.view) ? PREFS.view : 'cockpit';
    const nav = (typeof NAV!=='undefined') ? NAV.find(n=>n.id===id) : null;
    return nav ? tr(nav.crumbK) : id;
  }
  function blockLabel(el){
    if(!el) return '(zone)';
    let n=el.closest('[data-fb-name]'); if(n) return n.getAttribute('data-fb-name');
    const known=el.closest('.card, .ck-hero, .kpi, .kb-card, .kn-card, .uc-sect, .uc-kpi, .form-section, .heat-row, .row-2c, .cal-row, .mds-row, .screen');
    if(known){
      const h=known.querySelector('h2,h3,h4,.eyebrow,.h-pg'); if(h && h.textContent.trim()) return h.textContent.trim().slice(0,80);
      const cls=(known.className||'').split(/\s+/).find(c=>/^(card|ck-|kpi|kb|kn|uc|form|heat|row|cal|mds)/.test(c)); if(cls) return cls;
    }
    let p=el; for(let i=0;i<8 && p;i++,p=p.parentElement){ const hh=p.querySelector && p.querySelector('h2,h3,h4'); if(hh) return hh.textContent.trim().slice(0,80); }
    return '(zone non identifiée)';
  }
  function selectorOf(el){
    if(!el) return '';
    if(el.id) return '#'+el.id;
    const path=[];
    while(el && el.nodeType===1 && path.length<5){
      let p=el.nodeName.toLowerCase();
      if(el.className && typeof el.className==='string'){ const c=el.className.trim().split(/\s+/).slice(0,2).join('.'); if(c) p+='.'+c; }
      path.unshift(p);
      el=el.parentElement;
    }
    return path.join(' > ');
  }
  let hoveredEl=null, modal=null;
  function addAt(el){
    hoveredEl=el; closeMenu();
    el && el.classList.add('fb-highlight');
    const view=viewLabel(); const block=blockLabel(el); const sel=selectorOf(el);
    modal=document.createElement('div'); modal.className='fb-modal-wrap';
    modal.innerHTML='<div class="fb-modal" onclick="event.stopPropagation()">'
      +'<div class="fb-head"><h3>💬 Ajouter un commentaire</h3><button class="fb-x">✕</button></div>'
      +'<div class="fb-ctx"><span class="fb-lbl">SUR</span><b>'+escapeHtml(block)+'</b><span class="fb-bread">'+escapeHtml(view)+'</span></div>'
      +'<label class="fb-flbl">Auteur</label><input class="fb-author" type="text" placeholder="ton prénom" value="'+escapeHtml(author)+'">'
      +'<label class="fb-flbl">Commentaire</label><textarea class="fb-text" rows="4" placeholder="Que faut-il changer / ajouter / corriger ?"></textarea>'
      +'<div class="fb-act"><button class="fb-cancel">Annuler</button><button class="fb-save">Enregistrer</button></div>'
      +'</div>';
    document.body.appendChild(modal);
    const close=()=>{ if(modal){modal.remove();modal=null;} if(hoveredEl) hoveredEl.classList.remove('fb-highlight'); };
    modal.addEventListener('click', e=>{ if(e.target===modal) close(); });
    modal.querySelector('.fb-x').onclick=close;
    modal.querySelector('.fb-cancel').onclick=close;
    setTimeout(()=>{ const t=modal.querySelector('.fb-text'); if(t) t.focus(); },50);
    modal.querySelector('.fb-save').onclick=function(){
      const a=modal.querySelector('.fb-author').value.trim();
      const text=modal.querySelector('.fb-text').value.trim();
      if(!text){ alert('Le commentaire est vide.'); return; }
      setAuthor(a);
      list.unshift({id:uid(), ts:new Date().toISOString(), author:a, view:view, block:block, selector:sel, lang:LANG, comment:text});
      save(); close(); flashBadge();
    };
  }
  let menu=null;
  function closeMenu(){ if(menu){menu.remove();menu=null;} }
  function openMenu(e){
    closeMenu(); const target=e.target;
    if(target.closest && target.closest('input, select, textarea, .fb-modal, .fb-panel')) return;
    e.preventDefault();
    menu=document.createElement('div'); menu.className='fb-menu';
    menu.style.left=Math.min(e.clientX, window.innerWidth-220)+'px';
    menu.style.top =Math.min(e.clientY, window.innerHeight-110)+'px';
    menu.innerHTML='<button class="fb-mi" data-act="add">💬 Ajouter un commentaire ici</button>'
      +'<button class="fb-mi" data-act="open">📋 Voir tous les commentaires ('+list.length+')</button>';
    document.body.appendChild(menu);
    menu.querySelector('[data-act=add]').onclick=()=>{ closeMenu(); addAt(target); };
    menu.querySelector('[data-act=open]').onclick=()=>{ closeMenu(); openPanel(); };
  }
  document.addEventListener('contextmenu', openMenu);
  document.addEventListener('click', e=>{ if(menu && !menu.contains(e.target)) closeMenu(); });
  let badge=null, panel=null;
  function renderBadge(){ if(!badge) return; badge.innerHTML='💬 '+list.length+' commentaire'+(list.length>1?'s':''); badge.classList.toggle('hot', list.length>0); }
  function flashBadge(){ if(!badge) return; badge.classList.add('flash'); setTimeout(()=>badge.classList.remove('flash'), 700); }
  function openPanel(){
    if(panel){ panel.remove(); panel=null; return; }
    panel=document.createElement('div'); panel.className='fb-panel';
    const head='<div class="fb-phead"><h3>📋 Commentaires ('+list.length+')</h3><button class="fb-x">✕</button></div>'
      +'<div class="fb-pacts"><button class="fb-btn" data-act="exjson">⤓ JSON</button><button class="fb-btn" data-act="excsv">⤓ CSV</button><button class="fb-btn" data-act="excopy">📋 Copier markdown</button><span style="flex:1"></span><button class="fb-btn danger" data-act="clear">🗑 Tout effacer</button></div>';
    const body=list.length?
      '<div class="fb-list">'+list.map(c=>`<div class="fb-item" data-id="${c.id}">
        <div class="fb-iblock"><b>${escapeHtml(c.block)}</b><span>${escapeHtml(c.view)}</span></div>
        <div class="fb-itext">${escapeHtml(c.comment)}</div>
        <div class="fb-imeta"><span>${escapeHtml(c.author||'anonyme')}</span><span>${new Date(c.ts).toLocaleString('fr-FR')}</span><button class="fb-del" title="Supprimer">🗑</button></div>
      </div>`).join('')+'</div>':
      '<p class="fb-empty">Aucun commentaire pour le moment. Clic-droit sur n\'importe quel bloc pour en ajouter un.</p>';
    panel.innerHTML='<div class="fb-pinner">'+head+body+'</div>';
    document.body.appendChild(panel);
    panel.querySelector('.fb-x').onclick=()=>{ panel.remove(); panel=null; };
    panel.querySelectorAll('.fb-del').forEach(b=>b.onclick=function(e){ e.stopPropagation();
      const id=this.closest('.fb-item').dataset.id; list=list.filter(x=>x.id!==id); save(); panel.remove(); panel=null; openPanel();
    });
    panel.querySelector('[data-act=clear]').onclick=function(){ if(!confirm('Effacer tous les commentaires ?')) return; list=[]; save(); panel.remove(); panel=null; openPanel(); };
    panel.querySelector('[data-act=exjson]').onclick=()=>exportFile('nutriplan-feedback-'+stamp()+'.json', JSON.stringify({exportedAt:new Date().toISOString(),count:list.length,comments:list},null,2), 'application/json');
    panel.querySelector('[data-act=excsv]').onclick=()=>exportFile('nutriplan-feedback-'+stamp()+'.csv', toCsv(), 'text/csv;charset=utf-8');
    panel.querySelector('[data-act=excopy]').onclick=()=>{ navigator.clipboard.writeText(toMarkdown()).then(()=>alert('Copié en markdown — colle dans Teams/Slack/Notion.')); };
  }
  function stamp(){ const d=new Date(); return d.toISOString().slice(0,16).replace(/[:T]/g,'-'); }
  function csvQ(s){ s=String(s==null?'':s); return '"'+s.replace(/"/g,'""')+'"'; }
  function toCsv(){
    const head=['ts','author','view','block','comment','selector','lang'];
    const rows=list.map(c=>[c.ts,c.author||'',c.view,c.block,c.comment,c.selector||'',c.lang||''].map(csvQ).join(','));
    return '﻿'+head.join(',')+'\n'+rows.join('\n');
  }
  function toMarkdown(){
    if(!list.length) return '_(aucun commentaire)_';
    return list.map((c,i)=>`### ${i+1}. ${c.block} *(${c.view})*\n- **Par** ${c.author||'anonyme'} — ${new Date(c.ts).toLocaleString('fr-FR')}\n\n${c.comment}\n`).join('\n---\n\n');
  }
  function exportFile(name, content, mime){
    const blob=new Blob([content],{type:mime}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }
  function mountBadge(){
    badge=document.createElement('button'); badge.className='fb-badge'; badge.onclick=openPanel;
    badge.title='Voir les commentaires · clic-droit sur un bloc pour en ajouter un';
    document.body.appendChild(badge); renderBadge();
  }
  return {mount:mountBadge, openPanel:openPanel, count:()=>list.length};
})();
FB.mount();

postHeight();
</script>
