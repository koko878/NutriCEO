<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NutriPlan — Trial Management · OCP Nutricrops · D²nAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#103d17;--green-800:#1B5E20;--green-700:#2E7D32;--green-600:#2f8a39;--green-500:#4CAF50;
  --green-400:#5cb966;--green-300:#66BB6A;--green-200:#A5D6A7;--green-100:#D6EADb;--green-50:#EAF4EC;
  --green-25:#f5fbf6;
  --ink:#10231a;--ink-2:#1f3a2a;--ink-3:#3a4d44;--muted:#5c6b62;--muted-2:#7e8d83;
  --line:#e3ebe5;--line-2:#cfdcd4;--line-soft:#eef3ef;
  --bad:#B91C1C;--bad-bg:#fdeced;--ok:#15803D;--ok-bg:#dcfce7;--warn:#B45309;--warn-bg:#fef3c7;
  --info:#0e4f6e;--info-bg:#dff1fb;
  --soft:#f5f9f6;--soft-2:#fafdfb;--bg-deep:#07140c;
  /* v0.22.3 polish — shadows enrichies (chaude/froide selon contexte) */
  --shadow-sm:0 1px 2px rgba(16,35,26,.06);
  --shadow-md:0 6px 18px -6px rgba(16,35,26,.18);
  --shadow-lg:0 24px 60px -20px rgba(16,35,26,.30);
  --shadow-card:0 1px 3px rgba(16,35,26,.04), 0 4px 14px -6px rgba(16,35,26,.08);
  --shadow-card-hover:0 4px 8px rgba(16,35,26,.06), 0 12px 28px -10px rgba(46,125,50,.18);
  --shadow-glow:0 0 0 1px rgba(46,125,50,.16), 0 8px 24px -8px rgba(46,125,50,.22);
  --rad-sm:8px;--rad-md:12px;--rad-lg:16px;--rad-xl:20px;--rad-pill:999px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* v0.22.3 polish — spacing scale 4pt-based */
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
  --space-6:24px;--space-7:32px;--space-8:40px;--space-9:56px;--space-10:72px;
  /* v0.22.3 polish — durations + easings (exponentielle pour décélération naturelle) */
  --dur-instant:80ms;--dur-fast:140ms;--dur-base:220ms;--dur-slow:380ms;--dur-page:520ms;
  --ease-out-quart:cubic-bezier(.165,.84,.44,1);
  --ease-out-quint:cubic-bezier(.23,1,.32,1);
  --ease-out-expo:cubic-bezier(.19,1,.22,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  /* z-index scale sémantique */
  --z-dropdown:100;--z-sticky:200;--z-modal-back:300;--z-modal:400;--z-toast:500;--z-tooltip:600;--z-coach:10000;
  /* semantic tokens (v0.11 — extract pass) */
  --ring-focus:0 0 0 3px rgba(46,125,50,.35);
  --ring-focus-soft:0 0 0 4px rgba(46,125,50,.18);
  --st-go-bg:#c5f0d4;--st-go-fg:#0c5b27;
  --st-hold-bg:#fde7c7;--st-hold-fg:#8c5a06;
  --st-kill-bg:#fde0e0;--st-kill-fg:#8b1a1a;
  --st-draft-bg:#eef0ef;--st-draft-fg:#5c6b62;
  --av-1:#7c5b07;--av-2:#583c8d;--av-3:#0e4f6e;--av-4:#8d4a04;--av-5:#a01f1f;--av-6:#15803D;
  --raci-r:#15803D;--raci-a:#a01f1f;--raci-c:#7c5b07;--raci-i:#37526a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--soft);line-height:1.5;overflow:hidden auto}
/* v0.11 — a11y: focus-visible ring everywhere */
:focus{outline:none}
:focus-visible{outline:none;box-shadow:var(--ring-focus);border-radius:6px}
button:focus-visible, a:focus-visible, .sb-item:focus-visible, .kpi:focus-visible, .kn-card:focus-visible, .chip:focus-visible, .btn:focus-visible, [role="button"]:focus-visible{box-shadow:var(--ring-focus)}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:var(--green-700);text-decoration:none}

/* ==========================================================================
 * APP SHELL — sidenav (left) + main + chat panel (right, slide-in)
 * ========================================================================== */
/* minmax(0,1fr) sur la colonne main : sans ça, un contenu large (table / kanban)
 * refuse de rétrécir et POUSSE la colonne chat (et sa croix de fermeture) hors
 * de l'écran à droite — d'où "pas de croix + texte coupé". */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);grid-template-rows:56px 1fr;height:100vh;
     grid-template-areas:'sidebar topbar' 'sidebar main'}
/* Chat ouvert : on resserre le menu gauche (240→200) et on élargit le chat (380→460). */
.app.chat-open{grid-template-columns:200px minmax(0,1fr) 460px;
     grid-template-areas:'sidebar topbar chat' 'sidebar main chat'}
@media(max-width:1280px){.app.chat-open{grid-template-columns:200px minmax(0,1fr);grid-template-areas:'sidebar topbar' 'sidebar main'}
  .app.chat-open .chat{position:fixed;top:56px;right:0;bottom:0;width:min(460px,94vw);z-index:80;box-shadow:var(--shadow-lg)}}
@media(max-width:980px){.app,.app.chat-open{grid-template-columns:56px minmax(0,1fr);grid-template-areas:'sidebar topbar' 'sidebar main'}
  .app.chat-open .chat{position:fixed;top:56px;right:0;bottom:0;width:min(460px,94vw);z-index:80;box-shadow:var(--shadow-lg)}}

/* ----- sidenav ----- */
.sidebar{grid-area:sidebar;background:linear-gradient(180deg,#0a1812 0%,#07140c 100%);color:#dff0e3;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06)}
.sb-brand{padding:14px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06)}
.sb-brand .by{font:600 9px 'Inter';letter-spacing:.14em;text-transform:uppercase;color:#8fae97;margin-bottom:4px}
.sb-brand .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:#fff;letter-spacing:.01em;display:flex;align-items:baseline;gap:6px}
.sb-brand .nm b{color:var(--green-300);font-weight:700}
.sb-brand .tag{font:600 10px 'Inter';color:#7cfc9a;background:rgba(124,252,154,.13);padding:2px 7px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px;display:inline-block}
.sb-nav{flex:1;overflow-y:auto;padding:14px 8px}
.sb-section{font:700 10px 'Inter';color:#5d7a68;letter-spacing:.12em;text-transform:uppercase;padding:14px 10px 6px}
.sb-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;color:#bcd4c2;font:600 13px 'Inter';margin-bottom:2px;transition:background .15s,color .15s;text-align:left}
.sb-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sb-item.on{background:rgba(124,252,154,.13);color:#fff}
.sb-item .ico{width:18px;height:18px;flex-shrink:0;color:currentColor;opacity:.85}
.sb-item.on .ico, .sb-item:hover .ico{opacity:1}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .badge{font:800 9.5px 'Inter';background:rgba(124,252,154,.18);color:#7cfc9a;padding:1px 6px;border-radius:999px}
.sb-item .badge.warn{background:rgba(255,193,7,.18);color:#FFCC55}
.sb-item .badge.bad{background:rgba(255,82,82,.18);color:#ff8a8a}
.sb-foot{padding:10px 12px;border-top:1px solid rgba(255,255,255,.06);font:500 11.5px 'Inter';color:#7c9c87;display:flex;align-items:center;gap:8px}
.sb-foot .dot{width:7px;height:7px;border-radius:50%;background:#7cfc9a;box-shadow:0 0 0 0 rgba(124,252,154,.7);animation:pulseDot 1.8s ease-out infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(124,252,154,.7)}80%,100%{box-shadow:0 0 0 7px rgba(124,252,154,0)}}
@media(max-width:980px){.sb-brand,.sb-section,.sb-foot,.sb-item .lbl,.sb-item .badge{display:none}.sb-nav{padding:10px 4px}.sb-item{justify-content:center;padding:10px 0}.sidebar{padding-top:8px}}

/* ----- topbar ----- */
.topbar{grid-area:topbar;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;z-index:5}
.tb-crumbs{display:flex;align-items:center;gap:6px;font:600 13px 'Inter';color:var(--muted)}
.tb-crumbs b{color:var(--ink);font-weight:700}
.tb-crumbs span.sep{color:var(--line-2)}
.tb-sp{flex:1}
.tb-search{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 12px;width:280px;max-width:35vw;transition:border-color .15s,background .15s}
.tb-search:focus-within{border-color:var(--green-500);background:#fff}
.tb-search input{flex:1;border:0;outline:0;background:none;font:500 13px 'Inter'}
.tb-search .kbd{font:700 10.5px 'Inter';color:var(--muted);background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.tb-btn{display:inline-flex;align-items:center;gap:7px;font:700 12.5px 'Inter';padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:background .15s,border-color .15s}
.tb-btn:hover{background:var(--soft);border-color:var(--line-2)}
.tb-btn.primary{background:var(--green-700);color:#fff;border-color:var(--green-700)}
.tb-btn.primary:hover{background:var(--green-800)}
.tb-btn.ai{background:var(--green-800);color:#7cfc9a;border-color:rgba(124,252,154,.32)}
.tb-btn.ai:hover{background:var(--green-900);color:#fff}
.tb-btn.ai .dot{width:6px;height:6px;border-radius:50%;background:#7cfc9a}
.tb-prof{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:4px 6px 4px 10px}
.tb-prof .av{width:26px;height:26px;border-radius:50%;background:var(--green-700);color:#fff;display:grid;place-items:center;font:800 11px 'Inter'}
.tb-prof .nm{font:700 12px 'Inter';color:var(--ink)}
.tb-prof .ro{font:500 10.5px 'Inter';color:var(--muted)}
.tb-lang{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px}
.tb-lang button{border:0;background:none;font-size:16px;line-height:1;padding:9px 11px;min-height:36px;border-radius:6px;cursor:pointer;opacity:.55;transition:opacity .15s,background .15s}
.tb-lang button:hover{opacity:.85}
.tb-lang button.on{opacity:1;background:#fff;box-shadow:0 1px 2px rgba(16,35,26,.08)}
@media(max-width:780px){.tb-search{display:none}.tb-prof .nm,.tb-prof .ro{display:none}}

/* ----- main ----- */
.main{grid-area:main;overflow-y:auto;background:var(--soft);padding:24px 28px 60px;min-width:0}
@media(max-width:560px){.main{padding:18px 16px 40px}}
.screen{display:none;animation:fadeIn .25s ease}
.screen.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* eyebrow + page title */
.eyebrow{font:700 11px 'Inter';color:var(--green-700);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.h-pg{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--ink);margin:0 0 6px}
.lead{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:78ch}

/* ==========================================================================
 * KPI tiles (Stripe-style)
 * ========================================================================== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1180px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.kpi-grid{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:16px 18px;transition:transform .15s,box-shadow .15s,border-color .15s;cursor:pointer;position:relative;overflow:hidden}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--green-200)}
.kpi .k{font:600 11px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi .k .ico{font-size:14px;opacity:.7}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--green-800);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.kpi .v small{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font:700 11.5px 'Inter';margin-top:6px;display:flex;align-items:center;gap:5px}
.kpi .d.up{color:var(--ok)}
.kpi .d.down{color:var(--bad)}
.kpi .d.flat{color:var(--muted);font-weight:500}
.kpi .bar{margin-top:10px;height:4px;background:var(--soft);border-radius:999px;overflow:hidden}
.kpi .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green-500),var(--green-700));border-radius:999px;transition:width .55s ease}
.kpi.kpi-bad{border-color:#f0c9c9;background:linear-gradient(180deg,#fff,#fef6f6)}
.kpi.kpi-bad .v{color:#a01f1f}
.ic-chip{margin-top:6px;font:800 10.5px 'Inter';padding:2px 7px;border-radius:5px;display:inline-block}
.ic-chip.bad{background:var(--bad-bg);color:var(--bad)}
.ic-chip.ok{background:var(--ok-bg);color:var(--ok)}

/* ==========================================================================
 * Card / Panel
 * ========================================================================== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:18px 20px;margin-bottom:18px}
.card.flat{padding:0;overflow:hidden}
.card h3{margin:0 0 14px;font:700 16px 'Inter';color:var(--ink);display:flex;align-items:center;gap:8px}
.card h3 .sub{font:500 12px 'Inter';color:var(--muted);font-style:italic}
.card .card-act{margin-left:auto;display:flex;gap:6px;align-items:center}

.row-2c{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:18px}
@media(max-width:1100px){.row-2c{grid-template-columns:1fr}}

/* ==========================================================================
 * Tables (Airtable-style)
 * ========================================================================== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad-md);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:11px 12px;text-align:left;background:#fbfdfb;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafdfa}
.tbl tr.sel td{background:var(--green-50)}
.tbl .t-num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tbl .t-cell-prim{font-weight:700;color:var(--ink);max-width:340px}
.tbl .t-cell-prim .meta{font:500 11px 'Inter';color:var(--muted);margin-top:2px;font-weight:500}
.tbl .t-link{cursor:pointer}
.tbl .t-link:hover .t-cell-prim{color:var(--green-700)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font:700 10.5px 'Inter';padding:3px 9px;border-radius:999px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill-st-draft{background:var(--st-draft-bg);color:var(--st-draft-fg)}
.pill-st-submitted{background:#e0eef9;color:#1f6c9c}
.pill-st-steering{background:#fff1cd;color:var(--av-1)}
.pill-st-ceo{background:#fde2c8;color:var(--av-4)}
.pill-st-approved{background:var(--ok-bg);color:var(--ok)}
.pill-st-execution{background:#e7f0eb;color:var(--green-700)}
.pill-st-monitoring{background:#e0ecf6;color:var(--av-3)}
.pill-st-go{background:var(--st-go-bg);color:var(--st-go-fg)}
.pill-st-hold{background:var(--st-hold-bg);color:var(--st-hold-fg)}
.pill-st-kill{background:var(--st-kill-bg);color:var(--st-kill-fg)}
.pill-typ-scientific{background:#ede5f8;color:#583c8d}
.pill-typ-applied{background:#e5f0fa;color:#1d5e94}
.pill-typ-demo{background:#dff5e7;color:#106a32}
.pill-prio-high{background:#fde2e2;color:#a01f1f}
.pill-prio-med{background:#fdf1c8;color:#7c5b07}
.pill-prio-low{background:#e7eef0;color:#37526a}

/* avatar */
.av{width:24px;height:24px;border-radius:50%;background:var(--green-700);color:#fff;display:inline-grid;place-items:center;font:800 10px 'Inter';margin-right:-6px;border:2px solid #fff;flex-shrink:0}
.av.alt-1{background:var(--av-1)}.av.alt-2{background:var(--av-2)}.av.alt-3{background:var(--av-3)}.av.alt-4{background:var(--av-4)}.av.alt-5{background:var(--av-5)}.av.alt-6{background:var(--av-6)}
.av-stack{display:inline-flex;align-items:center;padding-right:6px}

/* tabs (within a screen) */
.subnav{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px}
.subnav button{font:700 12.5px 'Inter';color:var(--muted);padding:7px 14px;border-radius:8px;transition:background .15s,color .15s}
.subnav button:hover{color:var(--ink)}
.subnav button.on{background:var(--green-700);color:#fff}
.gov-subnav{display:flex;flex-wrap:wrap;margin:4px 0 16px}
.gov-tab-badge{display:inline-block;min-width:17px;padding:0 5px;margin-left:6px;border-radius:999px;background:var(--green-50);color:var(--green-800);font:700 10.5px 'Inter';line-height:16px;text-align:center;vertical-align:middle}
.gov-subnav button.on .gov-tab-badge{background:rgba(255,255,255,.25);color:#fff}

.tool-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tool-bar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px 'Inter';color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--line-2);background:var(--soft)}
.chip.on{background:var(--green-50);border-color:var(--green-500);color:var(--green-800)}
.chip .x{font:800 11px 'Inter';color:var(--muted);margin-left:3px}

/* generic btn */
.btn{display:inline-flex;align-items:center;gap:7px;font:700 13px 'Inter';padding:9px 16px;border-radius:9px;border:0;transition:background .15s,border-color .15s,color .15s,transform .1s}
.btn.primary{background:var(--green-700);color:#fff}
.btn.primary:hover{background:var(--green-800)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn.ghost:hover{background:var(--soft);border-color:var(--line-2)}
.btn.danger{background:#fff;border:1px solid #f0c9c9;color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:active{transform:translateY(1px)}

/* ==========================================================================
 * COCKPIT — Stripe meets Linear: hero KPIs, alerts, recent activity, heatmap
 * ========================================================================== */
.ck-hero{background:linear-gradient(135deg,#0a1812,#103d17);color:#dff0e3;border-radius:var(--rad-lg);padding:24px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.ck-hero-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ck-hero-meta .pill{background:rgba(124,252,154,.15);color:#7cfc9a;border:1px solid rgba(124,252,154,.3)}
.ck-hero-meta .pill.ghost{background:transparent;border-color:rgba(255,255,255,.18);color:#9fb3a6}
.ck-hero h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:28px;margin:0 0 6px;color:#fff;letter-spacing:-.02em}
.ck-hero p{margin:0;font-size:14px;color:#9fb3a6;max-width:60ch}
.ck-hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:18px;position:relative;z-index:1}
@media(max-width:780px){.ck-hero-stats{grid-template-columns:1fr;gap:14px}}
.ck-hs{padding:0}
.ck-hs .l{font:600 11px 'Inter';color:#7fb98e;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.ck-hs .v{font:700 28px 'Inter';color:#fff;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:flex;align-items:baseline;gap:4px}
.ck-hs .v small{font-size:13px;color:#9fb3a6;font-weight:600}
.ck-hs .d{margin-top:5px;font:700 12px 'Inter';color:#9fb3a6}

/* AI command-bar (hybrid landing: cockpit + bot-on-demand, top-of-screen) */
.ck-ai{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:14px 16px;margin-bottom:18px;transition:border-color .2s,box-shadow .2s;position:relative}
.ck-ai:focus-within{border-color:var(--green-500);box-shadow:0 0 0 4px rgba(46,125,50,.10)}
.ck-ai .ck-ai-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-width:0}
.ck-ai .ck-ai-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7cfc9a,#3f9c5d);display:grid;place-items:center;font:900 12px 'Inter';color:#04100a;flex-shrink:0}
.ck-ai .ck-ai-lbl{font:700 11px 'Inter';color:var(--green-800);text-transform:uppercase;letter-spacing:.08em}
.ck-ai .ck-ai-lbl b{color:var(--green-700)}
.ck-ai .ck-ai-row{display:flex;gap:8px;align-items:center}
.ck-ai input{flex:1;min-width:0;border:0;outline:0;background:none;font:500 14px 'Inter';color:var(--ink);padding:8px 4px}
.ck-ai input::placeholder{color:var(--muted)}
.ck-ai .ck-ai-go{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;font:700 12.5px 'Inter';padding:8px 14px;border-radius:8px;background:var(--green-700);color:#fff;border:0;cursor:pointer;transition:background .15s,transform .1s}
.ck-ai .ck-ai-go:hover{background:var(--green-800)}
.ck-ai .ck-ai-go:active{transform:translateY(1px)}
.ck-ai .ck-ai-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ck-ai .ck-ai-chip{font:600 11.5px 'Inter';color:var(--green-800);background:var(--green-50);border:1px solid var(--green-200);border-radius:999px;padding:5px 11px;cursor:pointer;transition:background .15s,border-color .15s}
.ck-ai .ck-ai-chip:hover{background:#dfeee3;border-color:var(--green-500)}
@media(max-width:560px){.ck-ai .ck-ai-row{flex-wrap:wrap}.ck-ai .ck-ai-go{width:100%;justify-content:center}}

/* alerts (v0.11 — bg tint instead of side-stripe) */
.alert{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--rad-sm);padding:11px 14px;margin-bottom:8px;transition:background .15s}
.alert:hover{background:#fafdfa}
.alert .ico{font-size:16px;line-height:1;margin-top:2px}
.alert.warn{border-color:#f0d9a4;background:#fffaf0}
.alert.bad{border-color:#f0c9c9;background:#fdf6f6}
.alert.ok{border-color:var(--green-200);background:#f4faf5}
.alert .b{flex:1;min-width:0}
.alert .b b{font:700 13px 'Inter';color:var(--ink);display:block;margin-bottom:1px}
.alert .b span{font:500 12px 'Inter';color:var(--muted)}
.alert .act{font:700 11.5px 'Inter';color:var(--green-700);padding:3px 8px;border-radius:6px}
.alert .act:hover{background:var(--green-50)}

/* activity timeline */
.act-line{position:relative;padding-left:24px}
.act-line::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.act-it{position:relative;padding:8px 0 8px 4px;font-size:13px}
.act-it::before{content:"";position:absolute;left:-20px;top:14px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--green-500)}
.act-it.bad::before{border-color:var(--bad)}
.act-it.warn::before{border-color:var(--warn)}
.act-it.info::before{border-color:#1f6c9c}
.act-it b{font-weight:700;color:var(--ink)}
.act-it .ts{font:500 11px 'Inter';color:var(--muted-2)}
.act-it .ctx{font:500 12px 'Inter';color:var(--muted);margin-top:2px}

/* heatmap */
.heat{display:grid;gap:2px}
.heat-head{display:grid;grid-template-columns:160px repeat(7,1fr);gap:2px;font:700 10px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.heat-head .h-cell{text-align:center;padding:4px 0}
.heat-row{display:grid;grid-template-columns:160px repeat(7,1fr);gap:2px;align-items:stretch}
.heat-row .h-lbl{font:600 12px 'Inter';color:var(--ink);padding:8px 10px;background:var(--soft);border-radius:6px;display:flex;align-items:center}
.heat-row .h-cell{height:30px;display:flex;align-items:center;justify-content:center;font:700 11px 'Inter';color:var(--ink);border-radius:6px;transition:transform .12s;background:#f1f4f1;color:var(--muted);cursor:default}
.heat-row .h-cell.h-click{cursor:pointer}
.heat-row .h-cell.h-click:hover{transform:scale(1.08);z-index:2;box-shadow:var(--shadow-md);outline:2px solid var(--green-500);outline-offset:-2px}
.heat-row .h-cell.h-1{background:#e6f3e9;color:var(--green-800)}
.heat-row .h-cell.h-2{background:#bfe2c7;color:var(--green-800)}
.heat-row .h-cell.h-3{background:#7cc795;color:#fff}
.heat-row .h-cell.h-4{background:#3f9c5d;color:#fff}
.heat-row .h-cell.h-5{background:var(--green-800);color:#fff}

/* ==========================================================================
 * KANBAN (Linear-style)
 * ========================================================================== */
.kanban{display:flex;gap:14px;overflow-x:auto;padding:4px 4px 18px;scroll-snap-type:x mandatory}
.kn-col{flex:0 0 280px;background:#f3f6f4;border:1px solid var(--line);border-radius:var(--rad-md);padding:10px 10px 12px;scroll-snap-align:start;display:flex;flex-direction:column;max-height:calc(100vh - 220px);min-height:0}
.kn-col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.kn-col-h .nm{font:700 12px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--ink)}
.kn-col-h .cnt{font:700 10.5px 'Inter';color:var(--muted);background:#fff;border:1px solid var(--line);padding:1px 6px;border-radius:999px}
.kn-col-h .dot{width:8px;height:8px;border-radius:50%}
.kn-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.kn-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;min-height:44px;cursor:pointer;transition:transform .12s,box-shadow .15s,border-color .15s;overflow:hidden;min-width:0}
.kn-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);border-color:var(--green-200)}
.kn-card *{min-width:0}
.kn-card .ttl{font:700 13px 'Inter';color:var(--ink);margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;overflow-wrap:anywhere}
.kn-card .meta{font:500 11px 'Inter';color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;word-break:break-word;overflow-wrap:anywhere}
.kn-card .pills{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.kn-card .foot{display:flex;align-items:center;gap:8px;font:500 11px 'Inter';color:var(--muted);justify-content:space-between}
.kn-card .foot > .crop{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kn-card .foot > .bdg{flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ==========================================================================
 * v0.22 — Project accordion (Portfolio + Steering + Monitoring vues groupées)
 * ========================================================================== */
/* Review SAI #1 — Trial Card style maquette SAI V15 (carte portfolio enrichie) */
.kn-card.sai{padding:14px}
.kn-card.sai .sai-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px}
.kn-card.sai .sai-id{font:700 10.5px 'Inter';letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.kn-card.sai h4{margin:3px 0 8px;font:700 14px 'Inter';color:var(--green-800);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kn-card.sai .sai-meta{font:500 11.5px 'Inter';color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 12px;margin-bottom:5px}
.kn-card.sai .sai-meta span{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.kn-card.sai .sai-actions{display:flex;gap:6px;margin-top:10px}
.sai-track{display:flex;align-items:flex-start;padding:8px 4px 5px;background:var(--green-25);border-radius:8px;margin-top:9px}
.sai-track .seg{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.sai-track .node{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font:800 8px 'Inter'}
.sai-track .lbl{font:600 8.5px 'Inter';text-align:center;line-height:1.1;max-width:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sai-track .conn{flex:1;height:2px;margin:9px 1px 0;align-self:flex-start;border-radius:2px}
.proj-acc{display:flex;flex-direction:column;gap:10px}
.proj-acc-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:box-shadow .18s var(--ease-out-quart)}
.proj-acc-card:hover{box-shadow:0 4px 20px -8px rgba(8,30,16,.12)}
.proj-acc-h{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;background:#fff;transition:background .15s,border-color .15s}
.proj-acc-h:hover{background:linear-gradient(180deg,#fafffa,#fff)}
.proj-acc-h.open{background:linear-gradient(180deg, var(--green-50), #fff);border-bottom:1px solid var(--green-100)}
.proj-acc-chev{font:700 12px Inter;color:var(--green-700);transition:transform .25s var(--ease-out-quart);flex-shrink:0;width:18px;text-align:center}
.proj-acc-h.open .proj-acc-chev{transform:rotate(90deg)}
.proj-acc-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.proj-acc-id{font:700 11px 'JetBrains Mono',ui-monospace,monospace;color:var(--muted);letter-spacing:-.01em}
.proj-acc-title{font:700 15px 'Cormorant Garamond',Georgia,serif;color:var(--green-900);line-height:1.2;letter-spacing:-.01em}
.proj-acc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.proj-acc-tags .badge{font:600 10.5px Inter;padding:3px 8px;border-radius:999px;background:#f1f5f1;color:var(--ink-2);border:1px solid var(--line)}
.proj-acc-tags .badge.bg-soft{background:var(--green-50);color:var(--green-800);border-color:var(--green-100)}
.proj-acc-tags .badge.bg-info{background:#eaf3f8;color:var(--info);border-color:#cde2ed}
.proj-acc-cnt{text-align:right;flex-shrink:0}
.proj-acc-cnt .cnt{font:800 26px 'Cormorant Garamond',serif;color:var(--green-900);line-height:1;font-variant-numeric:tabular-nums}
.proj-acc-cnt .cnt-lbl{font:500 10.5px Inter;color:var(--muted);margin-top:2px}
.proj-acc-body{display:none;padding:0;background:linear-gradient(180deg,#f9fbf9,#fff)}
.proj-acc-body.open{display:block;animation:accSlide .28s var(--ease-out-quart)}
@keyframes accSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.proj-acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;padding:14px 18px}
.proj-acc-card-uc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;transition:transform .12s,border-color .15s,box-shadow .15s}
.proj-acc-card-uc:hover{transform:translateY(-1px);border-color:var(--green-200);box-shadow:0 4px 12px -4px rgba(8,30,16,.08)}
.pauc-h{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:5px}
.pauc-id{font:700 10.5px 'JetBrains Mono',monospace;color:var(--muted)}
.pauc-title{font:700 13px Inter;color:var(--ink);line-height:1.25;margin-bottom:6px}
.pauc-meta{display:flex;justify-content:space-between;font:500 11px Inter;color:var(--muted);gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pauc-pills{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pauc-budget{font:700 12px 'JetBrains Mono',monospace;color:var(--green-800);font-variant-numeric:tabular-nums}
.pauc-action{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pauc-action select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:600 11.5px Inter;background:#fff}
.pauc-action .btn{font-size:11px;padding:4px 10px}
.gov-acc-comment{width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font:500 11.5px Inter;background:#fff;resize:vertical;color:var(--ink)}
.gov-acc-comment::placeholder{color:#7a8a80}
/* Review SAI #3 — répartition des décisions par projet (en %) */
.gov-dist{margin:0 18px 4px;padding:12px 14px 10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.gov-dist-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eef3f0}
.gov-dist-bar>span{display:block;height:100%}
.gov-dist-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.gov-dist-lg{display:inline-flex;align-items:center;gap:5px;font:600 11px Inter;color:var(--ink)}
.gov-dist-lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.gov-dist-lg b{color:var(--green-800)}

/* v0.22 — Enriched trial card (Project Desc / Business Case / Trial Desc / Status) */
/* Review SAI #1 — carte de détail façon maquette SAI (stepper + record-cols) */
.proc-track{display:flex;align-items:flex-start;gap:0;margin:18px 0 22px;padding:0 4px}
.proc-step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 4px}
.proc-step:not(:last-child)::after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:2px;background:#e7eee9;z-index:0}
.proc-step.done:not(:last-child)::after{background:var(--green-300)}
.proc-node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:800 13px 'Inter';position:relative;z-index:1;background:#fff;border:2px solid #d9e3dc;color:#bcc8c0}
.proc-step.done .proc-node{background:var(--green-600);border-color:var(--green-600);color:#fff}
.proc-step.curr .proc-node{background:#fff;border-color:#c8961f;color:#c8961f;box-shadow:0 0 0 4px #fdf3df}
.proc-label{margin-top:7px;font:700 11.5px 'Inter';color:#bcc8c0;line-height:1.25}
.proc-step.done .proc-label{color:var(--green-800)}
.proc-step.curr .proc-label{color:#c8961f}
.proc-sub{margin-top:2px;font:600 10.5px 'Inter';color:#c2cdc6}
.proc-step.done .proc-sub{color:var(--green-600)}
.proc-step.curr .proc-sub{color:#c8961f}
.record-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.record-col{display:flex;flex-direction:column;gap:16px}
.record-section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.record-section>h4{margin:0 0 12px;font:800 12px 'Inter';letter-spacing:.05em;text-transform:uppercase;color:var(--green-800);padding-bottom:9px;border-bottom:1px solid var(--line)}
.dl-list{display:flex;flex-direction:column}
.dl-item{display:grid;grid-template-columns:42% 1fr;gap:10px;padding:5px 0;border-bottom:1px dotted #eef3f0;align-items:baseline}
.dl-item:last-child{border-bottom:none}
.dl-item.full{grid-template-columns:1fr}
.dl-label{font:600 11.5px 'Inter';color:var(--muted);text-transform:none}
.dl-value{font:600 12.5px 'Inter';color:var(--ink);word-break:break-word}
.dl-item.full .dl-value{font-weight:500;line-height:1.5;margin-top:3px}
.protocol-dl{display:flex;align-items:center;gap:10px;background:var(--green-25,#f6faf7);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
.protocol-dl .proto-ico{font-size:18px}
.protocol-dl .proto-info{flex:1;min-width:0}
.protocol-dl .proto-name{font:700 12px 'Inter';color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.protocol-dl .proto-sub{font:500 11px 'Inter';color:var(--muted)}
@media (max-width:780px){.record-cols{grid-template-columns:1fr}.proc-label{font-size:10px}.proc-sub{display:none}}
.uc-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.uc-block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.uc-block-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.uc-block-ico{width:28px;height:28px;border-radius:7px;background:var(--green-50);color:var(--green-800);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.uc-block-t{font:700 12.5px Inter;color:var(--green-900);text-transform:uppercase;letter-spacing:.05em}
.uc-block-body{font:500 13px/1.55 Inter;color:var(--ink-2)}
.uc-block-body .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12.5px}
.uc-block-body .kv b{font-weight:600;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;align-self:center}
.uc-block-dl{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:6px 10px;background:var(--green-50);border:1px solid var(--green-100);border-radius:7px;font:600 11.5px Inter;color:var(--green-800);cursor:pointer;transition:.15s;text-decoration:none}
.uc-block-dl:hover{background:var(--green-100);border-color:var(--green-200)}

/* v0.22 — Wizard 3 étapes (New Use Case selector + Business Case) */
.wiz-selector{max-width:780px;margin:24px auto 0;text-align:center}
.wiz-sel-h{font:700 32px 'Cormorant Garamond',Georgia,serif;color:var(--green-900);letter-spacing:-.02em;margin-bottom:8px}
.wiz-sel-sub{font:500 14px/1.5 Inter;color:var(--ink-2);margin-bottom:32px}
.wiz-sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:30px}
.wiz-sel-card{border:2px solid var(--line);border-radius:18px;padding:32px 24px;text-align:center;position:relative;overflow:hidden;transition:all .22s var(--ease-out-quart)}
.wiz-sel-card.locked{background:#fafaf8;cursor:not-allowed}
.wiz-sel-card.locked .wiz-sel-ico,.wiz-sel-card.locked h3,.wiz-sel-card.locked p{filter:grayscale(1);opacity:.5}
.wiz-sel-card.open{background:linear-gradient(135deg,#fffdf7 0%,#fff8ec 100%);border-color:#e3a23c;cursor:pointer;box-shadow:0 2px 16px rgba(227,162,60,.12)}
.wiz-sel-card.open:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(227,162,60,.22)}
.wiz-sel-badge{position:absolute;top:12px;right:12px;font:700 10px Inter;letter-spacing:.05em;padding:3px 10px;border-radius:11px}
.wiz-sel-card.locked .wiz-sel-badge{background:#f0ede6;color:#bbb}
.wiz-sel-card.open .wiz-sel-badge{background:#e3a23c;color:#fff}
.wiz-sel-ico{font-size:42px;margin-bottom:14px}
.wiz-sel-card h3{font:700 16px 'Cormorant Garamond',serif;margin:0 0 8px;color:var(--green-900);letter-spacing:-.01em}
.wiz-sel-card.locked h3{color:#bbb}
.wiz-sel-card p{font:500 12.5px/1.5 Inter;color:var(--ink-2);margin:0 0 16px}
.wiz-sel-card.locked p{color:#c5c2ba}
.wiz-sel-info{padding:9px 13px;border-radius:10px;font:600 11.5px Inter}
.wiz-sel-card.locked .wiz-sel-info{background:#f0ede6;color:#bbb}
.wiz-sel-card.open .wiz-sel-info{background:rgba(227,162,60,.12);color:#a06f1f;border:1px solid rgba(227,162,60,.25)}
.wiz-sel-preview{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.wiz-sel-preview-h{font:700 11.5px Inter;color:var(--green-800);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
.wiz-sel-preview-steps{display:flex;align-items:center;gap:0;justify-content:space-between}
.wiz-sel-step{flex:1;text-align:center}
.wiz-sel-step-circle{width:44px;height:44px;border-radius:50%;background:var(--green-50);border:2px solid var(--green-200);display:grid;place-items:center;margin:0 auto 6px;font-size:18px}
.wiz-sel-step-n{font:700 10.5px Inter;color:var(--green-800);text-transform:uppercase;letter-spacing:.04em}
.wiz-sel-step-lbl{font:500 11.5px Inter;color:var(--muted);margin-top:2px}
.wiz-sel-step-line{flex:0 0 32px;height:2px;background:var(--green-200);align-self:flex-start;margin-top:22px}

/* Stepper du wizard 3 étapes */
.wiz-stepper{display:flex;align-items:flex-start;justify-content:space-between;max-width:680px;margin:24px auto 32px;position:relative}
.wiz-stepper::before{content:'';position:absolute;top:21px;left:60px;right:60px;height:2px;background:var(--line);z-index:0}
.wiz-step{flex:1;text-align:center;position:relative;z-index:1}
.wiz-step-c{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;margin:0 auto 8px;font:700 14px Inter;color:var(--muted);transition:all .25s var(--ease-out-quart)}
.wiz-step.active .wiz-step-c{background:var(--green-700);border-color:var(--green-700);color:#fff;box-shadow:0 4px 14px -2px rgba(46,125,50,.4)}
.wiz-step.done .wiz-step-c{background:var(--green-600);border-color:var(--green-600);color:#fff}
.wiz-step-lbl{font:600 11.5px Inter;color:var(--muted);line-height:1.3}
.wiz-step.active .wiz-step-lbl{color:var(--green-900);font-weight:700}

/* Business Case : tabs */
.bc-tabs{display:flex;border-bottom:2px solid var(--line);margin-bottom:20px;gap:0}
.bc-tab{padding:10px 22px;border:0;background:none;font:700 13px Inter;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s}
.bc-tab:hover{color:var(--ink)}
.bc-tab.on{color:var(--green-800);border-bottom-color:var(--green-700)}
.bc-ctx{background:var(--green-50);border:1px solid var(--green-100);padding:9px 14px;border-radius:8px;font-size:12.5px;color:var(--green-900);margin-bottom:14px}
.bc-ctx b{color:var(--green-700)}
.bc-tbl{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:13px}
.bc-tbl th{text-align:left;padding:7px 10px;background:var(--green-50);font:700 11px Inter;color:var(--green-800);text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--green-100)}
.bc-tbl td{padding:5px 7px;border:1px solid var(--line)}
.bc-tbl td input{width:100%;border:0;background:transparent;padding:5px 7px;font:500 12.5px Inter}
.bc-tbl td input:focus{outline:1px solid var(--green-700);background:#fff}
.bc-tbl .bc-tbl-x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 8px;border-radius:5px}

.bc-tbl-add:hover{background:var(--green-50);border-style:solid}

/* v0.22 — CEO Portfolio par entité */
.ceo-annual-tbl{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:18px}
.ceo-annual-tbl thead{background:var(--green-900);color:#fff}

.ceo-annual-tbl th.num{text-align:center}
.ceo-annual-tbl th.right{text-align:right}
.ceo-annual-tbl tbody tr{border-bottom:1px solid var(--line)}
.ceo-annual-tbl tbody tr:nth-child(odd){background:#fafbf9}
.ceo-annual-tbl td{padding:10px 14px}
.ceo-annual-tbl td.year{font:800 14px 'Cormorant Garamond',serif;color:var(--green-900)}
.ceo-annual-tbl td.num{text-align:center;font-weight:600}
.ceo-annual-tbl td.right{text-align:right;font-weight:700;color:var(--green-900);font-variant-numeric:tabular-nums}
.ceo-ent-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:18px}
.ceo-ent-h{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px}
.ceo-ent-nm{font:800 17px 'Cormorant Garamond',serif;color:var(--green-900);letter-spacing:-.01em}
.ceo-ent-sub{font:500 12px Inter;color:var(--muted);margin-top:3px}
.ceo-ent-sub b{color:var(--ink-2);font-weight:700}
.ceo-ent-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ceo-ent-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ceo-ent-tbl thead{background:var(--green-50)}
.ceo-ent-tbl th{padding:7px 10px;font:700 11px Inter;color:var(--green-800);text-transform:uppercase;letter-spacing:.04em;text-align:left;border-bottom:1px solid var(--green-100)}
.ceo-ent-tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ceo-ent-tbl td.reg{font:700 12.5px Inter;color:var(--green-900)}
.ceo-ent-tbl td.num{text-align:center;font-weight:700}
.ceo-ent-tbl td.right{text-align:right;font-weight:700;color:var(--green-900)}
.ceo-ent-tbl td select{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:600 12px Inter;background:#fff}
.ceo-ent-tbl td textarea{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:6px;font:500 11px Inter;resize:vertical;min-height:40px}
.ceo-ent-tbl select.ok{border-color:var(--ok)}
.ceo-ent-tbl select.warn{border-color:var(--amber);background:#fffaf0}
.ceo-ent-tbl select.bad{border-color:var(--bad)}
.ceo-ent-tbl textarea.warn{border-color:var(--amber)}

/* v0.22 — World Map */
.wmap-wrap{position:relative;background:linear-gradient(180deg,#f8fbf8,#fff);border-radius:14px;padding:16px;border:1px solid var(--line)}
.wmap-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-bottom:18px}
.wmap-h{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.wmap-h h3{margin:0;font:700 17px 'Cormorant Garamond',Georgia,serif;color:var(--green-900);letter-spacing:-.01em;line-height:1.25}
.wmap-h-note{font:600 10.5px Inter;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;max-width:300px;text-align:right;line-height:1.4}
.wmap-svg{width:100%;height:auto;display:block;max-height:520px}
.wmap-country{fill:#e6efe9;stroke:#fff;stroke-width:.5;transition:fill .25s var(--ease-out-quart)}
.wmap-bubble-t{fill:#e3a23c;opacity:.92;cursor:pointer;transition:opacity .15s;stroke:#fff;stroke-width:2}
.wmap-bubble-d{fill:var(--green-700);opacity:.92;cursor:pointer;transition:opacity .15s;stroke:#fff;stroke-width:2}
.wmap-bubble-t:hover,.wmap-bubble-d:hover{opacity:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.wmap-bubble-lbl{font:700 11px Inter;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wmap-region-lbl{font:700 11.5px Inter;fill:var(--green-900);text-anchor:middle;pointer-events:none}
.wmap-progress{font:500 10px Inter;fill:var(--muted);text-anchor:middle;pointer-events:none}
.wmap-foot{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding-top:14px;margin-top:10px;border-top:1px solid var(--line)}
.wmap-legend{display:flex;gap:18px;flex-wrap:wrap;font:500 12px Inter;color:var(--ink-2)}
.wmap-legend .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:5px}
.wmap-scale{display:flex;align-items:center;gap:5px;font:600 11px Inter;color:var(--muted)}
.wmap-scale-lbl{margin-right:3px;text-transform:uppercase;letter-spacing:.04em;font-size:10.5px}
.wmap-scale i{width:14px;height:14px;display:inline-block;border-radius:3px}
.wmap-scale-end{font:600 10.5px 'JetBrains Mono',monospace;color:var(--muted)}

/* v0.22.1 — Project cards Halima-style (Global Portfolio list) */
.prjh-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:12px}
.prjh-filters{display:flex;gap:8px;flex-wrap:wrap}
.prjh-filt{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;font:600 12.5px Inter;color:var(--ink);min-width:160px;cursor:pointer;transition:border-color .15s}
.prjh-filt:hover{border-color:var(--green-400)}
.prjh-filt:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 3px rgba(46,125,50,.12)}
.prjh-grid{display:flex;flex-direction:column;gap:10px}
.prjh-card{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 22px;cursor:pointer;transition:transform .15s var(--ease-out-quart),border-color .15s,box-shadow .15s}
.prjh-card:hover{transform:translateY(-1px);border-color:var(--green-200);box-shadow:0 6px 24px -8px rgba(8,30,16,.12)}
.prjh-play{width:36px;height:36px;border-radius:50%;background:var(--green-50);border:1.5px solid var(--green-100);color:var(--green-700);display:grid;place-items:center;transition:.15s;flex-shrink:0}
.prjh-card:hover .prjh-play{background:var(--green-100);color:var(--green-800)}
.prjh-play svg{width:14px;height:14px;margin-left:2px}
.prjh-main{min-width:0;flex:1}
.prjh-eye{font:700 11px 'JetBrains Mono',ui-monospace,monospace;color:var(--muted);letter-spacing:-.01em;margin-bottom:2px}
.prjh-title{font:700 17px/1.25 'Cormorant Garamond',Georgia,serif;color:var(--green-900);letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
.prjh-badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.prjh-badge{display:inline-flex;align-items:center;gap:4px;font:600 11px Inter;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#f5f7f5;color:var(--ink-2);white-space:nowrap}
.prjh-badge.bg-soft{background:var(--green-50);color:var(--green-800);border-color:var(--green-100)}
.prjh-badge.bg-ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.prjh-badge.bg-ok-soft{background:#ecfdf3;color:#067647;border-color:#abefc6}
.prjh-badge.bg-info{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.prjh-badge.bg-coin{background:#fffaf0;color:#92400e;border-color:#fde68a;font-weight:700;font-variant-numeric:tabular-nums}
.prjh-count{text-align:right;flex-shrink:0;padding-left:14px;border-left:1px solid var(--line)}
.prjh-num{font:800 32px 'Cormorant Garamond',serif;color:var(--green-900);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.prjh-cntlbl{font:500 11px Inter;color:var(--muted);margin-top:3px;white-space:nowrap}
@media(max-width:760px){
  .prjh-card{grid-template-columns:auto 1fr;gap:10px;padding:14px 16px}
  .prjh-count{grid-column:1/-1;text-align:left;border-left:0;border-top:1px solid var(--line);padding-left:0;padding-top:8px;margin-top:4px;display:flex;align-items:baseline;gap:10px}
  .prjh-num{font-size:24px}
  .prjh-title{white-space:normal}
  .prjh-toolbar{flex-direction:column;align-items:stretch}
  .prjh-filt{min-width:0;width:100%}
}

.reg-split{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.reg-split-toggles{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.reg-split-toggles .btn{font:600 12px Inter;padding:7px 14px;border-radius:8px}
.reg-split-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.reg-split-lbl{width:130px;flex-shrink:0;font:700 12.5px Inter;color:var(--green-900)}
.reg-split-bar-wrap{flex:1;height:24px;border-radius:6px;background:#f3f5f3;display:flex;overflow:hidden}
.reg-split-bar-t{background:#e3a23c;display:flex;align-items:center;justify-content:center;font:700 11px Inter;color:#fff;min-width:24px}
.reg-split-bar-d{background:var(--green-500);display:flex;align-items:center;justify-content:center;font:700 11px Inter;color:#fff;min-width:24px}
.reg-split-bar-b{background:var(--green-700);display:flex;align-items:center;padding-left:8px;font:700 11px Inter;color:#fff;height:100%}
.reg-split-num{width:110px;flex-shrink:0;text-align:right;font:600 12px Inter;color:var(--ink-2)}
.reg-split-num b{font-weight:700;color:var(--green-900)}
.reg-split-num small{display:block;font:500 10px Inter;color:var(--muted);font-weight:400}
.reg-split-total{margin-top:14px;padding:10px 14px;background:var(--green-50);border-radius:8px;font:700 12.5px Inter;color:var(--green-900);display:flex;justify-content:space-between}

@media(max-width:760px){
  .uc-blocks{grid-template-columns:1fr}
  .wiz-sel-grid{grid-template-columns:1fr}
  .ceo-ent-tbl{font-size:11px}

  .reg-split-row{flex-wrap:wrap}
  .reg-split-lbl{width:100%}
  .reg-split-num{width:auto;text-align:left;margin-top:4px}
  .bc-tabs{overflow-x:auto;flex-wrap:nowrap}
  .bc-tab{white-space:nowrap}
}

/* ==========================================================================
 * AI CHAT panel (slide-in from right)
 * ========================================================================== */
.chat{grid-area:chat;background:linear-gradient(180deg,#0a1812 0%,#07140c 100%);color:#dff0e3;display:flex;flex-direction:column;border-left:1px solid rgba(124,252,154,.15);position:relative;overflow:hidden;min-width:0}
.chat-h{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:0}
.chat-h .ai-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7cfc9a,#3f9c5d);display:grid;place-items:center;font:900 13px 'Inter';color:#04100a;flex-shrink:0}
.chat-h .nm-wrap{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;overflow:hidden}
.chat-h .nm{font:700 13.5px 'Inter';color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h .sub{font:500 11px 'Inter';color:#7cfc9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-h .x{margin-left:auto;color:#bcd4c2;padding:6px;border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-size:18px;flex-shrink:0;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);transition:background .15s,color .15s,border-color .15s}
.chat-h .x:hover{background:rgba(255,82,82,.15);color:#fff;border-color:rgba(255,82,82,.4)}
.chat-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.chat-msg{display:flex;gap:10px;animation:msgIn .25s ease;min-width:0}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chat-msg .av{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;font:800 11px 'Inter';color:#bcd4c2;flex-shrink:0}
.chat-msg.you .av{background:var(--green-700);color:#fff}
.chat-msg.ai .av{background:linear-gradient(135deg,#7cfc9a,#3f9c5d);color:#04100a}
.chat-msg .bub{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:9px 12px;font-size:13.5px;line-height:1.55;min-width:0;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.chat-msg.you .bub{background:rgba(124,252,154,.08);border-color:rgba(124,252,154,.18)}
.chat-msg .bub b{color:#fff}
.chat-msg .bub h1,.chat-msg .bub h2,.chat-msg .bub h3,.chat-msg .bub h4{font-family:'Inter',sans-serif;color:#fff;margin:8px 0 4px;font-weight:700;font-size:14px}
.chat-msg .bub ul,.chat-msg .bub ol{padding-left:18px;margin:4px 0}
.chat-msg .bub li{margin:2px 0}
.chat-msg .bub code{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px;font:600 12px var(--mono);color:#7cfc9a}
.chat-msg .bub a{color:#7cfc9a;text-decoration:underline}
.chat-msg .bub table{border-collapse:collapse;margin:6px 0;font-size:12px}
.chat-msg .bub th,.chat-msg .bub td{padding:4px 8px;border:1px solid rgba(255,255,255,.1);text-align:left}
.chat-msg .bub th{background:rgba(255,255,255,.05);font-weight:700;color:#fff}
.chat-msg.thinking .bub{color:#7cfc9a;font-style:italic}
.chat-msg.thinking .bub::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#7cfc9a;margin-left:4px;animation:dot 1s infinite}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.chat-sugs{padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:5px;flex-shrink:0;max-height:38vh;overflow-y:auto}
.chat-sugs .l{font:700 10px 'Inter';color:#5d7a68;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.chat-sugs button{text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:7px;padding:7px 10px;color:#bcd4c2;font:500 12px 'Inter';transition:background .15s,color .15s;cursor:pointer;line-height:1.4;word-break:break-word;overflow-wrap:anywhere}
.chat-sugs button:hover{background:rgba(124,252,154,.1);color:#fff;border-color:rgba(124,252,154,.25)}
.chat-input-wrap{padding:12px 18px 14px;border-top:1px solid rgba(255,255,255,.06);background:#04100a;flex-shrink:0}
.chat-input{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:6px 6px 6px 12px;transition:border-color .15s}
.chat-input:focus-within{border-color:rgba(124,252,154,.4)}
.chat-input textarea{flex:1;background:none;border:0;outline:0;color:#fff;font:500 13.5px 'Inter';resize:none;padding:6px 0;max-height:140px;line-height:1.4}
.chat-input textarea::placeholder{color:#5d7a68}
.chat-input .send{background:#7cfc9a;color:#04100a;width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-size:14px;font-weight:800;cursor:pointer;transition:background .15s}
.chat-input .send:hover{background:#a8ffbe}
.chat-input .send:disabled{background:#3f4a44;color:#7c9c87;cursor:not-allowed}
.chat-meta{font:500 10.5px 'Inter';color:#5d7a68;margin-top:6px;text-align:center}

/* ==========================================================================
 * MODAL (Use Case detail)
 * ========================================================================== */
.modal-bg{position:fixed;inset:0;background:rgba(7,20,12,.55);display:none;align-items:flex-start;justify-content:center;z-index:90;padding:30px;overflow-y:auto;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:var(--rad-lg);max-width:880px;width:100%;box-shadow:var(--shadow-lg);overflow:hidden;animation:modalIn .22s ease}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.modal-h{padding:18px 24px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:14px}
.modal-h .ttl{flex:1;min-width:0}
.modal-h .ttl .eye{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.modal-h .ttl h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;margin:0;color:var(--ink);line-height:1.15}
.modal-h .ttl .meta{font:500 12.5px 'Inter';color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.modal-h .x{color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.modal-h .x:hover{background:var(--soft);color:var(--ink)}
.modal-body{padding:20px 24px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;max-height:calc(100vh - 220px);overflow-y:auto}
@media(max-width:780px){.modal-body{grid-template-columns:1fr;gap:14px}}
.modal-foot{padding:14px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fbfdfb}
.modal-foot .sp{flex:1}
.uc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.uc-cell{font-size:13px}
.uc-cell .lbl{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:3px}
.uc-cell .val{font-weight:700;color:var(--ink)}
.uc-cell .val.muted{color:var(--muted);font-weight:500;font-style:italic}
.uc-sect{margin-top:18px}
.uc-sect h4{font:700 12px 'Inter';color:var(--green-800);text-transform:uppercase;letter-spacing:.07em;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.uc-sect h4::before{content:"";width:14px;height:2px;background:var(--green-500);border-radius:2px}
.uc-sect p{font-size:13.5px;color:var(--ink-2);margin:0 0 8px;line-height:1.55}
.uc-kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.uc-kpi .it{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.uc-kpi .it .k{font:700 10px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.uc-kpi .it .v{font:700 14px 'Inter';color:var(--ink);margin-top:1px}
.gate-list{display:flex;flex-direction:column;gap:8px}
.gate-it{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfdfb}
.gate-it.done{border-color:var(--green-200);background:var(--green-50)}
.gate-it.cur{border-color:var(--warn);background:var(--warn-bg);box-shadow:0 0 0 2px rgba(180,83,9,.12)}
.gate-it .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font:800 11px 'Inter';color:var(--muted);flex-shrink:0}
.gate-it.done .ico{background:var(--green-700);border-color:var(--green-700);color:#fff}
.gate-it.cur .ico{background:var(--warn);border-color:var(--warn);color:#fff}
.gate-it .b{flex:1;min-width:0}
.gate-it .b b{font:700 12.5px 'Inter';color:var(--ink);display:block}
.gate-it .b span{font:500 11.5px 'Inter';color:var(--muted)}
.gate-it .b .dec{font:700 11px 'Inter';margin-top:3px;display:inline-flex;align-items:center;gap:4px}
.gate-it .b .dec.go{color:var(--ok)}
.gate-it .b .dec.hold{color:var(--warn)}
.gate-it .b .dec.kill{color:var(--bad)}

/* ==========================================================================
 * Intake form
 * ========================================================================== */
.form-section{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:20px 22px;margin-bottom:14px}
.form-section h3{font:700 14px 'Inter';color:var(--green-800);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px}
.form-section .sub{font:500 12.5px 'Inter';color:var(--muted);margin:0 0 14px}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
.form-grid .full{grid-column:1/-1}
@media(max-width:680px){.form-grid{grid-template-columns:1fr}}
.fld label{display:block;font:700 11px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 5px}
.fld label .req{color:var(--bad);margin-left:3px}
.fld label .opt{color:var(--muted-2);font-weight:500;text-transform:none;margin-left:6px;letter-spacing:0}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:500 13.5px 'Inter';background:#fff;color:var(--ink);transition:border-color .15s,background .15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--green-500);background:#fafdfa}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld .help{font:500 11.5px 'Inter';color:var(--muted);margin-top:5px}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--bad);background:var(--bad-bg)}
.fld.bad .help{color:var(--bad)}
.opt-grid{display:flex;gap:8px;flex-wrap:wrap}
.opt-grid .opt{flex:1;min-width:140px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.opt-grid .opt:hover{border-color:var(--green-300)}
.opt-grid .opt.on{border-color:var(--green-500);background:var(--green-50);box-shadow:0 0 0 1px var(--green-500) inset}
.opt-grid .opt .nm{font:700 13px 'Inter';color:var(--ink)}
.opt-grid .opt .dd{font:500 11.5px 'Inter';color:var(--muted);margin-top:2px}
.steps-bar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.steps-bar .s{display:flex;align-items:center;gap:8px;font:600 12px 'Inter';color:var(--muted)}
.steps-bar .s .n{width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font:800 11px 'Inter'}
.steps-bar .s.on{color:var(--ink)}.steps-bar .s.on .n{background:var(--green-700);border-color:var(--green-700);color:#fff}
.steps-bar .s.done{color:var(--green-700)}.steps-bar .s.done .n{background:var(--green-50);border-color:var(--green-500);color:var(--green-800)}
.steps-bar .s.done .n::before{content:"✓"}
.steps-bar .s.done .n .num{display:none}
.steps-bar .conn{flex:0 0 26px;height:1px;background:var(--line)}
.mds-row{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfdfb;font-size:12.5px;margin-bottom:4px}
.mds-row.ok{border-color:var(--green-200);background:var(--green-50)}
.mds-row.miss{border-color:#f0c9c9;background:var(--bad-bg)}
.mds-row .ico{width:18px;text-align:center}
.mds-row .nm{flex:1;font-weight:600;color:var(--ink)}
.mds-row.miss .ico{color:var(--bad)}
.mds-row.ok .ico{color:var(--ok)}

/* ==========================================================================
 * CALENDAR (Gantt-style annual cycle)
 * ========================================================================== */
.cal-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:18px;overflow-x:auto}
.cal-grid{display:grid;grid-template-columns:200px repeat(12,1fr);gap:1px;min-width:880px}
.cal-grid.cal16{grid-template-columns:170px repeat(16,1fr);min-width:1180px}
.cal-h{font:700 10.5px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.cal-h.lbl{text-align:left;padding-left:8px}
.cal-h.today{color:var(--green-700);background:var(--green-50);border-radius:6px}
.cal-h.cal-h-prev{color:#8aa195;background:#f5f9f6;font-size:9.5px}
.cal-h.cal-h-qbr{background:#eaf3f8;color:#1d5e94}
.cal-h.cal-h-qbr .qbr-dot{display:block;font:800 8.5px 'Inter';color:#0e4f6e;margin-top:2px;letter-spacing:.05em}
.cal-row{display:contents}
.cal-row .cal-lbl{font:600 12.5px 'Inter';color:var(--ink);padding:9px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.cal-row .cal-lbl small{font:500 10.5px 'Inter';color:var(--muted);margin-top:1px}
.cal-row .cal-cell{position:relative;border-bottom:1px solid var(--line);min-height:42px;border-right:1px dashed var(--line)}
.cal-bar{position:absolute;top:7px;height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font:700 11px 'Inter';color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:transform .12s,box-shadow .15s;background:var(--green-700)}
.cal-bar:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);z-index:2}
.cal-bar.b-gate{background:#8c6a0a}
.cal-bar.b-cycle{background:var(--green-900)}
.cal-bar.b-fast{background:#a01f1f}
.cal-bar.b-qbr{background:#155679}
.cal-bar.b-launch{background:var(--green-700)}
.cal-bar.b-readiness{background:#7c5b07}
.cal-bar.b-exec{background:#155679}
.cal-bar.b-decision{background:#583c8d}
.legend-sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.legend-sw.b-launch{background:var(--green-700)}
.legend-sw.b-readiness{background:#7c5b07}
.legend-sw.b-exec{background:#155679}
.legend-sw.b-decision{background:#583c8d}
.legend-sw.b-gate{background:#8c6a0a}
.legend-sw.b-qbr{background:#155679;border:1px dashed #1d5e94}
.legend-sw.b-fast{background:#a01f1f}

/* ==========================================================================
 * RACI matrix
 * ========================================================================== */
.raci{font-size:12.5px}
.raci-cell{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font:800 10.5px 'Inter';color:#fff}
.raci-cell.r{background:var(--raci-r)}
.raci-cell.a{background:var(--raci-a)}
.raci-cell.c{background:var(--raci-c)}
.raci-cell.i{background:var(--raci-i)}

/* Closure KB cards */
.kb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.kb-card{background:#fff;border:1px solid var(--line);border-radius:var(--rad-md);padding:16px 18px;transition:transform .12s,box-shadow .15s,border-color .15s;cursor:pointer}
.kb-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--green-200)}
.kb-card .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kb-card .h .pill{font-size:10px}
.kb-card h4{font:700 14.5px 'Inter';color:var(--ink);margin:0 0 6px;line-height:1.3}
.kb-card .ll{font:500 12px 'Inter';color:var(--muted);margin-bottom:8px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kb-card .ft{display:flex;align-items:center;gap:8px;font:500 11.5px 'Inter';color:var(--muted-2)}

/* generic */
.muted{color:var(--muted)}
.sp-y-lg{margin:24px 0}
.empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13.5px;background:linear-gradient(180deg,var(--green-25) 0%,#fff 70%);border-radius:var(--rad-md);border:1px dashed var(--green-100)}
.empty .big{font-size:36px;display:block;margin-bottom:8px;opacity:.55}
.empty .big{font-size:38px;margin-bottom:10px;opacity:.5}

/* tiny toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#07140c;color:#dff0e3;border:1px solid rgba(124,252,154,.4);border-radius:10px;padding:11px 18px;font:600 13px 'Inter';box-shadow:var(--shadow-lg);opacity:0;transition:opacity .25s,transform .25s;z-index:9000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* scrollbars */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
.chat-body::-webkit-scrollbar-thumb,.chat-body::-webkit-scrollbar-thumb{background:#2c3a32}
.sidebar ::-webkit-scrollbar-thumb{background:#2c3a32}

/* responsive */
@media(max-width:780px){.h-pg{font-size:24px}}

.fb-btn{background:rgba(255,193,7,.12);color:#ffd54f;border:1px solid rgba(255,193,7,.3);border-radius:8px;padding:6px 11px;font:700 11.5px 'Inter';cursor:pointer}
.fb-btn:hover{background:rgba(255,193,7,.2)}

/* ===== Admin · Référentiels CRUD (v0.8) ===== */

.ref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:900px){.ref-grid{grid-template-columns:1fr}}
.ref-card{display:flex;flex-direction:column;gap:10px}

.ref-count{font:700 11px 'Inter';color:var(--green-800);background:var(--green-50);border:1px solid var(--green-100);border-radius:999px;padding:1px 9px}
.ref-prov{font:700 9.5px 'Inter';letter-spacing:.05em;text-transform:uppercase;color:var(--muted-2);background:#f4f6f3;border:1px solid var(--line);border-radius:6px;padding:2px 7px}

.ref-chip-inp{border:1px solid var(--green-700);border-radius:6px;padding:2px 6px;font:500 12.5px 'Inter';background:#fff;outline:none;box-shadow:0 0 0 2px rgba(46,125,50,.12);min-width:90px}

.ref-chip-x,.ref-chip button{border:0;background:#eef0ec;color:var(--muted);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;transition:.15s}
.ref-chip-x:hover,.ref-chip button:hover{background:var(--bad-bg);color:var(--bad)}

.ref-inp:focus{outline:none;border-color:var(--green-700);box-shadow:0 0 0 2px rgba(46,125,50,.12);background:#fff}

.proj-banner{display:flex;align-items:center;gap:8px;background:var(--green-50);border:1px solid var(--green-100);border-radius:10px;padding:9px 14px;margin:0 0 14px;font-size:13px}

/* ===== Dashboards (vue dédiée) ===== */

.dash-kpi .v small{font-size:16px;color:var(--muted);font-weight:600}
.dash-kpi .s{font-size:12px;color:var(--muted);margin-top:3px;min-height:1px}
.dash-bar{height:7px;border-radius:5px;background:var(--green-50);overflow:hidden;margin-top:10px}
