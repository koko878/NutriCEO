<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D²nAI Office · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-900:#103d17;--green-800:#1B5E20;--green-700:#2E7D32;--green-600:#2f8a39;
  --green-500:#4CAF50;--green-300:#66BB6A;--green-100:#D6EADb;--green-50:#EAF4EC;
  --ink:#10231a;--ink-2:#1f3a2a;--muted:#5c6b62;--line:#e3ebe5;--line-2:#cfdcd4;
  --bad:#B91C1C;--bad-bg:#fdeced;--ok:#15803D;--ok-bg:#dcfce7;
  --warn:#B45309;--warn-bg:#fef3c7;--info:#0e4f6e;--info-bg:#dff1fb;
  --soft:#f5f9f6;--bg-deep:#07140c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--soft);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit}

.bar{background:linear-gradient(180deg,#07140c,#0c1f14);color:#dff0e3;border-bottom:1px solid rgba(124,252,154,.15);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
.bar .nm{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;color:#fff;display:flex;align-items:baseline;gap:6px}
.bar .nm b{color:#7cfc9a}
.bar .nm small{font:600 10px 'Inter';color:#7c9c87;text-transform:uppercase;letter-spacing:.1em;margin-left:8px}
.bar .sp{flex:1}
.bar .user{font:500 12.5px 'Inter';color:#9fb3a6}
.bar .user b{color:#fff;font-weight:700}
.bar .save-btn{background:#7cfc9a;color:#04100a;font:800 13px 'Inter';padding:9px 18px;border-radius:8px}
.bar .save-btn:hover{background:#a8ffbe}
.bar .save-btn:disabled{background:#5d7a68;color:#9fb3a6;cursor:not-allowed}

.shell{max-width:1180px;margin:0 auto;padding:24px 28px 60px;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start}
@media(max-width:880px){.shell{grid-template-columns:1fr}}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:4px}
.side button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;font:700 13px 'Inter';color:var(--muted);text-align:left;transition:background .15s,color .15s}
.side button:hover{background:#fff;color:var(--ink)}
.side button.on{background:var(--green-700);color:#fff}
.side button .ico{font-size:15px;width:18px;text-align:center}
.side .sec{font:700 10px 'Inter';color:var(--muted-2);letter-spacing:.1em;text-transform:uppercase;padding:14px 12px 6px}

.main{min-width:0}
.panel{display:none;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.eyebrow{font:700 11px 'Inter';color:var(--green-700);text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.h-pg{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;margin:0 0 6px}
.lead{color:var(--muted);font-size:13.5px;margin:0 0 18px;max-width:72ch}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-bottom:14px}
.card h3{margin:0 0 12px;font:700 15px 'Inter'}
.card h3 .sub{font:500 12px 'Inter';color:var(--muted);font-style:italic;margin-left:6px}

.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font:700 11px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fld label .req{color:var(--bad);margin-left:3px}
.fld input[type="text"],.fld input[type="url"],.fld input[type="password"],.fld input[type="email"],.fld input[type="number"],.fld select,.fld textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:500 13.5px 'Inter';color:var(--ink);background:#fafdfa}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--green-500);background:#fff}
.fld textarea{min-height:88px;resize:vertical;line-height:1.5}
.fld .help{font:500 11.5px 'Inter';color:var(--muted)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:680px){.row-2{grid-template-columns:1fr}}

.toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);border-radius:9px;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--green-700);cursor:pointer}
.toggle.on{background:var(--green-50);border-color:var(--green-200)}
.toggle .lbl{font:700 13px 'Inter';color:var(--ink)}
.toggle .hint{font:500 12px 'Inter';color:var(--muted)}

.chip-list{display:flex;flex-direction:column;gap:6px}
.chip-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fafdfa;border:1px solid var(--line);border-radius:8px;font:500 13px 'Inter'}
.chip-row.wl{border-color:var(--green-200);background:var(--green-50)}
.chip-row.bl{border-color:#f0c9c9;background:var(--bad-bg)}
.chip-row.tl{border-color:#fcd34d;background:var(--warn-bg)}
.chip-row .addr{flex:1;font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;font-size:12.5px;color:var(--ink-2)}
.chip-row .x{padding:3px 8px;border-radius:5px;font:800 11px 'Inter';color:var(--muted)}
.chip-row .x:hover{background:rgba(0,0,0,.05);color:var(--bad)}
.chip-add{display:flex;gap:8px;margin-top:8px}
.chip-add input{flex:1}
.chip-add button{background:var(--green-700);color:#fff;font:700 12px 'Inter';padding:8px 14px;border-radius:8px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:780px){.kpi-grid{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .k{font:700 10.5px 'Inter';color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--green-800);line-height:1}
.kpi .d{font:600 11.5px 'Inter';color:var(--muted);margin-top:5px}

.log-table{width:100%;border-collapse:collapse;font-size:13px}
.log-table th{font:700 10.5px 'Inter';text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:9px 10px;text-align:left;background:#fbfdfb;border-bottom:1px solid var(--line)}
.log-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.log-table tr:hover td{background:#fafdfa}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 10.5px 'Inter';padding:2px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-bad{background:var(--bad-bg);color:var(--bad)}
.pill-info{background:var(--info-bg);color:var(--info)}
.pill-mute{background:#eef0ef;color:#5c6b62}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#07140c;color:#dff0e3;border:1px solid rgba(124,252,154,.4);border-radius:10px;padding:11px 18px;font:600 13px 'Inter';box-shadow:0 24px 60px -20px rgba(0,0,0,.4);opacity:0;transition:opacity .25s,transform .25s;z-index:9000;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:rgba(255,82,82,.5)}

.code-box{background:#0a1812;color:#dff0e3;border-radius:10px;padding:14px 16px;font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.code-box b{color:#7cfc9a}

.empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:13.5px;background:var(--soft);border-radius:10px}
</style>
</head>
<body>

<div class="bar">
  <div class="nm">D²nAI · <b>Office</b> <small>· console</small></div>
  <div class="sp"></div>
  <div class="user">Connecté en tant que <b id="userName">—</b></div>
  <button class="save-btn" id="saveBtn">Enregistrer</button>
</div>

<div class="shell">
  <aside class="side">
    <div class="sec">Configuration</div>
    <button class="on" data-p="general"><span class="ico">⚙️</span>Général</button>
    <button data-p="contacts"><span class="ico">👥</span>Contacts</button>
    <button data-p="topics"><span class="ico">🛡️</span>Garde-fous</button>
    <button data-p="persona"><span class="ico">🎭</span>Persona</button>
    <div class="sec">Monitoring</div>
    <button data-p="activity"><span class="ico">📜</span>Activité</button>
    <button data-p="agent"><span class="ico">💻</span>Agent local</button>
  </aside>

  <main class="main">
    <section class="panel on" id="p-general"></section>
    <section class="panel" id="p-contacts"></section>
    <section class="panel" id="p-topics"></section>
    <section class="panel" id="p-persona"></section>
    <section class="panel" id="p-activity"></section>
    <section class="panel" id="p-agent"></section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =============================================================================
 * D²nAI Office · Console
 * Pilots the local Windows agent through a REST API the agent calls home to.
 * ============================================================================= */
const BR = window.DNAI_OFFICE || {};
const STATE = { cfg: Object.assign({
  backend_url:'', backend_token:'', poll_seconds:30,
  delay_send_minutes:5, delay_send_enabled:true,
  digest_to:'', personal_context:'',
  whitelist:[], blacklist:[], watchlist:[],
  allowed_topics:['project_questions','info_requests','meeting_screening','contact_routing'],
  auto_send_enabled:false,
  signature:"Hamza's digital twin — D²nAI"
}, BR.config||{}), dirty:false, activity:[] };

document.getElementById('userName').textContent = BR.user || '—';

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function toast(msg, bad){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast'+(bad?' bad':'')+' show'; clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2400); }
function markDirty(){ STATE.dirty=true; document.getElementById('saveBtn').textContent='Enregistrer ●'; }

document.querySelectorAll('.side button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.side button').forEach(x=>x.classList.toggle('on', x===b));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='p-'+b.dataset.p));
  if(b.dataset.p==='activity') refreshActivity();
});

/* ----- panel renderers ----- */
function renderGeneral(){
  const c=STATE.cfg;
  document.getElementById('p-general').innerHTML=`
    <div class="eyebrow">Configuration · général</div>
    <h2 class="h-pg">Réglages du backend &amp; du cadencement</h2>
    <p class="lead">Ces réglages pilotent comment l'agent local (sur ton poste Windows) appelle le backend IA D²nAI et à quelle fréquence il scrute ta boîte mail.</p>

    <div class="card">
      <h3>Backend D²nAI <span class="sub">— où l'agent envoie ses requêtes LLM</span></h3>
      <div class="row-2">
        <div class="fld">
          <label>URL du backend <span class="req">*</span></label>
          <input type="url" id="backend_url" value="${escapeHtml(c.backend_url)}" placeholder="https://...">
          <span class="help">Endpoint <code>/v1/chat</code> du proxy D²nAI déjà déployé.</span>
        </div>
        <div class="fld">
          <label>Token d'accès <span class="req">*</span></label>
          <input type="password" id="backend_token" value="${escapeHtml(c.backend_token)}" placeholder="••••••">
          <span class="help">Stocké côté serveur uniquement — l'agent le lit via REST authentifié.</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Cadencement &amp; envoi</h3>
      <div class="row-2">
        <div class="fld">
          <label>Polling Outlook (secondes)</label>
          <input type="number" id="poll_seconds" min="10" value="${c.poll_seconds}">
          <span class="help">Toutes les X secondes, l'agent scanne les nouveaux mails reçus.</span>
        </div>
        <div class="fld">
          <label>Délai d'envoi révocable (minutes)</label>
          <input type="number" id="delay_send_minutes" min="0" value="${c.delay_send_minutes}">
          <span class="help">Fenêtre pendant laquelle tu peux intercepter un draft avant qu'il parte.</span>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
        <label class="toggle ${c.delay_send_enabled?'on':''}">
          <input type="checkbox" id="delay_send_enabled" ${c.delay_send_enabled?'checked':''}>
          <div><div class="lbl">Délai d'envoi activé</div><div class="hint">Si désactivé, l'envoi est immédiat (déconseillé en pilote).</div></div>
        </label>
        <label class="toggle ${c.auto_send_enabled?'on':''}">
          <input type="checkbox" id="auto_send_enabled" ${c.auto_send_enabled?'checked':''}>
          <div><div class="lbl">Envoi automatique (whitelist)</div><div class="hint">Sur les contacts whitelist uniquement. Les autres restent en draft.</div></div>
        </label>
      </div>
    </div>

    <div class="card">
      <h3>Digest quotidien</h3>
      <div class="fld">
        <label>Email pour le digest 18h</label>
        <input type="email" id="digest_to" value="${escapeHtml(c.digest_to)}" placeholder="hamza@...">
        <span class="help">Résumé envoyé chaque soir : mails traités, drafts générés, escalations.</span>
      </div>
    </div>
  `;
  ['backend_url','backend_token','poll_seconds','delay_send_minutes','digest_to'].forEach(id=>{
    const el=document.getElementById(id); el.oninput=()=>{ const v = el.type==='number'?(+el.value||0):el.value; STATE.cfg[id]=v; markDirty(); };
  });
  ['delay_send_enabled','auto_send_enabled'].forEach(id=>{
    const el=document.getElementById(id);
    el.onchange=()=>{ STATE.cfg[id]=el.checked; el.parentElement.classList.toggle('on',el.checked); markDirty(); };
  });
}

function renderListPanel(){
  const lists=[
    { key:'whitelist', cls:'wl', icon:'✅', title:'Whitelist — bot-first',     hint:'Ces contacts sont traités prioritairement par l\'agent. Format : adresse exacte ou <code>@domaine.com</code>.' },
    { key:'blacklist', cls:'bl', icon:'🚫', title:'Blacklist — jamais bot',     hint:'Ces contacts ne reçoivent jamais de réponse automatique — tu gères en direct.' },
    { key:'watchlist', cls:'tl', icon:'⚠️', title:'Watchlist — escalade immédiate', hint:'Ces contacts déclenchent une notification immédiate sans traitement bot. CEO, EVPs, contacts stratégiques.' }
  ];
  document.getElementById('p-contacts').innerHTML=`
    <div class="eyebrow">Configuration · contacts</div>
    <h2 class="h-pg">À qui s'adresse le bot, à qui jamais</h2>
    <p class="lead">Tu peux saisir une adresse précise (ex: <code>person@bu.com</code>) ou un domaine entier (ex: <code>@partner.com</code>).</p>
    ${lists.map(L=>`
      <div class="card">
        <h3>${L.icon} ${L.title}</h3>
        <p class="lead" style="margin:0 0 12px">${L.hint}</p>
        <div class="chip-list" id="list-${L.key}"></div>
        <div class="chip-add">
          <input type="text" id="add-${L.key}" placeholder="email@domaine.com  ou  @domaine.com">
          <button data-add="${L.key}">+ Ajouter</button>
        </div>
      </div>
    `).join('')}
  `;
  lists.forEach(L=>renderList(L.key, L.cls));
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.add, inp=document.getElementById('add-'+k);
    const v=(inp.value||'').trim().toLowerCase(); if(!v) return;
    if(!STATE.cfg[k].includes(v)){ STATE.cfg[k].push(v); markDirty(); }
    inp.value=''; renderList(k, lists.find(x=>x.key===k).cls);
  });
}
function renderList(key, cls){
  const host=document.getElementById('list-'+key);
  const arr=STATE.cfg[key]||[];
  host.innerHTML = arr.length ? arr.map((v,i)=>`<div class="chip-row ${cls}"><span class="addr">${escapeHtml(v)}</span><button class="x" data-rm="${key}" data-i="${i}">supprimer ✕</button></div>`).join('')
                              : '<div class="empty">Aucun contact pour le moment.</div>';
  host.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    STATE.cfg[b.dataset.rm].splice(+b.dataset.i,1); markDirty(); renderList(b.dataset.rm, cls);
  });
}

function renderTopics(){
  const allowed=[
    ['project_questions', '📂 Questions sur les projets en cours', 'CGM Cockpit, NutriPlan, MDM, NutriTrials, etc. Le bot s\'appuie sur ton corpus.'],
    ['info_requests',     '💡 Demandes d\'information générales', 'Statut d\'un dossier, point d\'avancement, prochaine étape.'],
    ['meeting_screening', '📅 Filtrage de demandes de meeting',  'Le bot propose un créneau tentatif ou redirige vers le planificateur.'],
    ['contact_routing',   '🔀 Aiguillage vers la bonne personne', '"Qui je dois contacter pour X ?" — le bot répond depuis ta carto réseau.']
  ];
  const forbidden=[
    ['💰 Prix / budget / coût',          'TOUJOURS escaladé. Ne peut pas être désactivé.'],
    ['🤝 Engagement / commitment',       'Le bot ne dira jamais "je confirme" ou "je m\'engage".'],
    ['🔒 Confidentiel / sensible',        'Tout topic marqué confidentiel est escaladé.'],
    ['👔 RH / salaire / promotion',      'Toujours hors-scope du bot.'],
    ['⚖️ Juridique / contrats',           'NDA, litiges, signatures — toujours toi.']
  ];
  document.getElementById('p-topics').innerHTML=`
    <div class="eyebrow">Configuration · garde-fous</div>
    <h2 class="h-pg">Sur quoi le bot peut parler — et sur quoi <b>jamais</b></h2>
    <p class="lead">Double couche : un classifieur scrute les mails entrants, un validateur scrute les réponses générées avant envoi. Si l'un OU l'autre détecte un sujet hors-scope, le bot s'arrête et te transfère.</p>

    <div class="card">
      <h3>✅ Topics autorisés <span class="sub">— ce que le bot peut adresser</span></h3>
      <div class="chip-list">${allowed.map(t=>{
        const on=(STATE.cfg.allowed_topics||[]).includes(t[0]);
        return `<label class="toggle ${on?'on':''}" style="cursor:pointer">
          <input type="checkbox" data-topic="${t[0]}" ${on?'checked':''}>
          <div><div class="lbl">${t[1]}</div><div class="hint">${escapeHtml(t[2])}</div></div>
        </label>`;
      }).join('')}</div>
    </div>

    <div class="card">
      <h3>🛡️ Garde-fous durs <span class="sub">— jamais désactivables, en dur dans le code de l'agent</span></h3>
      <div class="chip-list">${forbidden.map(f=>`
        <div class="chip-row" style="background:#fef3c7;border-color:#fcd34d">
          <span class="addr" style="font-family:Inter,sans-serif;font-size:13.5px;font-weight:700;color:#7c5b07">${f[0]}</span>
          <span class="pill pill-warn">enforced</span>
        </div>
        <div style="font:500 12px Inter;color:var(--muted);padding:0 12px 6px">${escapeHtml(f[1])}</div>
      `).join('')}</div>
    </div>
  `;
  document.querySelectorAll('[data-topic]').forEach(el=>{
    el.onchange=()=>{
      const t=el.dataset.topic;
      const arr=STATE.cfg.allowed_topics=STATE.cfg.allowed_topics||[];
      const i=arr.indexOf(t);
      if(el.checked && i<0) arr.push(t);
      if(!el.checked && i>=0) arr.splice(i,1);
      el.parentElement.classList.toggle('on', el.checked);
      markDirty();
    };
  });
}

function renderPersona(){
  const c=STATE.cfg;
  document.getElementById('p-persona').innerHTML=`
    <div class="eyebrow">Configuration · persona</div>
    <h2 class="h-pg">Voix, signature, contexte personnel</h2>
    <p class="lead">Ce que le bot dit de toi — comment il se présente, ce qu'il sait de tes projets en cours. Injecté dans le system prompt à chaque appel LLM.</p>

    <div class="card">
      <h3>Signature obligatoire</h3>
      <div class="fld">
        <label>Signature de fin de message</label>
        <input type="text" id="signature" value="${escapeHtml(c.signature)}" placeholder="Hamza's digital twin — D²nAI">
        <span class="help">Toujours apposée à la fin des réponses générées. Transparence sur le fait que c'est un bot.</span>
      </div>
    </div>

    <div class="card">
      <h3>Contexte personnel injecté dans le bot</h3>
      <div class="fld">
        <label>Ce que le bot sait de toi</label>
        <textarea id="personal_context" rows="10">${escapeHtml(c.personal_context)}</textarea>
        <span class="help">Tes projets en cours, ton ton, tes priorités, tes points sensibles, les questions que tu en as marre qu'on te pose. Texte libre. Le bot l'utilise comme contexte pour rédiger ses réponses.</span>
      </div>
    </div>
  `;
  ['signature','personal_context'].forEach(id=>{
    document.getElementById(id).oninput=e=>{ STATE.cfg[id]=e.target.value; markDirty(); };
  });
}

function renderAgentPanel(){
  const installPath = '%APPDATA%\\dnai-office\\';
  document.getElementById('p-agent').innerHTML=`
    <div class="eyebrow">Agent local</div>
    <h2 class="h-pg">L'agent qui tourne sur ton poste Windows</h2>
    <p class="lead">L'agent <code>dnai-office-agent.exe</code> s'installe sur ton poste, lit Outlook desktop via MAPI/COM (tes credentials AD à toi), et call-home cette console pour récupérer ta configuration.</p>

    <div class="card">
      <h3>📥 Installation</h3>
      <ol style="margin:0 0 10px 20px;padding:0;font-size:13.5px;line-height:1.7">
        <li>Récupérer le <code>.exe</code> depuis le canal interne D²nAI (à venir).</li>
        <li>Placer le <code>.exe</code> dans <code>${installPath}</code>.</li>
        <li>Créer un raccourci dans <code>shell:startup</code> pour qu'il démarre avec la session Windows.</li>
        <li>Lancer une première fois — il appellera cette console pour récupérer la config.</li>
      </ol>
    </div>

    <div class="card">
      <h3>🔑 URL et token pour l'agent</h3>
      <p class="lead" style="margin:0 0 10px">L'agent utilise ces deux valeurs pour s'authentifier auprès de la console et récupérer ta config :</p>
      <div class="code-box">
URL  : <b>${BR.agent || '—'}</b>
Token: <b id="agent-token-display">(génère un token via le bouton ci-dessous)</b>
      </div>
      <button class="save-btn" style="margin-top:10px" onclick="generateAgentToken()">Générer un token agent</button>
      <p class="help" style="margin-top:8px;font-size:12px;color:var(--muted)">À copier dans <code>${installPath}config.json</code> sur ton poste — l'agent lira ce fichier au démarrage et synchronisera ensuite avec cette console toutes les minutes.</p>
    </div>

    <div class="card">
      <h3>📡 Statut</h3>
      <div class="kpi-grid">
        <div class="kpi"><div class="k">Dernier ping</div><div class="v" style="font-size:18px;font-family:Inter,sans-serif">—</div><div class="d">L'agent n'a pas encore call-home</div></div>
        <div class="kpi"><div class="k">Cycle de poll</div><div class="v">${STATE.cfg.poll_seconds}<span style="font-size:14px;color:var(--muted)">s</span></div><div class="d">Toutes les ${STATE.cfg.poll_seconds} sec</div></div>
        <div class="kpi"><div class="k">Délai d'envoi</div><div class="v">${STATE.cfg.delay_send_enabled?STATE.cfg.delay_send_minutes:'0'}<span style="font-size:14px;color:var(--muted)">min</span></div><div class="d">${STATE.cfg.delay_send_enabled?'révocable':'instantané'}</div></div>
        <div class="kpi"><div class="k">Mode envoi</div><div class="v" style="font-size:16px;font-family:Inter,sans-serif">${STATE.cfg.auto_send_enabled?'auto':'draft only'}</div><div class="d">whitelist uniquement</div></div>
      </div>
    </div>
  `;
}
function generateAgentToken(){
  const t = 'dnai_'+Math.random().toString(36).slice(2,10)+'_'+Date.now().toString(36);
  document.getElementById('agent-token-display').textContent = t;
  toast('Token généré. Copie-le dans config.json sur ton poste.');
  // Note: in V1 we'd also POST it to the WP plugin to register the token in user_meta.
}

async function refreshActivity(){
  const host = document.getElementById('p-activity');
  host.innerHTML = `
    <div class="eyebrow">Monitoring · activité</div>
    <h2 class="h-pg">Ce que l'agent a fait ces derniers jours</h2>
    <p class="lead">Log de chaque mail traité — décision, raison, ce qui a déclenché une escalation.</p>
    <div class="card"><div class="empty">Pas encore d'activité — l'agent n'a pas encore call-home.</div></div>
  `;
  // V1 fetches from BR.log endpoint and renders a table.
}

/* ----- save ----- */
document.getElementById('saveBtn').onclick = async function(){
  if(!STATE.dirty) return;
  try{
    const res = await fetch(BR.save, {
      method:'POST',
      headers:{'Content-Type':'application/json','X-WP-Nonce':BR.nonce||''},
      body: JSON.stringify(STATE.cfg),
    });
    const j = await res.json();
    if(j.ok){
      STATE.cfg = Object.assign(STATE.cfg, j.config||{});
      STATE.dirty=false;
      document.getElementById('saveBtn').textContent='Enregistrer';
      toast('✓ Configuration enregistrée');
    } else {
      toast('Erreur à l\'enregistrement', true);
    }
  } catch(e){
    toast('Backend inaccessible — réessaie plus tard', true);
  }
};

/* ----- init ----- */
renderGeneral();
renderListPanel();
renderTopics();
renderPersona();
renderAgentPanel();
refreshActivity();
</script>
</body>
</html>
